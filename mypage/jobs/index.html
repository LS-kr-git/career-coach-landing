<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<meta name="format-detection" content="telephone=no">
<title>채용공고 받을 직군 — 커리어코치</title>
<meta name="description" content="커리어코치에서 받아볼 채용공고 직군을 고릅니다.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/logo-circle.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    color-scheme: only light;
    --amber-50:#FFFBEB; --amber-100:#FEF3C7; --amber-500:#F59E0B; --amber-600:#D97706;
    --amber-700:#B45309; --amber-800:#92400E; --amber-950:#451A03;
    --emerald-500:#10B981;
    --gray-50:#F8FAFC; --gray-100:#F1F5F9; --gray-200:#E2E8F0; --gray-300:#CBD5E1;
    --gray-400:#94A3B8; --gray-500:#64748B; --gray-600:#475569; --gray-700:#334155;
    --gray-800:#1E293B; --gray-900:#0F172A; --stone-50:#FAFAF9;
    /* CTA 토큰 — CLAUDE.md 「CTA 규칙」 공통값 */
    --cta-h:54px; --cta-radius:14px; --cta-fs:15px; --cta-fw:700;
    /* 랜딩과 동일한 폭 시스템 */
    --pad-x:24px; --card-max:450px; --content-max:402px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--gray-100)}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;
    background:#fff;color:var(--gray-800);-webkit-font-smoothing:antialiased}
  /* CLAUDE.md 규칙 — 화면 채우기 높이는 svh */
  .page{width:100%;max-width:var(--card-max);margin:0 auto;background:#fff;
    min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
  /* 헤더·뒤로가기 — CLAUDE.md 「헤더와 뒤로가기 표준값」 (피그마 376:2507) */
  .hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;
    height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;background:#fff}
  .back{width:48px;height:48px;display:flex;align-items:center;justify-content:center;position:relative}
  .back svg{position:relative;z-index:1}
  .back::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:36px;height:36px;border-radius:10px;background:transparent;transition:background .12s}
  .back:active::before{background:var(--gray-100)}
  main{flex:1;display:flex;flex-direction:column;width:100%;max-width:var(--card-max);margin:0 auto}
  /* 피그마 텍스트 스타일 대응 (careercoach 컬렉션 text/*) */
  .t-display{font-size:28px;line-height:36px;font-weight:800;letter-spacing:-.02em;color:var(--gray-900)}
  .t-h3{font-size:17px;line-height:24px;font-weight:600}
  .t-h4{font-size:15px;line-height:22px;font-weight:600}
  .t-body-l{font-size:16px;line-height:23px;font-weight:400}
  .t-body-s{font-size:14px;line-height:20px;font-weight:400}
  .t-caption{font-size:13px;line-height:18px;font-weight:400}
  .t-micro{font-size:11px;line-height:14px;font-weight:500}
  .t-label{font-size:14px;line-height:20px;font-weight:700}
  .t-number-xl{font-size:32px;line-height:36px;font-weight:800;letter-spacing:-.02em}
  .caret{font-size:20px;line-height:1;color:var(--gray-400);flex:none}
  /* 하단 플로팅 CTA — 320×54, 좌우 20 (피그마와 같은 값) */
  .cta-dock{position:sticky;bottom:0;padding:12px 20px 20px;background:#fff;
    display:flex;justify-content:center}
  .cta{width:100%;max-width:320px;height:var(--cta-h);border:0;border-radius:var(--cta-radius);
    background:var(--amber-500);color:#fff;font:inherit;font-size:var(--cta-fs);font-weight:var(--cta-fw);
    line-height:20px;cursor:pointer;box-shadow:0 4px 12px rgba(217,120,5,.22);
    display:flex;align-items:center;justify-content:center;gap:0}
  .cta[disabled]{background:var(--gray-100);color:var(--gray-400);box-shadow:none;cursor:default}
  [hidden]{display:none!important}

  .title{padding:20px var(--pad-x) 9px}
  .desc{padding:10px var(--pad-x);color:var(--gray-500);word-break:keep-all}

  .chip{border:0;background:#fff;box-shadow:inset 0 0 0 1px var(--gray-200);border-radius:10px;
    padding:9px 12px;font:inherit;font-size:13px;line-height:18px;font-weight:400;color:var(--gray-600);
    cursor:pointer;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--amber-50);box-shadow:inset 0 0 0 1px var(--amber-500);color:var(--amber-600)}

  .groups{padding:24px var(--pad-x)}
  .group{border:1px solid var(--gray-100);display:flex;flex-direction:column}
  .acc{height:52px;padding:15px 0;display:flex;align-items:center;justify-content:space-between;
    background:none;border:0;width:100%;font:inherit;color:inherit;cursor:pointer}
  .acc .nm{display:flex;align-items:center;gap:7px}
  .acc .cnt{color:var(--gray-400)}
  .acc .ac{color:var(--gray-300);font-size:11px;line-height:14px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;padding:2px 0 16px}
</style>
</head>
<body>
<div class="page">
<header class="hd"><a class="back" href="/mypage/" aria-label="뒤로"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15.75 4.5L8.25 12l7.5 7.5" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></header>
<main>
  <div class="title"><h1 class="t-display">어떤 직무의 공고를<br>받아볼까요?</h1></div>
  <div class="desc t-body-s">여러 직무를 함께 고를 수 있어요</div>
  <div class="groups">
    <div class="group">
      <button class="acc" type="button" aria-expanded="true"><span class="nm"><span class="t-h4">디자인</span><span class="t-micro cnt">주 100건</span></span><span class="ac" aria-hidden="true">▲</span></button>
      <div class="chips">
        <button class="chip" type="button" aria-pressed="false">전체</button>
        <button class="chip" type="button" aria-pressed="true">웹디자인</button>
        <button class="chip" type="button" aria-pressed="true">UX·UI·프로덕트</button>
        <button class="chip" type="button" aria-pressed="true">그래픽·시각</button>
        <button class="chip" type="button" aria-pressed="true">일러스트</button>
        <button class="chip" type="button" aria-pressed="true">브랜딩·BI·BX</button>
        <button class="chip" type="button" aria-pressed="true">공간·실내·VMD</button>
        <button class="chip" type="button" aria-pressed="true">산업·제품</button>
        <button class="chip" type="button" aria-pressed="true">패키지</button>
        <button class="chip" type="button" aria-pressed="true">광고·콘텐츠</button>
        <button class="chip" type="button" aria-pressed="true">영상·모션</button>
        <button class="chip" type="button" aria-pressed="true">3D·VFX</button>
        <button class="chip" type="button" aria-pressed="true">출판·편집</button>
        <button class="chip" type="button" aria-pressed="false">건축·공공·조경</button>
        <button class="chip" type="button" aria-pressed="true">패션·텍스타일</button>
        <button class="chip" type="button" aria-pressed="false">기타</button>
      </div>
    </div>
    <div class="group">
      <button class="acc" type="button" aria-expanded="false"><span class="nm"><span class="t-h4">마케팅·광고·홍보</span><span class="t-micro cnt">주 279건</span></span><span class="ac" aria-hidden="true">▼</span></button>
    </div>
    <div class="group">
      <button class="acc" type="button" aria-expanded="false"><span class="nm"><span class="t-h4">IT·개발</span><span class="t-micro cnt">주 239건</span></span><span class="ac" aria-hidden="true">▼</span></button>
    </div>
    <div class="group">
      <button class="acc" type="button" aria-expanded="false"><span class="nm"><span class="t-h4">AI·데이터</span><span class="t-micro cnt">주 105건</span></span><span class="ac" aria-hidden="true">▼</span></button>
    </div>
    <div class="group">
      <button class="acc" type="button" aria-expanded="false"><span class="nm"><span class="t-h4">기획·전략</span><span class="t-micro cnt">주 177건</span></span><span class="ac" aria-hidden="true">▼</span></button>
    </div>
    <div class="group">
      <button class="acc" type="button" aria-expanded="false"><span class="nm"><span class="t-h4">영업·고객</span><span class="t-micro cnt">주 99건</span></span><span class="ac" aria-hidden="true">▼</span></button>
    </div>
  </div>
</main>
<div class="cta-dock">
  <button class="cta" type="button" id="save"><span id="lab">저장</span></button>
</div>
<script>
  (function () {
    var lab = document.getElementById('lab');
    var save = document.getElementById('save');
    function chips() { return Array.prototype.slice.call(document.querySelectorAll('.chip')); }
    function refresh() {
      var n = chips().filter(function (c) { return c.getAttribute('aria-pressed') === 'true'; }).length;
      save.disabled = n === 0;
      lab.textContent = n ? '저장 · ' + n + '개 선택됨' : '직무를 1개 이상 골라주세요';
    }
    document.addEventListener('click', function (e) {
      var chip = e.target.closest('.chip');
      if (chip) {
        chip.setAttribute('aria-pressed', chip.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
        refresh();
        return;
      }
      var acc = e.target.closest('.acc');
      if (acc) {
        var open = acc.getAttribute('aria-expanded') === 'true';
        acc.setAttribute('aria-expanded', open ? 'false' : 'true');
        acc.querySelector('.ac').textContent = open ? '▼' : '▲';
        var list = acc.parentNode.querySelector('.chips');
        if (list) list.hidden = open;
      }
    });
    refresh();
  })();
</script>
</div>
</body>
</html>
