<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<meta name="robots" content="noindex">
<title>커리어코치</title>
<link rel="icon" type="image/svg+xml" href="/assets/logo-circle.svg">
<style>:root{color-scheme:only light;--gray-100:#F1F5F9}html,body{margin:0;background:#fff}
  @media (min-width:451px){body{background:var(--gray-100)}.page{box-shadow:0 0 24px rgba(15,23,42,.06), 0 0 64px rgba(15,23,42,.10)}}</style>
<!-- 옛 가입 화면 자리 (2026-10-14 화면 삭제, 사용자 지시). 약관 동의는 카카오 동의 화면이 받으므로
     이 주소는 옛 광고·북마크로 들어온 사람을 카카오 로그인으로 넘겨주기만 한다. 화면이 없다. -->
<script type="module">
  import { KAKAO_LOGIN } from '/assets/supabase-config.js';
  import { track } from '/assets/track.js';
  track('signup_start', { p: 'signup_redirect' });   // keepalive 라 바로 넘어가도 남는다
  location.replace(KAKAO_LOGIN);
</script>
</head>
<body><noscript><a href="/">커리어코치 첫 화면으로</a></noscript></body>
