<style>
  :root{
    color-scheme: only light;   /* meta 와 같은 값 — CSS 로도 선언해 확실히 적용한다 */
    --amber-50:#FFFBEB;--amber-100:#FEF3C7;--amber-200:#FDE68A;--amber-400:#FBBF24;--amber-500:#F59E0B;--amber-600:#D97706;--amber-700:#B45309;
    --gray-50:#F8FAFC;--gray-100:#F1F5F9;--gray-200:#E2E8F0;--gray-300:#CBD5E1;--gray-400:#94A3B8;
    --gray-500:#64748B;--gray-600:#475569;--gray-700:#334155;--gray-800:#1E293B;--gray-900:#0F172A;
    /* CTA 규칙(2026-08-03) — 제품 공통. 값·근거는 CLAUDE.md "CTA 규칙" */
    --cta-h:54px; --cta-radius:14px; --cta-fs:15px; --cta-fw:700;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:#fff}
  body{font-family:'Pretendard Variable',Pretendard,'Noto Sans CJK KR',-apple-system,sans-serif;
    background:#fff;color:var(--gray-800);-webkit-font-smoothing:antialiased}
  /* 화면 채우기용 높이는 svh 로 고정한다 — 근거는 onboarding/3 의 같은 주석. */
  .board{width:100%;max-width:450px;margin:0 auto;min-height:100vh;min-height:100svh;background:#fff;
    padding-bottom:calc(100px + env(safe-area-inset-bottom))}
  @media (min-width:451px){ body{background:var(--gray-100)}
    .board{box-shadow:0 0 24px rgba(15,23,42,.06),0 0 64px rgba(15,23,42,.10)} }
  [hidden]{display:none!important}

  /* 상단바 — CLAUDE.md 「헤더와 뒤로가기 — 표준값」 */
  .hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;
    height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;
    background:#fff}
  .back{width:48px;height:48px;display:flex;align-items:center;justify-content:center;
    border:0;background:none;padding:0;cursor:pointer;text-decoration:none;position:relative;
    -webkit-tap-highlight-color:transparent}
  .back svg{position:relative;z-index:1}
  .back::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:36px;height:36px;border-radius:10px;background:transparent;transition:background .12s}
  .back:active::before{background:var(--gray-100)}
  /* 진행 바 — 4칸 전체가 하나의 그라디언트로 이어지도록 background-size/position 으로 잘라 쓴다 */
  .prog{display:flex;gap:5px;padding:22px 24px 0}
  .prog i{height:3px;border-radius:99px;background-color:var(--gray-100);flex:1}
  .prog i.on{background-image:linear-gradient(90deg,var(--amber-400) 0%,var(--amber-600) 100%);background-size:400% 100%;background-repeat:no-repeat}
  .prog i:nth-child(1).on{background-position:0% 0}
  .prog i:nth-child(2).on{background-position:33.3% 0}
  .prog i:nth-child(3).on{background-position:66.6% 0}
  .prog i:nth-child(4).on{background-position:100% 0}

  /* 진행 바 아래 끝 → 제목 글자 상자 위 끝 44px (단계 이름 줄은 없다 — 1~3단계와 같다) */
  .title{padding:44px 24px 0;font-size:24px;line-height:32px;font-weight:700;color:var(--gray-900);letter-spacing:-0.01em}
  .desc{padding:10px 24px 0;font-size:14px;line-height:20px;color:var(--gray-500);word-break:keep-all}

  /* 「내 직군 추천」·「다른 주제」 두 묶음과 칩 — 마이페이지 mypage/topics(사용자 확정 M2, 피그마 908:623)와 같은 값.
     피그마 2470:2340 도 같은 값이다. 눌림·색 바뀜만 온보딩 칩 규칙(.12s · scale .97)을 더했다. */
  .grp{padding:24px 24px 10px;font-size:13px;line-height:18px;font-weight:600;color:var(--gray-500)}
  .topics{padding:0 24px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start}
  .chip{display:inline-flex;align-items:center;gap:4px;
    border:0;background:#fff;box-shadow:inset 0 0 0 1px var(--gray-200);border-radius:10px;
    padding:9px 12px;font:inherit;font-size:13px;line-height:18px;font-weight:400;color:var(--gray-600);
    cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;user-select:none;
    transition:background .12s,box-shadow .12s,color .12s}
  .chip:active{transform:scale(.97)}
  .chip[aria-pressed="true"]{background:var(--amber-50);box-shadow:inset 0 0 0 1px var(--amber-500);color:var(--amber-600)}
  .rec{padding:1px 6px;border-radius:6px;background:var(--amber-500);color:#fff;font-size:11px;line-height:14px;font-weight:700}

  /* 플로팅 CTA — 3단계와 같은 값 */
  .fade{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:450px;height:100px;
    background:linear-gradient(180deg,rgba(255,255,255,0),#fff 55%);pointer-events:none;z-index:9}
  .cta{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    width:calc(100% - 40px);max-width:410px;height:var(--cta-h);
    display:block;text-align:center;line-height:var(--cta-h);
    background:var(--amber-500);color:#fff;border-radius:var(--cta-radius);
    font-size:var(--cta-fs);font-weight:var(--cta-fw);
    box-shadow:0 12px 32px rgba(217,119,6,.28);cursor:pointer;z-index:10;
    -webkit-tap-highlight-color:transparent}
  .cta:active{transform:translateX(-50%) scale(.98)}
  .cta.off{background:var(--gray-100);color:var(--gray-400);box-shadow:none;cursor:default}
  .cta.off:active{transform:translateX(-50%)}

</style></head><body>

  import { pageView } from '/assets/track.js';

<script type="module">
  // 주제 고르기 — 2026-10-05 결정으로 완료 화면에서 이 화면으로 옮겼다
  // (프로젝트 문서 「결정-2026-10-05-온보딩-4단계-분리-정본」). 저장 통로는 그대로 assets/onboarding-store.js 다.
  import { readState, writeState, retryPending, saveOnboarding, markEditMode } from '/assets/onboarding-store.js';
  import { readTopicMap, trackFromJobs } from '/assets/topic-map.js';
  import { track } from '/assets/track.js';

  const MAP = readTopicMap();
  const state = readState();
  const rest = document.getElementById('rest');
  const recBox = document.getElementById('rec');
  const all = () => [...document.querySelectorAll('.topics .chip')];
  const has = (t) => all().some((c) => c.dataset.topic === t);

  // 「내 직군 추천」 = 발송 경로와 같은 규칙으로 고른 직군에서 푼 주제(assets/topic-map.js).
  // 목록에 없는 트랙이 나오면 추천 없이 그린다 — 없는 칩을 지어내지 않는다(마이페이지와 같다).
  let rec = trackFromJobs(MAP, state.jobs);
  if (!has(rec)) rec = null;
  if (rec) {
    const chip = all().find((c) => c.dataset.topic === rec);
    const badge = document.createElement('span');
    badge.className = 'rec'; badge.textContent = '추천';
    chip.appendChild(badge);
    recBox.appendChild(chip);          // 「다른 주제」에서 빼서 추천 묶음으로 옮긴다
  } else {
    // 추천이 없는 직군 — 추천 묶음을 통째로 빼고 아무것도 미리 고르지 않는다(CTA 잠김).
    document.getElementById('gRec').hidden = recBox.hidden = true;
  }

  // 처음 고른 상태: 전에 직접 고른 주제가 있으면(최종 확인 화면 「바꾸기」로 돌아온 경우 등) 그것,
  // 없으면 추천. 옛 이름이 남아 목록에 없으면 추천으로 돌린다 — 마이페이지와 같은 순서다.
  const 처음 = has(state.topic) ? state.topic : rec;
  const cta = document.querySelector('.cta');
  if (markEditMode()) cta.textContent = window.ccWord;
  // 칩 이름은 data-topic 에서 읽는다 — 추천 칩은 「추천」 딱지 글자가 같이 붙어 있어 textContent 로는 이름이 틀린다.
  const current = () => { const c = document.querySelector('.topics .chip[aria-pressed="true"]'); return c ? c.dataset.topic : null; };
  const select = (t) => {
    for (const c of all()) c.setAttribute('aria-pressed', String(c.dataset.topic === t));
    cta.classList.toggle('off', !current());
  };
  select(처음);
  // 하나만 고른다(라디오처럼). 눌린 칩을 다시 눌러도 풀리지 않는다 — 주제가 없는 상태로 넘어가지 않게.
  document.querySelector('.board').addEventListener('click', (e) => {
    const chip = e.target.closest('.topics .chip');
    if (chip) select(chip.dataset.topic);
  });

  // 지난 저장이 실패한 채 남아 있으면 여기서 다시 보낸다.
  // 🔴 **그 호출을 기다린 뒤에 주제를 보낸다.** onboarding-store 는 저장을 하나씩만 보내고(`inflight`)
  //    겹치면 `busy` 로 튕기는데, 그 판은 주제를 안 싣고 있다 — 기다리지 않으면 화면은 바뀐 주제를
  //    그렸는데 서버에는 안 간 상태가 되고, 먼저 날아간 저장이 성공하며 pending 표시까지 지운다.
  const 재시도 = retryPending();

  let 가는중 = false;
  cta.addEventListener('click', async () => {
    if (cta.classList.contains('off') || 가는중) return;
    가는중 = true;
    cta.setAttribute('aria-busy', 'true');
    const 고른 = current();
    // 저장 의미는 옛 완료 화면 그대로 둔다(assets/onboarding-store.js 의 topic / topicClear 설명).
    //   · 처음 상태 그대로 넘어감 → 보낼 것이 없다. 직접 고른 적 없는 사람은 topic:null(직군에 맞춰)이 유지되고,
    //     서버는 주제 인자가 없으면 기존 값을 그대로 둔다 — 재온보딩이 주제를 지우면 안 된다.
    //   · 추천 칩으로 바꿈 → 옛 「직군에 맞춰 자동」과 같은 뜻이라 **비우기**(p_topic_clear)다.
    //     추천은 직군이 정하는 값이라, 이름을 굳혀 저장하면 나중에 직군을 바꿔도 주제가 안 따라간다.
    //   · 다른 칩으로 바꿈 → 그 주제를 명시 저장(p_topic).
    let 저장중 = 재시도;
    if (고른 !== 처음) {
      const 자동 = 고른 === rec;
      writeState({ topic: 자동 ? null : 고른, topicClear: 자동, pending: true });
      // 주제를 실제로 몇 명이 바꾸는지 지금은 못 본다. 이름은 허용 목록에 있는 것만 통과한다.
      track('onboarding_step', { step: 4, topic: 자동 ? 'auto' : 'changed' });
      저장중 = (async () => { await 재시도.catch(() => {}); return saveOnboarding(); })();
    }
    // 🔴 **이동은 저장을 기다린 뒤다.** 기다리지 않으면 페이지가 떠나며 RPC 가 끊긴다(옛 완료 화면의
    //    「CTA 가 저장을 기다린다」, 2026-09-11 검사관 ①). 실패해도 막지 않는다 — pending 이 남고,
    //    최종 확인 화면·마이페이지가 다시 보낸다.
    const r = await 저장중.catch(() => null);
    // 로그인이 풀렸으면 카카오 로그인으로 — saveOnboarding 은 스스로 보내지만 retryPending 은 화면을 안 옮긴다
    // (2026-10-12 검사관 ①: 주제를 안 바꾼 채 누르면 retryPending 결과라 버튼이 아무 말 없이 멈췄다).
    if (r && r.status === 'no-session') { location.href = (await import('/assets/supabase-config.js')).KAKAO_LOGIN; return; }
    location.href = '/onboarding/done/';
  });
</script>
</body></html>
