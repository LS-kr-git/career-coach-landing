<title>커리어코치 어드민</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo-circle.svg">
<style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
     color:#1c1c1e;background:#f5f5f7}
a{color:inherit}
#login{max-width:340px;margin:14vh auto;padding:24px;background:#fff;border-radius:14px;
       box-shadow:0 1px 3px rgba(0,0,0,.12)}
#login h1{font-size:17px;margin:0 0 18px}
input{width:100%;padding:11px 12px;margin-bottom:10px;border:1px solid #d2d2d7;border-radius:8px;font-size:15px}
button{width:100%;padding:11px;border:0;border-radius:8px;background:#1c1c1e;color:#fff;font-size:15px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.err{color:#c0362c;font-size:13px;min-height:18px;margin-bottom:8px}
/* 🔴 탭바 폭은 **사람이 재지 않는다.** 브라우저가 잰다 (2026-08-13 사용자 지시).
   그전에는 손으로 재서 박았다. 하루에 212 → 226 → 234 → 239 로 **네 번** 다시 쟀고,
   그중 한 번은 틀렸다 — 선택된 칸이 700 으로 굵어지는 것을 빼먹어서 **가장 긴 칸을 누르는
   순간 줄바꿈이 나는 값**이었다(검사관이 잡았다). 이름 하나만 바뀌어도 다시 재야 하는데
   그 사실이 코드 어디에도 안 적혀 있었다.

   지금은 셋이 **한 벌로** 그 일을 없앤다. 하나라도 빼면 폭이 다시 움직인다 —
   아래 숫자는 전부 그 규칙을 꺼 보고 확인한 것이다(라이브 실측).
     ① `max-content`               트랙을 내용에 맞춘다. 이름이 바뀌면 폭이 따라온다.
     ② `nav a[data-t]::after`      **굵은 판을 미리 자리 잡아 둔다.** 빼면 가장 긴 칸을 누를 때만
                                   폭이 233 → 238 로 튀어 오른쪽 본문이 5px 밀린다.
     ③ `scrollbar-gutter:stable`   스크롤바 자리를 늘 비워 둔다. 빼면 화면이 짧은 PC 에서만
                                   223 이 되어, 재현이 안 되는 폭 차이가 생긴다.
   `max-width` 320 은 안전장치다. 아주 긴 이름이 들어와도 오른쪽 본문을 잡아먹지 않는다 —
   대신 탭바 안에서 가로로 잘린다. 하한은 두지 않는다 — 사용자가 말한 것은 상한뿐이고,
   하한을 두면 그만큼은 다시 사람이 정한 숫자가 된다. */
#app{display:none;grid-template-columns:max-content 1fr;min-height:100vh}
/* 스크롤을 내려도 왼쪽 탭바는 그대로 둔다 (2026-08-13 사용자 지시).
   `#app` 이 그리드라 nav 는 기본값(stretch)으로 열 높이만큼 늘어나는데, 그러면
   sticky 가 붙을 자리가 없어 조용히 안 먹는다 — `align-self:start` 가 그걸 푼다.
   높이를 화면 높이로 고정하고 넘치면 탭바 안에서만 스크롤한다. 안 그러면 화면이 짧은
   기기에서 아래쪽 탭에 영영 못 닿는다. */
nav{background:#fff;border-right:1px solid #e5e5ea;padding:18px 0;
    white-space:nowrap;scrollbar-gutter:stable;max-width:320px;
    position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;overscroll-behavior:contain;
    display:flex;flex-direction:column}
/* 세로 flex 는 항목을 눌러서 맞추려 든다. 탭이 늘면 글자가 겹치므로 자연 높이로 고정하고,
   넘치는 것은 위 `overflow-y:auto` 가 받는다. */
nav>*{flex:none}
/* 로그인 계정은 맨 아래 (2026-08-13 사용자 지시). `margin-top:auto` 라 탭이 화면보다
   길어지면 자동으로 0 이 되어 목록 끝에 따라붙는다 — 겹치지 않는다. */
/* 🔴 계정 블록의 왼쪽은 **묶음 라벨과 같은 12px** 다 (2026-08-13 사용자 지시).
   시안 13 이 라벨 12 · 항목 26 두 층을 만드는데, 여기가 옛 값 18 로 남아 있어서
   왼쪽 정렬선이 셋으로 갈라져 있었다. 계정은 항목이 아니라 묶음과 같은 층으로 본다. */
nav .who{font-size:12px;color:#8e8e93;padding:14px 12px 0;margin-top:auto}
/* 로그아웃은 **버튼이 아니라 글자다** (2026-08-13 사용자 지시: "버튼형식 말고 텍스트랑
   밑줄로만, 낮은 위계로"). 그래서 `nav a` 의 블록 상자·14px·밑줄 없음을 전부 덮는다.
   `width:max-content` 로 상자를 글자에 붙인다 — 안 붙이면 탭바 줄 전체가 눌려서
   결국 버튼처럼 보인다. 계정 이메일(12px 회색)보다 더 낮출 자리가 없어 같은 크기·색을
   쓰고, 밑줄만으로 "누를 수 있다" 를 말한다. 호버로 색을 올리지 않는다 — 그러면 위
   이메일보다 위계가 잠시 높아진다. */
nav a.out{display:block;width:max-content;padding:3px 12px 0;font-size:12px;color:#8e8e93;
          text-decoration:underline;text-underline-offset:2px}
/* 묶음/항목/선택 — 2026-08-13 사용자가 시안 16종 중 **13번**을 골랐다.
   규칙 셋이 한 벌이다. 하나만 떼어 고치지 마라.
     · 묶음 라벨은 **왼쪽으로 튀어나오고**(padding-left 12) 항목은 **들여쓴다**(26).
       라벨이 부모, 항목이 자식으로 읽히게 하는 것이 이 안의 전부다 — 라벨 크기는 11px 그대로다.
     · 선택은 **배경색을 쓰지 않는다**(2026-08-13 사용자 지시). 왼쪽 짧은 바 + 굵기 700 이다.
       바가 `left:12px` 인 것은 라벨의 왼쪽 끝과 같은 선에 놓기 위해서다.
     · `nav a` 의 `position:relative` 는 그 바의 기준이다. 빼면 바가 화면 왼쪽 끝으로 날아간다. */
nav .grp{font-size:11px;font-weight:700;color:#636366;letter-spacing:0;padding:12px 12px 5px;margin-top:14px}
nav .grp:first-child{margin-top:0}
nav a{display:block;position:relative;padding:7px 18px 7px 26px;text-decoration:none;font-size:14px;cursor:pointer}
nav a.on{font-weight:700}
nav a.on::before{content:"";position:absolute;left:12px;top:6px;bottom:6px;width:3px;
                 background:#F59E0B;border-radius:2px}
/* 마우스를 올렸을 때 (2026-08-13 사용자 지시: 반응이 없어 누를 수 있는지 몰랐다).
   🔴 **`.on` 을 뺀다.** 선택은 배경을 안 쓰기로 한 자리인데(위), 빼지 않으면 선택된 칸에
   마우스를 올리는 순간 배경이 생겨 그 결정이 반쯤 되돌아간다(검사관이 잡았다).
   🔴 배경만 바꾸고 **글자색은 안 건드린다** — 사용자가 준 것은 "옅은 배경이나 글자색 중
   하나" 였다. 둘을 같이 쓰면 호버가 선택보다 세진다.
   로그아웃도 뺀다: 같은 파일 위쪽 주석대로 그 줄은 호버로 위계를 올리지 않기로 한 자리다. */
nav a:not(.out):not(.on):hover{background:#f7f7f8}
/* 키보드로 옮길 때 지금 어디에 있는지 (2026-08-13). 호버와 같은 문제를 키보드 쪽에서 푼다.
   `:focus-visible` 이라 마우스 클릭에는 안 뜬다. 아웃라인은 레이아웃에 안 들어가므로
   위 `max-content` 폭 계산에 영향이 없다. */
nav a:focus-visible{outline:2px solid #92400E;outline-offset:-2px}
/* 폭 예약. 위 「탭바 폭」 주석의 ② 다 — 이 규칙이 없으면 선택할 때 탭바 폭이 튄다.
   높이 0 · overflow hidden 이라 화면에는 안 보이고, **폭 계산에만** 들어간다. */
nav a[data-t]::after{content:attr(data-t);display:block;height:0;overflow:hidden;
                     font-weight:700;visibility:hidden}
main{padding:26px 30px;max-width:1242px;margin:0 auto}
h1{font-size:20px;margin:0 0 6px}
.sub{color:#8e8e93;font-size:13px;margin:0}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:#e8f0e8;color:#2d6a2d}
.chip.warn{background:#fdf1dd;color:#8a5a00}
.chip.bad{background:#fbe4e2;color:#a72b1e}
.tile{display:inline-block;min-width:150px;margin:0 10px 10px 0;padding:14px 16px;background:#fff;
      border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.t-label{font-size:12px;color:#8e8e93}
.t-value{font-size:22px;font-weight:600;margin-top:2px}
.t-sub{font-size:12px;color:#8e8e93;margin-top:2px}
</style>
</head>
<body>
<!--
  어드민 셸. 화면 내용은 한 글자도 여기 없다 — 로그인한 뒤 함수에서 받아 온다.

  왜 함수가 아니라 여기 있나 (2026-08-12 실측)
    `*.supabase.co` 게이트웨이는 함수가 HTML 을 주면 `content-type: text/plain` 과
    `content-security-policy: default-src 'none'; sandbox` 로 바꿔 내보낸다. 그래서
    브라우저가 렌더하지 않는다. JSON 에는 안 붙는다. 최상위 문서 하나만 정적으로 빼면
    커스텀 도메인 애드온이 필요 없다.
-->
<form id="login" autocomplete="on">
  <h1>Career Coach Admin</h1>
  <div class="err" id="err"></div>
  <input id="email" type="email" placeholder="이메일" autocomplete="username" required>
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" required>
  <button id="go" type="submit">로그인</button>
</form>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<script type="module">
import { SUPABASE_URL } from '/assets/supabase-config.js';

// 주소는 `#<화면id>` 한 칸이다. 예) careercoach.my/ops/#errors
//
// 🔴 **함수 이름은 더 이상 비밀이 아니다** (2026-08-13 사용자 결정). 전에는 이 값을
//    주소창 해시로 받아 공개 저장소에 안 적었는데, 그 층이 실제로 막는 것은 무차별
//    스캐너 하나뿐인 반면 주소창·방문기록·북마크·메일 href·스크린샷으로 계속 새고
//    **회전 수단이 없었다**(바꾸려면 함수를 새로 만들어야 한다). 값에 비해 값을
//    치르는 쪽이 커서 접었다.
//
//    그래서 지금 어드민을 지키는 것은 전부 함수 쪽이다 — Supabase 로그인 +
//    `private.admin_uid` 화이트리스트 + `private.admin_login_fail` 실패 제한.
//    **이 파일에 자물쇠는 하나도 없다.** 여기에 검사를 더해 봐야 소용이 없고,
//    반대로 여기서 무엇이 새는지 걱정할 필요도 없다.
const FN = 'ops-1udm1xmi';
const BASE = SUPABASE_URL + '/functions/v1/' + FN;

// 옛 북마크는 `#<함수이름>` 또는 `#<함수이름>/<화면id>` 였다. 앞 칸이 남아 있으면 버린다 —
// 그러면 옛 주소가 그대로 열리고, `show()` 가 주소를 새 형식으로 갈아 준다.
function hashPage() {
  const seg = location.hash.slice(1).split('/').filter(Boolean);
  if (seg[0] === FN) seg.shift();
  return seg[0] || '';
}

const $ = (id) => document.getElementById(id);

// 🔴 **localStorage 다.** 전에는 `sessionStorage` 라 탭을 닫으면 로그아웃이었고, 액세스
//    토큰이 만료되면 그대로 로그인 화면이었다 — 갱신을 아예 안 했다. 그래서 어드민이
//    **하루 6~13번 로그인**하고 있었다(2026-08-13 실측). 지금은 브라우저를 껐다 켜도 이어지고,
//    다시 로그인해야 하는 것은 **7일에 한 번**이다(상한은 함수가 잰다 — 여기 값이 아니다).
//    대가: 갱신 토큰이 디스크에 남는다. 다만 이 셸은 함수가 준 조각의 <script> 를 그대로
//    실행하므로, 그 자리에서 XSS 가 나면 어차피 전부 뚫린다. 실질 증가분은 작다.
const KEY = 'ops_session';
let token = '';
let refreshToken = '';
try {
  const s = JSON.parse(localStorage.getItem(KEY) || '{}');
  token = s.access_token || '';
  refreshToken = s.refresh_token || '';
} catch (_) { /* 깨진 값이면 로그인부터 다시 한다 */ }

function keep(s) {
  token = s.access_token; refreshToken = s.refresh_token;
  localStorage.setItem(KEY, JSON.stringify({ access_token: token, refresh_token: refreshToken }));
}

// 탭이 여러 개면 한 세션을 나눠 쓴다. 갱신 토큰은 한 번 쓰면 회전하므로, 저쪽 탭이
// 회전시킨 값을 못 보면 이쪽은 죽은 토큰으로 갱신하다 로그아웃되고 **공유 키까지 지운다.**
// 그래서 ① 다른 탭이 저장하면 바로 받아 오고 ② 갱신 직전에 저장소를 다시 읽는다.
addEventListener('storage', (e) => {
  if (e.key !== KEY) return;
  const s = e.newValue ? JSON.parse(e.newValue) : null;
  token = s?.access_token || ''; refreshToken = s?.refresh_token || '';
});

function 읽기() {
  try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (_) { return {}; }
}

// 갱신은 **한 번에 하나만** 돈다. 첫 화면은 질의를 여러 개 동시에 던지는데, 각자 갱신하면
// 회전된 토큰을 서로 무효화해서 전부 로그아웃된다.
let 갱신중 = null;

// 돌려주는 값이 셋이다. 🔴 **일시 고장을 만료와 뭉치지 마라** — 뭉치면 오프라인 한 번이나
// 함수 500 한 번에 아직 6일 남은 세션이 영구히 지워지고, 이번 작업이 없애려던 그 상태로
// 돌아간다. 401 만 "다시 로그인" 이다.
//   'ok'      새 토큰을 받았다
//   'expired' 7일이 지났거나 자격이 사라졌다 → 로그인 화면
//   'fail'    지금 못 갱신했다 → **아무것도 지우지 않는다.** 다음에 다시 해 본다
function renew() {
  if (!갱신중) 갱신중 = _renew().finally(() => { 갱신중 = null; });
  return 갱신중;
}

async function _renew() {
  // 저장소를 다시 읽는다 — 그 사이 다른 탭이 회전시켰을 수 있다.
  const 최신 = 읽기().refresh_token || refreshToken;
  if (!최신) return 'expired';
  let r;
  try {
    r = await fetch(BASE + '/auth/refresh', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ refresh_token: 최신 }),
    });
  } catch (_) {
    return 'fail';                       // 네트워크가 끊겼다. 세션은 멀쩡하다
  }
  if (r.ok) { keep(await r.json()); return 'ok'; }
  if (r.status !== 401) return 'fail';   // 5xx 는 우리 쪽 고장이지 만료가 아니다
  // 401 이다. 다만 그 사이 다른 탭이 회전시켰으면 내 토큰이 낡아서일 뿐이다 — 한 번 더 본다.
  const 지금 = 읽기().refresh_token;
  if (지금 && 지금 !== 최신) {
    refreshToken = 지금;
    return 'retry';
  }
  return 'expired';
}

async function call(path, init, 다시 = true) {
  const r = await fetch(BASE + path, Object.assign({}, init, {
    headers: Object.assign({ authorization: 'Bearer ' + token }, (init || {}).headers || {}),
  }));
  if (r.status !== 401) {
    if (!r.ok) throw new Error(await r.text());
    return r;
  }
  // `다시` 가 없으면 재시도가 401 을 또 만나 무한히 돈다.
  if (!다시) { signOut(); throw new Error('401'); }
  let v = await renew();
  if (v === 'retry') v = await renew();  // 다른 탭이 회전시킨 토큰으로 한 번만 더
  if (v === 'ok') return call(path, init, false);
  if (v === 'expired') { signOut(); throw new Error('401'); }
  // 'fail' — 저장된 세션을 지우지 않는다. 새로고침하면 그대로 이어진다.
  throw new Error('지금 서버에 닿지 못했습니다. 잠시 뒤 새로고침하세요.');
}

// 사람이 누르는 로그아웃. 🔴 **로컬만 지우면 반쪽이다** — 그 갱신 토큰으로 이어지던
// 서버 세션이 남은 7일 동안 그대로 살아 있다.
//
// 🔴 **GoTrue 로 직접 가지 않는다. 함수 창구(`call`)로 간다.** 직접 가면 세션 끊기 구현이
//    둘이 되고(함수의 `endSession` 과 여기), 실제로 `scope` 가 갈렸었다. 게다가
//    `private.admin_audit` 은 함수만 쓸 수 있어서 **로그아웃이 원장에 영영 안 남는다** —
//    들어온 기록만 있고 나간 기록은 없는 원장이 된다 (검사관 2026-08-13).
//    덤으로 만료 토큰 재시도도 `call()` 이 이미 한다 — 여기서 다시 짤 것이 없다.
let 나가는중 = false;

async function 로그아웃() {
  if (나가는중) return;              // 연타하면 두 번째가 401 을 받아 "못 끊었다" 로 오해된다
  나가는중 = true;
  let 결과 = '못함';
  try {
    await call('/auth/logout', { method: 'POST' });
    결과 = '끊음';
  } catch (x) {
    // `call` 은 401 을 만나면 스스로 갱신하고 다시 부른다. 그래도 401 이면 그 세션은
    // 이미 죽은 것이라 끊을 것이 없다 — 못 끊은 것과 다르다.
    if (String(x.message) === '401') 결과 = '이미끊김';
  } finally {
    나가는중 = false;
  }
  signOut();
  // 조용히 넘어가지 않는다. 못 끊었으면 이 브라우저에서만 나간 것이고 서버 세션은
  // 남은 기간 동안 살아 있다 — 그걸 모르면 "로그아웃했으니 괜찮다" 로 읽는다.
  if (결과 === '못함') {
    $('err').textContent = '이 브라우저에서는 나갔지만 서버 세션을 못 끊었습니다. 네트워크를 확인하세요.';
  }
}

function signOut() {
  token = ''; refreshToken = ''; localStorage.removeItem(KEY);
  // 비워야 로그아웃 뒤 해시가 움직여도 401 을 다시 부르러 가지 않는다.
  NAV_IDS = []; NAV_TITLE = new Map();
  document.title = '커리어코치 어드민';
  $('app').style.display = 'none'; $('login').style.display = '';
}

// 조각이 쓰는 유일한 창구. 이게 없으면 화면마다 주소와 토큰을 다시 만들어야 하고,
// 그러면 401 처리가 화면 수만큼 갈린다.
window.ops = { call: call };

// innerHTML 은 <script> 를 실행하지 않는다. 조각에 폼·버튼을 두려면 여기서 다시 만든다.
// src 나 type 이 붙은 것은 건너뛴다 — 조각의 오리진은 우리 것이 아니고, type 이 붙은 것
// (application/json 등)은 애초에 코드가 아니다. career-coach 의
// tests/test_admin_pages.py 가 조각 쪽에서 같은 계약을 강제한다.
function runScripts(root) {
  root.querySelectorAll('script').forEach(function (old) {
    if (old.src || old.type) return;
    var s = document.createElement('script');
    s.textContent = old.textContent;
    old.replaceWith(s);
  });
}

$('login').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('go').disabled = true; $('err').textContent = '';
  try {
    const r = await fetch(BASE + '/auth/login', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ email: $('email').value, password: $('pw').value }),
    });
    // 401 만 "틀렸다" 이다. 나머지는 고장이라 그렇게 말해야 한다 —
    // 뭉뚱그리면 화이트리스트가 비었거나 감사 쓰기가 죽은 것을 오타로 착각한다.
    if (r.status === 401) { $('err').textContent = '이메일 또는 비밀번호가 맞지 않습니다.'; return; }
    // 429 는 실패가 쌓여 잠긴 것이다(`private.admin_login_fail`). 몇 초 남았는지는
    // 함수만 아니까 그쪽 문장을 그대로 보여준다 — "(429)" 로 뭉치면 본인이 맞는 비번을
    // 계속 넣으면서 잠금을 스스로 늘린다.
    if (r.status === 429) {
      const d = await r.json().catch(() => null);
      $('err').textContent = d?.error || '로그인 시도가 많아 잠겼습니다. 잠시 뒤에 다시 시도하세요.';
      return;
    }
    if (!r.ok) { $('err').textContent = '로그인 처리가 실패했습니다 (' + r.status + ').'; return; }
    keep(await r.json());
    $('pw').value = '';
    await start();
  } catch (x) { $('err').textContent = String(x.message || x); }
  finally { $('go').disabled = false; }
});

async function start() {
  const boot = await (await call('/bootstrap')).json();
  $('login').style.display = 'none';
  $('app').style.display = 'grid';
  const groups = [];
  boot.nav.forEach((p) => {
    let g = groups.find((x) => x.name === p.group);
    if (!g) { g = { name: p.group, items: [] }; groups.push(g); }
    g.items.push(p);
  });
  $('nav').innerHTML = groups.map((g) =>
    '<div class="grp">' + g.name + '</div>' +
    g.items.map((p) => '<a href="#' + p.id + '" data-id="' + p.id + '">' + p.title + '</a>').join('')
  ).join('') + '<div class="who"></div><a class="out" id="out">로그아웃</a>';
  // 이메일은 **본문이 아니라 값**이다. innerHTML 로 붙이면 주소에 든 문자가 태그로 읽힌다.
  $('nav').querySelector('.who').textContent = boot.user.email;
  // 폭 예약이 쓰는 값(위 `nav a[data-t]::after`). 🔴 **속성에 문자열로 이어 붙이지 않는다** —
  // 제목에 따옴표가 하나 들어오면 마크업이 끊기고, 그때 예약도 같이 사라져 폭이 다시 튄다
  // (검사관이 잡았다). 그려진 글자에서 가져오므로 화면과 늘 같은 값이다.
  $('nav').querySelectorAll('a[data-id]').forEach((a) => { a.dataset.t = a.textContent; });
  // `href` 를 주지 않는다. 주는 순간 아래 nav 클릭 처리기의 "지금 열린 탭을 다시 눌렀나"
  // 비교(`getAttribute('href') === location.hash`)에 걸려 화면을 다시 부른다.
  $('out').addEventListener('click', 로그아웃);
  // 화면 이동은 앵커가 해시를 바꾸고 hashchange 하나가 받는다 — 뒤로/앞으로와
  // 가운데 클릭(새 탭)이 따로 배선 없이 같은 길을 탄다.
  // 다만 **지금 열린 탭을 다시 누르면 해시가 안 바뀌어 hashchange 가 안 뜬다.**
  // 그 자리에서 다시 열지 않으면 "탭을 다시 눌러 갱신" 이 조용히 사라진다.
  $('nav').addEventListener('click', (e) => {
    if (e.ctrlKey || e.metaKey || e.shiftKey) return;   // 새 탭으로 여는 클릭이다
    const a = e.target.closest('a');
    if (a && a.getAttribute('href') === location.hash) open(a.dataset.id);
  });
  NAV_IDS = boot.nav.map((p) => p.id);
  NAV_TITLE = new Map(boot.nav.map((p) => [p.id, p.title]));
  addEventListener('hashchange', show);
  show();
}

// 화면 id 목록은 **함수가 준 nav 에서만** 온다. 여기에 화이트리스트를 두지 마라 —
// 두는 순간 화면 목록이 공개 저장소에 박힌다.
let NAV_IDS = [];
// 탭 제목에 쓸 id → 이름. 화면 목록과 같은 곳(함수가 준 nav)에서만 온다.
let NAV_TITLE = new Map();

// 해시가 가리키는 화면을 연다. replaceState 는 hashchange 를 안 내므로 여기서 안 돈다.
function show() {
  const want = hashPage();
  const id = NAV_IDS.includes(want) ? want : NAV_IDS[0];
  if (!id) return;
  // 옛 형식(`#<함수이름>/…`)으로 들어와도 여기서 새 형식으로 갈린다.
  if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
  // 빈 값은 옛 북마크(`#<함수이름>`)라 조용히 첫 화면으로 내려도 된다. 이름이 들어 있는데
  // 모르는 것은 **낡은 링크**다 — 말하지 않으면 "그 화면이 원래 이렇게 열린다" 로 읽힌다.
  open(id, want && want !== id ? want : '');
}

// 뒤로가기를 연타하면 요청이 겹친다. 늦게 시작한 것이 먼저 오면 주소와 화면이 갈리므로,
// 마지막으로 연 것만 그린다.
let seq = 0;

async function open(id, missing) {
  const mine = ++seq;
  // 선택 표시는 **눈에만 보인다** — 왼쪽 바도 굵기도 스크린리더에는 안 들린다.
  // `aria-current="page"` 가 그 사실을 기계에게도 말한다 (2026-08-13 사용자 지시).
  $('nav').querySelectorAll('a').forEach((a) => {
    const 지금 = a.dataset.id === id;
    a.classList.toggle('on', 지금);
    if (지금) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
  // 칸이 14개라 화면이 짧으면 탭바 안에서 스크롤이 생긴다. 그 상태로 아래쪽 화면을
  // 북마크로 열면 선택 표시가 스크롤 밖이라 **어디가 열렸는지 안 보인다**
  // (2026-08-13 사용자 지시). `block:'nearest'` 라 이미 보이는 칸은 안 움직인다 —
  // 매번 가운데로 끌어오면 누를 때마다 목록이 튄다.
  $('nav').querySelector('a.on')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  // 탭 제목에 지금 화면 이름을 넣는다 (2026-08-13 사용자 지시). 어드민을 두 탭 열면
  // 둘 다 같은 제목이라 어느 것이 어느 화면인지 구분이 안 됐다.
  document.title = (NAV_TITLE.get(id) ? NAV_TITLE.get(id) + ' · ' : '') + '커리어코치 어드민';
  // 비워 두면 느린 화면에서 오른쪽이 하얀 채로 멈춰 있어 "안 눌렸나" 로 읽힌다
  // (2026-08-13 사용자 지시). 아래 fetch 가 끝나면 이 줄은 통째로 갈린다.
  $('main').innerHTML = '<p class="sub">불러오는 중…</p>';
  try {
    const html = await (await call('/view/' + id)).text();
    if (mine !== seq) return;
    $('main').innerHTML = html;
    if (missing) {
      const p = document.createElement('p');
      p.className = 'sub';
      p.textContent = '주소의 화면 이름 "' + missing + '" 은 없습니다 — 첫 화면을 열었습니다. 북마크를 확인하세요.';
      $('main').prepend(p);
    }
    runScripts($('main'));
  } catch (x) {
    if (mine !== seq) return;
    // 빈 화면을 두면 "아직 아무것도 없는 화면" 과 구분되지 않는다.
    $('main').innerHTML = '<h1>화면을 불러오지 못했습니다</h1><p class="sub"></p>';
    $('main').querySelector('.sub').textContent = String(x.message || x);
  }
}

// `!$('go').disabled` 를 같이 보던 판이 있었는데, 그 값을 참으로 만들던 유일한 곳이
// 함수 이름 형식 검사였다. 주소에서 함수 이름을 뺀 뒤로는 늘 거짓이라 죽은 조건이다.
// 토큰이 없어도 갱신 토큰이 있으면 이어 간다 — 브라우저를 껐다 켠 다음이 그 경우다.
if (token || refreshToken) {
  (token ? start() : renew().then((v) => {
    // 여기서도 일시 고장과 만료를 가른다. 못 갱신했다고 저장된 세션을 지우면
    // 오프라인으로 한 번 연 것이 7일짜리 세션을 날린다.
    if (v === 'ok') return start();
    throw new Error(v === 'expired' ? '401' : '지금 서버에 닿지 못했습니다. 잠시 뒤 새로고침하세요.');
  })).catch((x) => {
    const 만료 = String(x.message) === '401';
    if (만료) signOut(); else { $('app').style.display = 'none'; $('login').style.display = ''; }
    if (!만료) $('err').textContent = String(x.message || x);
  });
}
</script>
</body>
</html>
