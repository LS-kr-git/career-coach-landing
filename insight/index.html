<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- ★ 리퍼러 차단은 <head> 의 맨 앞이어야 한다.
     주소창에 열람 토큰이 실려 있으므로, 이 태그보다 먼저 나오는 외부 리소스 요청은
     Referer 헤더에 토큰이 든 전체 URL 을 붙여 보낸다. 아래 jsdelivr 스타일시트가 바로 그 경우다.
     GitHub Pages 는 HTTP 헤더를 못 준다 — 이 meta 가 유일한 수단이다 (전문-열람-규칙 4절). -->
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow">
<title>인사이트 — 커리어코치</title>
<link rel="icon" type="image/svg+xml" href="/assets/logo-circle.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 커리어코치 디자인 시스템 — letter.html·terms.html 과 같은 토큰·폭·타이포·헤더를 쓴다.
     이 페이지에서 새로 둔 값은 --amber-800 하나다(잠김 알약 글자색, 2026-10-04). */
  :root{
    color-scheme: only light;
    --amber-50:#FFFBEB; --amber-100:#FEF3C7; --amber-200:#FDE68A; --amber-500:#F59E0B; --amber-600:#D97706; --amber-800:#92400E;
    --navy-900:#1E3A8A; --navy-950:#172554;
    --gray-100:#F1F5F9; --gray-200:#E2E8F0; --gray-400:#94A3B8;
    --gray-500:#64748B; --gray-600:#475569; --gray-700:#334155; --gray-800:#1E293B;
    --pad-x: 24px;
    --card-max: 450px;
    /* CTA 규칙(2026-08-03) — 제품 공통. 값·근거는 CLAUDE.md "CTA 규칙" */
    --cta-h:54px; --cta-radius:14px; --cta-fs:15px; --cta-fw:700; --cta-max:410px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--gray-100)}
  body{
    font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;
    background:#fff; color:var(--gray-800); line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .page{width:100%;max-width:var(--card-max);margin:0 auto;background:#fff;min-height:100vh;min-height:100svh}

  header{display:flex;align-items:center;gap:10px;padding:24px var(--pad-x)}
  .app-icon{width:29px;height:29px;border-radius:25%;background:#fff;display:flex;align-items:center;justify-content:center}
  .app-icon img{width:29px;height:29px;display:block}
  header .wordmark{height:21px;display:block}

  /* 텍스트 스타일 (피그마 text/*) — letter.html 과 동일 */
  .t-h2{font-size:20px;line-height:28px;font-weight:700;letter-spacing:-0.01em}
  .t-h3{font-size:17px;line-height:24px;font-weight:600}
  .t-body{font-size:15px;line-height:23px;font-weight:400}
  .t-button{font-size:15px;line-height:20px;font-weight:600}
  .t-caption{font-size:13px;line-height:18px;font-weight:400}
  .t-caption-strong{font-size:13px;line-height:18px;font-weight:600}
  .t-number-s{font-size:13px;line-height:16px;font-weight:600}

  /* 읽기 진행 막대 — 스크롤한 만큼 찬다 (2026-09-25 컨펌 시안 5-A) */
  .prog{position:fixed;top:0;left:0;right:0;height:3px;z-index:30;pointer-events:none}
  .prog i{display:block;height:3px;width:0;background:var(--amber-500)}

  .brief{padding:8px var(--pad-x) 56px}
  h1{color:var(--navy-950)}

  /* 제목 아래 분야 · 소요 시간 — 왼쪽 주황 세로선 + 아이콘 (시안 M4 + 세로선) */
  .meta{display:flex;align-items:center;gap:12px;margin-top:14px;
    border-left:3px solid var(--amber-500);padding-left:10px;color:var(--gray-500)}
  .meta[hidden]{display:none}
  .meta-i{display:inline-flex;align-items:center;gap:4px}
  .meta-i[hidden]{display:none}
  .meta svg{flex:0 0 13px}

  /* 판정표(LOCKED)에 없는 상태 — 요약·잠김 상자 대신 이 한 줄만 선다 (피그마 2279:1307, 2026-10-04 사용자 지시) */
  .blocked{color:var(--gray-500);margin-top:24px;white-space:pre-line}
  .blocked[hidden]{display:none}

  /* 전문 */
  .body{margin-top:36px}
  .body p{color:var(--gray-700);margin-top:24px}
  .body p:first-child{margin-top:0}
  .src{margin-top:24px;color:var(--gray-500)}
  .src[hidden]{display:none}

  /* 「이 글, 도움이 됐나요?」 — 위아래 12px 회색 막대가 화면 끝까지 닿는다 (시안 R3 · E3 · 2026-10-04 8→12) */
  .band{margin:0 calc(-1 * var(--pad-x));border-top:12px solid var(--gray-100)}
  /* 반응 칸 아래 막대는 반응 칸이 갖는다 — 소장 목록이 비어 감춰져도 막대가 남게.
     그 뒤에 소장 목록이 서면 그쪽 윗막대를 지워 막대가 두 겹이 되지 않게 한다. */
  .fb{border-bottom:12px solid var(--gray-100)}
  #letter:has(#fb:not([hidden])) + .saved{border-top:0}
  .fb{margin-top:80px;padding:32px var(--pad-x) 40px}
  .fb[hidden]{display:none}
  .fb-q{color:var(--gray-800)}
  .fb-sub{color:var(--gray-500);margin-top:4px}
  .fb-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
  .fb-btn{height:52px;border-radius:14px;border:1px solid var(--gray-200);background:#fff;
    color:var(--gray-700);font-family:inherit;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px}
  /* 얼굴은 OS 이모지 대신 피그마(emoji-smile·emoji-confused)와 같은 입체 SVG — 기기마다 모양이 달라지지 않게 (2026-09-26 사용자 확정) */
  .fb-btn .em{flex:0 0 18px;display:block}
  .fb-btn[aria-pressed="true"]{border-color:var(--amber-500);background:var(--amber-50);color:var(--amber-600)}
  .fb-btn[disabled]{cursor:default}

  /* 잠김 — 제목 아래 흐려지며 사라지는 본문 + 그 아래 알약 안내 (2026-10-04 사용자 확정 P1·S3·B2,
     같은 날 피그마 762:2673 등 잠김 6장에서 요약을 빼고 알약을 흐린 본문 아래로 옮겼다).
     흐린 글은 진짜 본문이 아니다 — 잠긴 글은 서버가 본문을 안 보내므로(0023) 화면용 고정 문장이다.
     잠긴 글에는 반응 칸이 없으므로 아래 「소장해둔 글」 막대와 사이를 여기서 띄운다. */
  .lock{margin:24px 0 32px}
  .lock-pill{display:flex;align-items:center;gap:6px;width:max-content;max-width:100%;margin:24px auto 0;
    padding:7px 14px;border-radius:999px;background:var(--amber-100);color:var(--amber-800);word-break:keep-all;
    text-align:center;white-space:pre-line}
  /* 두 줄짜리 안내는 피그마처럼 알약이 폭을 다 채우고 글은 그 안 가운데에 선다(762:2694 · 2058:774 — 312 폭) */
  .lock-pill.multi{width:100%}
  .lock-pill.multi span{flex:1}
  .lock-pill svg{flex:none;color:var(--amber-600)}
  .ghost{color:var(--gray-700);filter:blur(3px);user-select:none;pointer-events:none;
    -webkit-mask-image:linear-gradient(#000,rgba(0,0,0,.55) 45%,transparent);
    mask-image:linear-gradient(#000,rgba(0,0,0,.55) 45%,transparent)}
  .ghost p+p{margin-top:16px}
  /* 버튼은 화면 바닥에 고정한다(시안 E). 잠긴 화면에서 누를 버튼이 있을 때만 선다. */
  .dock{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:20;width:100%;max-width:var(--card-max);
    padding:12px 20px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(rgba(255,255,255,0),#fff 30%)}
  /* 보충으로 글이 열리면 「이 편 열기」 의 hidden 은 그대로라 잠김 칸이 사라질 때 같이 숨긴다. */
  .page:has(#lock[hidden]) .dock, .dock:not(:has(.cta:not([hidden]))){display:none}
  .page:has(#lock:not([hidden])) .brief{padding-bottom:120px}
  .cta{display:flex;align-items:center;justify-content:center;width:100%;max-width:var(--cta-max);
    height:var(--cta-h);margin:0 auto;border:0;cursor:pointer;
    background:var(--amber-500);color:#fff;font-family:inherit;
    font-weight:var(--cta-fw);font-size:var(--cta-fs);border-radius:var(--cta-radius);
    box-shadow:0 6px 18px rgba(245,158,11,.25)}
  .cta:active{transform:scale(.98)}
  .cta[disabled]{opacity:.55;box-shadow:none}
  /* [hidden] 의 display:none 은 브라우저 기본값이라 위 display:flex 에 진다.
     없으면 JS 가 hidden 을 걸어도 버튼이 그대로 보인다 (playwright 로 확인). */
  .cta[hidden]{display:none}

  /* 소장 알림 — 소장된 전문을 열 때마다 떴다가 사라진다 (2026-09-13 컨펌 T2 · 2026-10-04 「열 때마다」).
     2026-10-04 피그마 2062:821 대로 제목 한 줄만 남겼다(링크·설명 줄 삭제).
     모션: 아래에서 12px 떠오르며 나타남(.24s) → 2.5초 머묾 → 12px 가라앉으며 사라짐(.26s).
     바닥에 붙은 알림이라 들어온 방향으로 나간다. 감속 설정이면 움직임 없이 흐려지기만 한다. */
  .toast{position:fixed;left:50%;bottom:24px;z-index:20;
    width:calc(100% - 40px);max-width:410px;
    background:#fff;border:1px solid var(--amber-200);border-radius:14px;padding:16px;
    box-shadow:0 10px 30px rgba(120,72,10,.16);
    transform:translate(-50%,12px);opacity:0;
    transition:transform .24s cubic-bezier(.2,.8,.2,1),opacity .24s ease-out}
  .toast.in{transform:translate(-50%,0);opacity:1}
  .toast.out{transform:translate(-50%,12px);opacity:0;
    transition:transform .26s cubic-bezier(.4,0,1,1),opacity .26s ease-in}
  .toast-top{display:flex;align-items:center;gap:10px}
  .toast-ic{flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:var(--amber-100);
    display:flex;align-items:center;justify-content:center}
  .toast-ttl{color:var(--gray-800);font-size:15px;line-height:23px;font-weight:600}
  @media (prefers-reduced-motion:reduce){
    .toast,.toast.in,.toast.out{transform:translate(-50%,0)}
  }

  /* 소장해둔 글 — 지금 보는 글을 뺀 최근 3편 (2026-09-25 컨펌). 서버가 이 글을 빼고 고른다(0102).
     목록을 못 받으면 이 절 전체가 hidden 으로 남는다. 위에 반응 칸이 없을 때(잠김)도 같은
     막대로 시작하게 막대는 이 절이 따로 갖는다. */
  .saved{padding:48px var(--pad-x) 0}
  .saved-head h2{color:var(--navy-900)}
  .idx{margin-top:10px}
  .idx-row{display:flex;gap:14px;align-items:flex-start;text-decoration:none;
    padding:16px 0;border-top:1px solid var(--gray-200)}
  .idx-row:first-child{border-top:0}
  .idx-n{flex:0 0 20px;color:var(--amber-500);letter-spacing:0.04em;padding-top:1px}
  .idx-t{flex-grow:1;color:var(--gray-800)}
  /* 밑줄은 2026-10-03 사용자 지시 — 피그마 2059:824 등 네 노드와 같은 값(밑줄 · 3px 띄움) */
  .saved-all{display:flex;justify-content:center;margin-top:20px;color:var(--gray-500);
    text-decoration:underline;text-underline-offset:3px}

  /* 안내(로딩·오류) — 본문이 없을 때만 보인다 */
  .notice{text-align:center;color:var(--gray-500);white-space:pre-line}
  /* 안내 묶음을 「화면 맨 위 ~ 화면 바닥」 사이의 정가운데에 — 09-C(mypage/leave #bye)와 같은 방식 (2026-10-04 사용자 지시).
     이 화면은 떠 있는 CTA 가 없어 아래 경계가 화면 바닥이다. main 은 헤더 아래에서 시작하므로 아래 여백을 헤더 높이로 두면
     main 의 가운데가 화면 가운데와 겹친다. 로고 헤더 77 = 피그마 2070:799·823·847 의 content 아래 여백 77 */
  .page:has(#notice:not([hidden])){display:flex;flex-direction:column}
  .page:has(#notice:not([hidden])) .brief{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 var(--pad-x) 77px}
  .page:has(#notice:not([hidden])):has(#backHd:not([hidden])) .brief{padding-bottom:calc(48px + env(safe-area-inset-top))}


  @media (min-width:451px){
    body{background:var(--gray-100)}
    .page{box-shadow:0 0 24px rgba(15,23,42,.06), 0 0 64px rgba(15,23,42,.10)}
  }
  :focus-visible{outline:2px solid var(--amber-500);outline-offset:2px}

  /* 마이페이지(저장소·일요일 열람)에서 열었을 때만 로고 대신 뒤로가기 헤더를 세운다
     (2026-10-03 사용자 컨펌 「1번」). 값은 랜딩 CLAUDE.md 「헤더와 뒤로가기 — 표준값」 그대로다. */
  .hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;
    height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;background:#fff}
  .hd[hidden]{display:none}
  .back{width:48px;height:48px;display:flex;align-items:center;justify-content:center;position:relative}
  .back svg{position:relative;z-index:1}
  .back::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:36px;height:36px;border-radius:10px;background:transparent;transition:background .12s}
  .back:active::before{background:var(--gray-100)}
  header[hidden]{display:none}
</style>
</head>
<body>
<div class="page">
  <div class="prog" aria-hidden="true"><i id="prog"></i></div>
  <header class="hd" id="backHd" hidden><a class="back" id="backLink" href="/mypage/" aria-label="뒤로"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15.75 4.5L8.25 12l7.5 7.5" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></header>
  <header id="logoHd">
    <div class="app-icon"><img src="/assets/mark-amber.svg" alt=""></div>
    <img class="wordmark" src="/assets/wordmark.svg" alt="커리어코치">
  </header>

  <main class="brief">
    <p class="notice t-body" id="notice" role="status">불러오는 중이에요…</p>

    <article id="letter" hidden>
      <h1 class="t-h2" id="title"></h1>
      <p class="meta t-caption" id="meta" hidden>
        <span class="meta-i" id="metaTrack"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg><span id="track"></span></span>
        <span class="meta-i" id="metaMins" hidden><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="mins"></span></span>
      </p>
      <p class="t-body blocked" id="blocked" hidden></p>

      <section class="lock" id="lock" hidden>
        <div class="ghost" aria-hidden="true">
          <p class="t-body">일하는 방식이 바뀌면 필요한 역량도 함께 바뀝니다. 현업에서 실제로 무엇이 달라지고 있는지 채용 공고와 인터뷰로 짚어 봅니다.</p>
          <p class="t-body">같은 직무라도 회사마다 기대하는 경험이 다릅니다. 지금 시장에서 어떤 경험이 더 높게 평가받는지 사례와 함께 정리했습니다.</p>
        </div>
        <p class="lock-pill t-caption-strong"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span id="lockMsg"></span></p>
      </section>

      <div class="body" id="body" hidden></div>
      <p class="src t-caption" id="src" hidden></p>

      <!-- 열린 글에만 선다. 잠긴 글에는 「도움이 됐나요」를 물을 수 없다(서버도 막는다 — 0102). -->
      <section class="band fb" id="fb" hidden>
        <p class="t-h3 fb-q">이 글, 도움이 됐나요?</p>
        <p class="t-caption fb-sub">다음 글을 고를 때 참고해요</p>
        <div class="fb-btns">
          <button class="fb-btn t-button" type="button" data-reaction="up" aria-pressed="false"><svg class="em" width="18" height="18" viewBox="0 0 36 36" aria-hidden="true"><defs><radialGradient id="eug" cx="42%" cy="30%" r="75%"><stop offset="0" stop-color="#FFE98A"/><stop offset=".55" stop-color="#FFCB3D"/><stop offset="1" stop-color="#F29A1A"/></radialGradient><linearGradient id="euh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="euf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6B3F12"/><stop offset="1" stop-color="#3E2208"/></linearGradient></defs><circle cx="18" cy="18" r="16.5" fill="url(#eug)"/><ellipse cx="18" cy="9" rx="10" ry="5.5" fill="url(#euh)"/><ellipse cx="9" cy="21" rx="3.4" ry="2.2" fill="#FF7A59" opacity=".35"/><ellipse cx="27" cy="21" rx="3.4" ry="2.2" fill="#FF7A59" opacity=".35"/><path d="M9.6 15.2c1.2-2.2 4.2-2.2 5.4 0M21 15.2c1.2-2.2 4.2-2.2 5.4 0" fill="none" stroke="url(#euf)" stroke-width="2.3" stroke-linecap="round"/><path d="M10.5 21.5c1.8 4.2 5 6 7.5 6s5.7-1.8 7.5-6c-4.8 1.3-10.2 1.3-15 0z" fill="url(#euf)"/></svg>도움 됐어요</button>

  const SAVED_TOAST = {
    title: '전문을 소장했어요',   // 2026-10-04 피그마 2062:821 — 제목 한 줄만 남았다
  };

  /* 서버 값에 붙여 그리는 글자 조각 (2026-09-25 컨펌 시안). 위 상수들과 같은 이유로 여기 모으고

     「출처 : Restaurant Dive」·「4분 소요」·「소장해둔 7편 전체 보기」 안에 그대로 들어 있어야 한다. */
  const PAGE_TEXT = {
    srcLabel: '출처 : ',
    minsTail: '분 소요',
    allHead:  '소장해둔 ',

  };
  // 소요 시간 — 본문 글자 수를 1분에 500자로 나눠 올림한다. 서버에 따로 두지 않는다(0102 머리말).
  const CHARS_PER_MIN = 500;

  const LOCKED = {
    makeup_offer:            '이번주에 못 읽은 전문 1개를 열 수 있어요',
    makeup_used:             '이번 주 추가 열기는 다 쓰셨어요.\n다음 주 일요일에 다시 열려요.',
    need_subscription:       '구독하면 지난 편도 이어서 볼 수 있어요',
    saved_need_subscription: '소장한 글이에요. 구독을 다시 시작하면 바로 열려요.',
    locked_past:             '지나간 전문이에요. 매주 일요일,\n이번주에 못 읽은 전문 1편을 다시 열수 있어요.',
  };

  /* 안내문(#notice)에 뜨는 문구. **여기 한 곳에 모아 둔다** — 「없는 글이에요」는 두 자리에서
     같은 말을 던지고 있었고, 「지금은 열 수 없어요」도 마찬가지였다. 더 중요한 이유는 검수다:
     docs-audit 은 <script> 를 걷어내고 웹을 훑으므로 흩어진 리터럴은 어느 대조도 못 받는다.
     상수로 모으고 스냅샷의 webScriptText 에 이름을 적으면 피그마 프레임과 맞대 본다. */
  const MSG = {
    badLink:  '링크가 올바르지 않아요.\n알림톡에서 받은 링크로 다시 열어 주세요.',   // 줄바꿈은 피그마 2070:870 그대로 (.notice 가 pre-line)
    notFound: '없는 글이에요.',
    blocked:  '지금은 전문을 열 수 없어요.\n문제가 발생하면\ncareercoach.my@gmail.com 로 문의해 주세요.',   // 줄바꿈은 피그마 2279:1326 그대로 (.blocked 가 pre-line)
  };

  /* 구독 CTA 의 목적지 — 결제 화면(2026-10-03 실결제 채널). 결제 화면이 로그인을 먼저 보고,
     로그인 뒤 다시 결제 화면으로 데려온다(assets/return-to.js). 전문 페이지는 토큰으로만 열려
     로그인이 없을 수 있어서다.
     page-audit 의 깨진 링크 검사는 이 상수를 못 본다 (2026-08-10 실측) — 주소를 바꾸면
     그 페이지가 저장소에 있는지 직접 본다. */
  const CHECKOUT_URL = '/checkout/';

  /* 구독 버튼 문구 — 구독했던 사람이면 「다시」다 (2026-10-03 사용자 확정).
     서버가 subscribed_before 로 알려 준다(career-coach 0121). 그 칸이 아직 없으면(0121 적용 전)
     소장한 편이 있다 = 구독했던 사람이라는 종전 판정으로 고른다. 삼항 안에 그대로 두면
     docs-audit 이 못 본다(<script> 를 걷어내고 웹을 훑는다) — 상수로 묶고 webScriptText 에
     이름을 적어 피그마 2058:775(구독필요)·2058:800(소장·구독만료) 과 맞댄다. */
  const SUB_CTA = {
    start: '구독 시작하기',
    again: '다시 구독하기',
  };
  const NEEDS_SUB = new Set(['need_subscription', 'saved_need_subscription']);

  const params = new URLSearchParams(location.search);
  const token = params.get('t') || '';
  const id = params.get('id') || '';

  // 토큰은 base64url 22자 고정이다(0023 의 length CHECK 와 같은 값).
  // 형식이 아니면 서버에 보내지 않는다 — 오타 링크로 RPC 를 두드릴 이유가 없다.
  const wellFormed = /^[A-Za-z0-9_-]{22}$/.test(token) && /^[0-9]{1,18}$/.test(id);

  // 마이페이지에서 온 길이면 뒤로가기 헤더 — 어디로 돌아갈지만 갈린다. 모르는 값이면 알림톡 모양 그대로.
  const BACK_TO = { archive: '/mypage/archive/', sunday: '/mypage/' };
  const backTo = BACK_TO[params.get('from')];
  if (backTo) {
    $('backLink').href = backTo;
    $('backHd').hidden = false;
    $('logoHd').hidden = true;
  }

  const notice = (text) => { $('notice').textContent = text; $('notice').hidden = false; $('letter').hidden = true; };

  /** RPC 한 번. 토큰은 본문(POST)으로만 나간다 — 쿼리스트링·로그·이벤트에 싣지 않는다.
      args 는 함수마다 다르다. PostgREST 는 **모르는 인자를 404 로 거절**하므로
      편 하나를 묻지 않는 함수에 p_insight_id 를 딸려 보내면 안 된다. */
  async function callRows(fn, args) {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        apikey: SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
      },
      body: JSON.stringify(args || { p_token: token, p_insight_id: Number(id) }),
    });
    const data = await res.json().catch(() => null);
    // 없는 글·만료 링크는 RPC 가 예외로 올린다. 그 메시지를 그대로 보여준다
    // (사람이 읽으라고 쓴 한국어이고, 우리가 옮겨 적으면 두 곳이 갈린다).
    if (!res.ok) throw new Error((data && data.message) || MSG.blocked);
    // returns table(...) 은 행 배열로 온다.
    if (!Array.isArray(data)) throw new Error(MSG.notFound);
    return data;
  }

  /** 편 하나를 묻는 호출. 행이 없으면 없는 글이다. */
  async function call(fn, args) {
    const rows = await callRows(fn, args);
    if (!rows.length) throw new Error(MSG.notFound);
    return rows[0];
  }

  function render(row) {
    $('notice').hidden = true;
    $('letter').hidden = false;
    $('title').textContent = row.title || '';
    // 분야 — 0102 전에는 track 이 안 온다(undefined). 그때는 줄을 통째로 감춘다.
    $('track').textContent = row.track || '';
    $('meta').hidden = !row.track;

    const bodyEl = $('body');
    bodyEl.replaceChildren();

    // ★ 판정 기준은 body 가 **null 인가**다. `if (row.body)` 로 쓰면 빈 문자열이
    //   잠김과 같은 취급을 받아, 본문이 비어 있는 편이 "잠겼어요" 로 보인다.
    //   RPC 는 열람 가능할 때만 body 를 채운다(0023 의 `case when v_can then i.body end`).
    if (row.body != null) {
      // DB 의 body 는 평문이다. innerHTML 로 넣지 않는다.
      const paras = String(row.body).split(/\n{2,}/).map((s) => s.trim()).filter(Boolean);
      // 글쓰기가 마지막 문단에 「출처: 매체. 커리어코치가 정리했어요.」를 적는다. 그 한 줄은
      // 본문이 아니라 캡션으로 따로 그린다(시안 3-A). 모양이 다르면 본문에 그대로 남긴다 —
      // 떼어 낼 자신이 없는 줄을 지우지 않는다.
      const src = /^출처\s*[:：]\s*(.+?)\s*(?:\.\s*커리어코치가 정리했어요\.?)?$/.exec(paras[paras.length - 1] || '');
      if (src) paras.pop();
      for (const para of paras) {
        const p = document.createElement('p');
        p.className = 't-body';
        p.textContent = para;
        bodyEl.appendChild(p);
      }
      $('src').textContent = src ? PAGE_TEXT.srcLabel + src[1] : '';
      $('src').hidden = !src;
      const chars = paras.join('').length;
      $('mins').textContent = Math.max(1, Math.ceil(chars / CHARS_PER_MIN)) + PAGE_TEXT.minsTail;
      $('metaMins').hidden = false;
      bodyEl.hidden = false;
      $('lock').hidden = true;
      반응표시(row.reaction || null);
      $('fb').hidden = false;

      // 소장은 **서버가 한다** — 전문을 내주는 그 자리에서 기록한다(0084).
      // 화면은 그 결과를 옮기기만 한다. 누를 버튼이 없는 것이 이 설계의 값어치다.
      // 알림은 **열 때마다** 뜬다(2026-10-04 사용자 지시). 처음 담긴 순간(just_saved)이 아니라
      // 소장된 상태(saved)를 본다 — 서버는 전문을 내줄 때 늘 소장도 적으므로 여기서는 늘 true 다.
      if (row.saved === true) 알림();
      return;
    }

    // 잠김 — 제목은 그대로 두고 전문만 막는다 (전문-열람-규칙 2절). 요약은 2026-10-04 피그마에서 빠졌다.
    bodyEl.hidden = true;
    $('src').hidden = true;
    $('fb').hidden = true;
    $('metaMins').hidden = true;
    const 잠김문구 = LOCKED[row.state];
    $('lock').hidden = !잠김문구;
    $('lockMsg').textContent = 잠김문구 || '';
    $('lockMsg').parentElement.classList.toggle('multi', !!잠김문구 && 잠김문구.includes('\n'));
    $('blocked').textContent = MSG.blocked;
    $('blocked').hidden = !!잠김문구;
    $('makeup').hidden = row.state !== 'makeup_offer';

    const sub = $('subscribe');
    sub.hidden = !NEEDS_SUB.has(row.state);
    const 했던 = row.subscribed_before ?? (row.state === 'saved_need_subscription');
    sub.textContent = 했던 ? SUB_CTA.again : SUB_CTA.start;
  }

  /** 소장 알림 — 소장된 전문을 **열 때마다** 뜬다(2026-10-04 사용자 지시).
      떠오름(.24s) → 2.5초 머묾 → 가라앉음(.26s) 뒤 지운다. 전환을 안 쓰는 기기에서는
      transitionend 가 안 오므로 **타이머로도 한 번 더 지운다** — 둘 중 먼저 오는 쪽이 이긴다. */
  function 알림() {
    const el = $('toast');
    $('toastTtl').textContent = SAVED_TOAST.title;
    el.classList.remove('in', 'out');
    el.hidden = false;
    // 한 프레임 그린 뒤에 in 을 붙여야 시작 위치(12px 아래)에서 전환이 걸린다.
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
    const 숨김 = () => { el.hidden = true; el.classList.remove('in', 'out'); };
    setTimeout(() => {
      el.classList.add('out');
      el.addEventListener('transitionend', 숨김, { once: true });
      setTimeout(숨김, 500);
    }, 240 + 2500);
  }

    btn.disabled = true;

  const 반응버튼 = [...document.querySelectorAll('.fb-btn')];
  function 반응표시(r) {
    for (const b of 반응버튼) b.setAttribute('aria-pressed', String(b.dataset.reaction === r));
  }
  for (const b of 반응버튼) {
    b.addEventListener('click', async () => {
      const 전 = 반응버튼.find((x) => x.getAttribute('aria-pressed') === 'true')?.dataset.reaction || null;
      if (전 === b.dataset.reaction) return;
      반응표시(b.dataset.reaction);
      반응버튼.forEach((x) => { x.disabled = true; });
      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/insight_react', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY,
                     Authorization: 'Bearer ' + SUPABASE_ANON_KEY },
          body: JSON.stringify({ p_token: token, p_insight_id: Number(id), p_reaction: b.dataset.reaction }),
        });
        if (!res.ok) throw new Error(String(res.status));
      } catch {
        반응표시(전);
      } finally {
        반응버튼.forEach((x) => { x.disabled = false; });
      }
    });
  }

  // 읽기 진행 막대 (시안 5-A). 스크롤할 것이 없으면 0 이다.
  const 진행 = () => {
    const 끝 = document.documentElement.scrollHeight - innerHeight;
    $('prog').style.width = (끝 > 0 ? Math.min(100, scrollY / 끝 * 100) : 0) + '%';
  };
  addEventListener('scroll', 진행, { passive: true });
  addEventListener('resize', 진행);

  /* 소장한 글 최근 3편. **전문과 별개의 호출이고, 실패해도 전문을 막지 않는다** —
     이 절은 전문에 덧붙는 것이라, 목록을 못 받았다고 편지를 못 읽게 만들 이유가 없다.
     그래서 실패는 삼키는 것이 아니라 **hidden 을 유지하는 것**이 정해진 동작이다:
     RPC 가 아직 없는 동안(404)도, 소장한 편이 0 편일 때도 같은 모양으로 안 보인다.
     ⚠️ 그래서 이 절이 안 보이는 것은 「소장한 편이 없다」의 증거가 아니다 —
     RPC 배포 여부는 화면이 아니라 `schema_migrations` 에서 본다.
     지금 보는 글은 서버가 빼고 3편을 고른다(p_exclude_id, 0102) — 화면이 거르면 2편이 남는다.
     날짜는 그리지 않는다(2026-09-25 사용자 지시). */
  async function loadSaved() {
    let rows;
    try {
      rows = await callRows('insight_saved_recent', { p_token: token, p_exclude_id: Number(id) });
    } catch { return; }
    if (!rows.length) return;

    const list = $('savedList');
    list.replaceChildren();
    rows.forEach((row, i) => {
      const a = document.createElement('a');
      a.className = 'idx-row';
      a.href = '/insight/?t=' + encodeURIComponent(token) + '&id=' + encodeURIComponent(row.insight_id);

      const n = document.createElement('span');
      n.className = 'idx-n t-number-s';
      n.textContent = String(i + 1).padStart(2, '0');

      const t = document.createElement('span');
      t.className = 'idx-t t-caption-strong';
      t.textContent = row.title || '';

      a.append(n, t);
      list.appendChild(a);
    });

    // total 은 모든 행에 같은 값으로 온다(지금 글을 빼기 전 수). 행이 있으면 반드시 있다.
    $('savedAll').textContent = PAGE_TEXT.allHead + rows[0].total + PAGE_TEXT.allTail;
    $('saved').hidden = false;
    진행();
  }

  if (!wellFormed) {
    notice(MSG.badLink);
  } else {
    try {
      render(await call('insight_letter'));
      // ★ 전문이 선 뒤에만 부른다. `notice()` 는 #letter 만 감추므로, 실패한 화면에서
      //   이것을 부르면 「없는 글이에요」 안내문 아래에 소장 목록이 따라 서게 된다.
      await loadSaved();
      진행();
    } catch (err) {
      notice(err.message);
    }
  }
</script>
</body>
</html>
