<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<meta name="format-detection" content="telephone=no">
<title>로그인 중 — 커리어코치</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/logo-circle.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    color-scheme: only light;
    --amber-500:#F59E0B; --amber-600:#D97706;
    --gray-100:#F1F5F9; --gray-200:#E2E8F0; --gray-500:#64748B; --gray-800:#1E293B;
    --card-max: 450px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--gray-100)}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;
    background:#fff;color:var(--gray-800);-webkit-font-smoothing:antialiased}
  .page{width:100%;max-width:var(--card-max);margin:0 auto;background:#fff;
    min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  .spin{width:28px;height:28px;border:3px solid var(--gray-200);border-top-color:var(--amber-500);
    border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
  p{font-size:14px;line-height:20px;color:var(--gray-500)}
  @media (min-width:451px){
    body{background:var(--gray-100)}
    .page{box-shadow:0 0 24px rgba(15,23,42,.06), 0 0 64px rgba(15,23,42,.10)}
  }
</style>
</head>
<body>
<div class="page">
  <div class="spin" aria-hidden="true"></div>
  <p role="status">로그인 중입니다…</p>
</div>

<script>
  // ★ supabase CDN 을 쓰는 아래 모듈과 **일부러 분리**했다. CDN 이 막히면 그 모듈은 한 줄도
  //   실행되지 않아 3초 폴백조차 등록되지 못하고, getSession() 이 응답 없이 멎어도 그 뒤의
  //   setTimeout 에 닿지 못한다 — 두 경우 모두 화면이 '로그인 중입니다…' 로 영영 멈춘다.
  //   (signup/index.html 이 동의 게이트를 분리해 둔 것과 같은 이유.)
  let done = false;
  window.ccGo = (path) => { if (!done) { done = true; location.replace(path); } };
  // 모듈이 살아 있으면 자기 3초 폴백으로 먼저 나간다. 이건 그마저 못 도는 경우만 맡는다.
  //
  // ★ "3초가 먼저" 는 CDN 이 빠를 때만 성립한다. 아래 3초 타이머는 CDN 로딩이 **끝난 뒤에야**
  //   걸리므로, 느린 모바일에서 CDN 6초 + getSession 2초면 8초가 먼저 터져 **인증에 성공한
  //   사람**을 /signup/?error=auth 로 보냈다. 8초를 키워 봐야 더 느린 기기에서 같은 일이 난다.
  //   그래서 시간이 아니라 **진척**을 본다 — 모듈이 한 걸음 나아갈 때마다 ccAlive() 로 이 타이머를
  //   다시 잰다. 8초 동안 아무 진척이 없을 때만 실패로 넘긴다. (2026-08-09)
  //   인증에 성공한 경우는 모듈이 곧바로 go() 를 불러 done 이 서므로 여기서 다시 보지 않는다.
  let timer;
  window.ccAlive = () => {
    clearTimeout(timer);
    timer = setTimeout(() => window.ccGo('/signup/?error=auth'), 8000);
  };
  window.ccAlive();
</script>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  // 접속 정보는 /assets/supabase-config.js 한 곳에만 둔다 (2026-08-06 복구 훈련 결과).
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from '/assets/supabase-config.js';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  window.ccAlive();   // CDN 로딩이 끝났다 — 위 하드 폴백의 8초를 여기서부터 다시 잰다

  const { track } = await import('/assets/track.js');
  window.ccAlive();   // track.js 도 별도 fetch 다 — 이 구간에 진척 신호가 없으면
                      // 앞 칸에서 잰 8초가 여기서 터져 성공한 로그인을 실패로 보낸다

  let logged = false;
  // 로그인 성공을 한 번만 남긴다. 아래 세 경로(이벤트·폴백·타임아웃)가 겹칠 수 있다.
  // access_token 을 넘겨야 track() 이 auth.uid() 로 사람을 알아본다 —
  // 안 넘기면 익명 이벤트가 되어 퍼널이 끊긴다.
  const markLogin = (session) => {
    if (logged || !session) return;
    logged = true;
    track('login', {}, session.access_token);
  };

  const go = window.ccGo;   // 이동 잠금은 위 폴백과 공유한다 — 두 경로가 겹쳐 두 번 이동하지 않게

  // supabase-js 는 detectSessionInUrl 기본값이 true 라 이 페이지에 도착하는 순간
  // 인가 코드를 세션으로 교환한다. 교환이 끝나면 SIGNED_IN 이 온다.
  supabase.auth.onAuthStateChange((_event, session) => {
    if (session) { markLogin(session); go('/onboarding/1/'); }
  });

  // 폴백 — 이벤트를 놓쳤거나 이미 교환이 끝난 뒤 리스너가 붙은 경우
  const { data: { session } } = await supabase.auth.getSession();
  window.ccAlive();   // 세션 조회까지 끝났다 — 판정은 아래 3초 폴백이 한다
  if (session) { markLogin(session); go('/onboarding/1/'); }

  // 3초 안에 세션이 안 생기면 실패로 본다 (사용자가 동의를 취소한 경우 등)
  setTimeout(async () => {
    // 이 폴백도 진척이다 — 여기서 다시 재지 않으면, 아래 getSession 이 5초를 넘길 때
    // 8초 하드 폴백이 먼저 터져 **인증에 성공한 사람**을 실패로 보낸다. 판정을 내리는
    // 구간에 진척 신호가 없던 것이 앞 판의 구멍이었다. (2026-08-09)
    window.ccAlive();
    const { data } = await supabase.auth.getSession();
    markLogin(data.session);
    go(data.session ? '/onboarding/1/' : '/signup/?error=auth');
  }, 3000);
</script>
</body>
</html>
