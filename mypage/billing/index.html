  .art::after{content:'';position:absolute;left:7px;bottom:7px;width:11px;height:8px;border-radius:2px;background:#FED7AA}
  .pcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .masked{color:var(--gray-500);letter-spacing:.06em}
  .link{color:var(--gray-600);text-decoration:underline;text-underline-offset:3px;
    background:none;border:0;font:inherit;font-size:14px;line-height:20px;cursor:pointer;flex:none;white-space:nowrap}
  /* 이용 중인 요금제 — 이름은 왼쪽 회색, 값은 오른쪽 진하게 (2026-10-05 사용자 컨펌 시안 v3 C) */
  .kv{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--gray-600)}

  .cancel{align-self:flex-end;color:var(--gray-400);background:none;border:0;

     (2026-10-05 사용자 컨펌 「해지 취소 v6」 · 「글자 버튼 색 v7」 1안) */
  .cancel.undo{color:var(--amber-700);text-decoration:underline;text-decoration-color:var(--amber-700);text-underline-offset:3px}
  /* 아래 고정 버튼 위 안내 한 줄 */
  .cta-dock.resume{flex-direction:column;align-items:center;gap:10px}
  .dock-note{font-size:13px;line-height:18px;color:var(--gray-600);text-align:center;padding:0 20px;word-break:keep-all}
  .page.has-dock.resume main{padding-bottom:124px}

  /* 하단 버튼(해지 취소) — 바탕 투명·그림자 없음, 버튼 자체의 앰버 그림자만. 폭은 CLAUDE.md 「CTA 규칙」 */
  .cta-dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--card-max);
    padding:14px 0 20px;display:flex;justify-content:center;pointer-events:none;z-index:10}
  .cta{width:calc(100% - 40px);max-width:410px;height:var(--cta-h);border:0;border-radius:var(--cta-radius);
    background:var(--amber-500);color:#fff;font:inherit;font-size:var(--cta-fs);font-weight:var(--cta-fw);
    line-height:22px;cursor:pointer;box-shadow:0 12px 32px rgba(217,119,6,.28);pointer-events:auto;
    -webkit-tap-highlight-color:transparent}
  .cta:active{transform:scale(.98)}
  /* 버튼이 마지막 줄을 가리지 않게 — 버튼 높이 + 위아래 여백 */
  .page.has-dock main{padding-bottom:96px}

  /* 끝에서 더 당겨도 흰 바탕이 이어지게 — 맨 위(헤더)·맨 아래가 모두 흰색이라 바깥 바탕도 흰색 한 가지로 둔다.
     마이페이지 첫 화면·랜딩과 같은 방식. 넓은 화면은 아래 블록의 회색 바탕 그대로 (2026-10-14 사용자 지시) */
  @media (max-width:450px){html,body{background:#fff}}
  /* 넓은 화면 카드 어포던스 — 랜딩(index.html)의 같은 블록과 값이 같다(2026-09-24 사용자 지시 · 모든 페이지).
     page-audit.mjs 「넓은 화면 바탕」이 빠진 페이지를 막는다. */
  @media (min-width:451px){
    body{background:var(--gray-100)}
    .page{box-shadow:0 0 24px rgba(15,23,42,.06), 0 0 64px rgba(15,23,42,.10)}
  }
</style>

<body>
<div class="page">

<div class="cta-dock resume" id="resumeDock" hidden><p class="cc-toast" id="resumeErr" role="alert" hidden></p><span class="dock-note" id="resumeNote"></span><button class="cta" type="button" id="resume">해지 취소하기</button></div>

<script type="module">
  import { track } from '/assets/track.js?v=8a4c7dcf';   // 회원 화면 오류 자동 보고 — import 만으로 걸린다
  import { 하단안내, 오류안내 } from '/assets/toast.js?v=f8247e72';
  import { 막대로 } from '/assets/skeleton.js?v=ac8118b7';
  /* 값은 전부 서버에서 온다 (career-coach 0086 `mypage_subscription` · `plan` 표).
     🔴 금액 상수를 여기 두지 않는다 (2026-09-21 사용자 결정 「세 곳 다 서버 값으로」) —
        화면에 적힌 금액과 실제 청구액이 갈리는 자리가 하나도 없어야 한다.
     두 상태 (2026-10-05 사용자 컨펌 시안 v3 C · v5 A):
       구독 중 — 멤버십 + 결제 + 이용 중인 요금제 + 맨 아래 해지 (피그마 03-C)
       조회 실패 — 멤버십 + 결제 자리에 실패 문구 (피그마 03-B 2157:997)
     구독 전이면 이 화면을 그리지 않고 결제 화면으로 바로 보낸다 (2026-10-19 사용자 지시) — 고르기·결제는 결제 화면 하나가 한다.
     replace 로 보낸다: 이 화면이 방문 기록에 남으면 결제 화면의 「뒤로」가 여기로 와서 다시 결제 화면으로 튕긴다. */
  import { requireLogin, getSubscription, resumeSubscription, billingView, billingFail }
    from '/assets/mypage-data.js?v=3a60e775';

  var $ = function (id) { return document.getElementById(id); };
  var 지금 = null;   // 마지막으로 그린 구독 — 해지 취소 뒤 다시 읽기만 실패했을 때 쓴다(아래 되돌리기)
  var page = document.querySelector('.page');
  var live = document.querySelector('.live');
  var cancel = document.querySelector('.cancel');
  var card = document.querySelector('.pcol .t-body-l');
  var cardSub = document.querySelector('.pcol .masked');
  var link = document.querySelector('.pcard .link');

  function paint(v, bad) {
    $('resumeDock').hidden = !v.canResume;
    $('resumeNote').textContent = v.resumeNote;
    page.classList.toggle('has-dock', v.canResume);
    page.classList.toggle('resume', v.canResume);
    $('member').hidden = false;
    $('mine').hidden = !v.subscribed;
    /* 못 읽었으면 카드 이름 두 줄을 스켈레톤으로, 실패는 하단 안내로 (2026-10-15 「오류 대체 화면」 S21) */
    if (bad) { 막대로(card, '92px', 20); 막대로(cardSub, '70px', 14); 오류안내($('errToast'), v.card); }

    live.hidden = !v.live;
    if (v.live) live.lastChild.textContent = v.live;
    $('planLabel').textContent = v.planLabel;
    $('price').textContent = v.price;
    $('nextLabel').textContent = v.nextLabel;
    $('next').textContent = v.next;
    cancel.hidden = !v.canCancel && !v.canResume;

    cancel.classList.toggle('undo', v.canResume);
  }

  /* 🔴 실패 처리기는 **조회 실패만** 받는다 (`.then(성공, 실패)`). `.catch` 로 뒤에 달면
     paint() 안의 오류까지 받아 실패 갈래가 또 터지고, 화면에는 마크업의 빈 상태가 남는다. */
  window.ccHold?.(requireLogin(location.pathname + location.search).then(function (ok) {
    return ok ? getSubscription() : undefined;
  }).then(function (s) {
    if (s === undefined) return;
    var v = billingView(s);
    if (!v.subscribed) { location.replace('/checkout/'); return; }
    지금 = s;
    paint(v, false);
  }, function () {
    /* 실패를 빈 상태로 그리면 결제한 사람이 「등록된 결제수단 없음」을 본다. */
    paint(billingFail(), true);
  }));

  /* 「변경」은 카드 등록 화면으로 보낸다 (2026-09-25 사용자 지시). 구독 중이면 서버가 새 카드만
     보관하고 걷지 않는다(`이미구독`) — 미납 중이면 다음 재시도가 그 카드로 걷는다.
     구독 전 사람은 이 화면에 머물지 않으므로(위 replace) 「등록」으로 결제하는 갈래는 없다. */
  link.addEventListener('click', function () { location.href = '/checkout/?mode=change'; });

  /* 해지는 해지 화면(/mypage/cancel/)에서 이유를 받고 한다 (2026-10-05 사용자 컨펌 「해지 사유 v3」).
     해지 예약된 사람에게는 같은 자리가 「해지 취소하기」다 — 아래 고정 버튼과 똑같이 동작한다. */
  cancel.addEventListener('click', function () {
    if (cancel.classList.contains('undo')) 되돌리기();
    else location.href = '/mypage/cancel/';
  });
  $('resume').addEventListener('click', 되돌리기);

  /* 해지 취소 — 확인 창 없이 바로 되돌리고 「구독 중」으로 다시 그린다 (2026-10-05 사용자 지시).
     실패하면 화면은 해지 예약 그대로 두고 버튼 위 하단 안내로 알린다(안내 줄은 종료일 안내 그대로 — 2026-10-15 S22). */
  var 되돌리는중 = false;
  function 되돌리기() {
    if (되돌리는중) return;
    되돌리는중 = true;
    /* 해지 취소 실패와 그 뒤 다시 읽기 실패를 가른다 — 한 갈래로 받으면 서버는 취소했는데 「취소하지 못했어요」가 떴다
       (2026-10-22 전체 점검 ③ 3바퀴째). 다시 읽기만 실패하면 마지막 구독에서 해지 예약만 걷어 그린다. */
    resumeSubscription().then(function () {
      return getSubscription().then(null, function (e) {
        // 서버가 확인하지 않은 값으로 그리므로 오류 보고에 남긴다(콘솔만으로는 자동 보고에 안 잡힌다)
        track('client_error', { msg: 'billing_resume:reread_failed ' + String((e && e.message) || e).slice(0, 80) });
        return Object.assign({}, 지금, { cancel_at_period_end: false });
      }).then(function (s) {
        지금 = s;
        paint(billingView(s), false);
        하단안내($('toast'));   // 해지 취소 뒤 안내 — 공용 「하단 안내」(글자 수 규칙)
      });
    }, function () {
      오류안내($('resumeErr'), '해지를 취소하지 못했어요. 잠시 후 다시 눌러 주세요');
    }).finally(function () { 되돌리는중 = false; });   // 그리기 오류가 나도 잠금은 푼다 — 오류는 삼키지 않아 track.js 가 보고한다
  }
</script>
</div>
