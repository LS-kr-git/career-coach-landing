<style>
  :root{
    color-scheme: only light;   /* meta 와 같은 값 — CSS 로도 선언해 확실히 적용한다 */
    --amber-50:#FFFBEB;--amber-100:#FEF3C7;--amber-200:#FDE68A;--amber-400:#FBBF24;--amber-500:#F59E0B;--amber-600:#D97706;--amber-700:#B45309;
    --gray-50:#F8FAFC;--gray-100:#F1F5F9;--gray-200:#E2E8F0;--gray-300:#CBD5E1;--gray-400:#94A3B8;
    --gray-500:#64748B;--gray-600:#475569;--gray-700:#334155;--gray-800:#1E293B;--gray-900:#0F172A;
    /* CTA 규칙(2026-08-03) — 제품 공통. 값·근거는 CLAUDE.md "CTA 규칙" */
    --cta-h:54px; --cta-radius:14px; --cta-fs:15px; --cta-fw:700;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:#fff}
  body{font-family:'Pretendard Variable',Pretendard,'Noto Sans CJK KR',-apple-system,sans-serif;
    background:#fff;color:var(--gray-800);-webkit-font-smoothing:antialiased}
  /* 화면 채우기용 높이는 svh 로 고정한다 — 근거는 onboarding/3 의 같은 주석. */
  .board{width:100%;max-width:450px;margin:0 auto;min-height:100vh;min-height:100svh;background:#fff;
    padding-bottom:calc(100px + env(safe-area-inset-bottom))}
  @media (min-width:451px){ body{background:var(--gray-100)}
    .board{box-shadow:0 0 24px rgba(15,23,42,.06),0 0 64px rgba(15,23,42,.10)} }

  .hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;
    height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;
    background:#fff}
  .back{width:48px;height:48px;display:flex;align-items:center;justify-content:center;
    border:0;background:none;padding:0;cursor:pointer;text-decoration:none;position:relative;
    -webkit-tap-highlight-color:transparent}
  .back svg{position:relative;z-index:1}
  .back::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:36px;height:36px;border-radius:10px;background:transparent;transition:background .12s}
  .back:active::before{background:var(--gray-100)}

  .prog{display:flex;gap:5px;padding:22px 24px 0}
  .prog i{height:3px;border-radius:99px;flex:1;
    background-image:linear-gradient(90deg,var(--amber-400) 0%,var(--amber-600) 100%);
    background-size:400% 100%;background-repeat:no-repeat}
  .prog i:nth-child(1){background-position:0% 0}
  .prog i:nth-child(2){background-position:33.3% 0}
  .prog i:nth-child(3){background-position:66.6% 0}
  .prog i:nth-child(4){background-position:100% 0}
  [hidden]{display:none!important}

  /* 「✓ 설정 완료」 줄은 없다(2026-10-05 확정) — 1~4단계처럼 진행 바 아래 끝 → 제목 글자 상자 위 끝 44px */
  .title{padding:44px 24px 0;font-size:24px;line-height:32px;font-weight:700;color:var(--gray-900);letter-spacing:-0.01em}

  /* 고른 값 요약 — 항목 넷(직군·연차·근무지·인사이트 주제). 피그마 2470:2492 「summary」.
     요약 칸에서 주황은 「바꾸기」뿐이다 — 칩은 흰 바탕 + 회색 테두리. */
  .sum{padding:10px 24px 0}
  .it{padding:16px 0;box-shadow:inset 0 -1px 0 var(--gray-100)}
  .it.last{box-shadow:none}
  .it .hd2{display:flex;align-items:center;justify-content:space-between}
  .it .k{display:flex;gap:4px;font-size:13px;line-height:18px;font-weight:600;color:var(--gray-500)}
  .it .n{font-weight:700;color:var(--gray-400)}
  .it .chg{font-size:13px;line-height:18px;font-weight:600;color:var(--amber-600);text-decoration:none;
    padding:8px 0;margin:-8px 0;-webkit-tap-highlight-color:transparent}
  .it .vals{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .it .vals b{padding:6px 10px;background:#fff;border:1px solid var(--gray-200);border-radius:8px;
    font-size:13px;line-height:18px;font-weight:500;color:var(--gray-700)}

  /* 요일 블록 — K1. 마이페이지 mypage/topics 의 같은 블록과 값이 같다. 요약 끝 → 제목 52px. */
  .days-title{padding:52px 24px 0;font-size:15px;line-height:21px;font-weight:700;color:var(--gray-900)}
  .days{margin:12px 24px 24px;background:var(--amber-50);border-radius:16px;padding:6px 16px}
  .dy{display:flex;gap:12px;padding:12px 0}
  .dy + .dy{box-shadow:inset 0 1px 0 var(--amber-100)}
  .dy .wd{flex:none;width:46px;font-size:13px;line-height:20px;font-weight:600;color:var(--amber-700)}
  .dy .nm{font-size:14px;line-height:20px;font-weight:700;color:var(--gray-900)}
  .dy .ds{margin-top:2px;font-size:12px;line-height:17px;color:var(--gray-500)}

  /* 오류 안내 — 버튼 바로 위 10px 에 공용 하단 안내 (2026-10-15 「오류 대체 화면」) */
  #errToast{bottom:calc(84px + env(safe-area-inset-bottom));z-index:30}
  .fade{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:450px;height:100px;
    background:linear-gradient(180deg,rgba(255,255,255,0),#fff 55%);pointer-events:none;z-index:9}
  .cta{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    width:calc(100% - 40px);max-width:410px;height:var(--cta-h);
    display:block;text-align:center;line-height:var(--cta-h);text-decoration:none;
    background:var(--amber-500);color:#fff;border-radius:var(--cta-radius);
    font-size:var(--cta-fs);font-weight:var(--cta-fw);
    box-shadow:0 12px 32px rgba(217,119,6,.28);cursor:pointer;z-index:10;
    -webkit-tap-highlight-color:transparent}
  .cta:active{transform:translateX(-50%) scale(.98)}

</style></head><body>

  </div>

</div>

<script type="module">
  // 앞 네 화면이 모아 둔 선택값을 읽어 확인시킨다 — assets/onboarding-store.js.
  // 주제 고르기는 2026-10-05 결정으로 4단계(/onboarding/4/)로 옮겨 갔다. 이 화면은 확인만 한다.
  import { readState, retryPending, complete, 상한 } from '/assets/onboarding-store.js';
  import { 오류안내 } from '/assets/toast.js';
  import { 이어갈곳판정 } from '/assets/mypage-data.js';
  // 직군 → 주제. 표는 tools/roles/tracks.json 이 정본이고 build.mjs 가 위 blob 을 만든다.
  // 푸는 규칙은 발송 경로(`ops/send.py` 「트랙과_직군」)와 같다 — assets/topic-map.js 한 곳에 있다.
  import { readTopicMap, trackFromJobs } from '/assets/topic-map.js';

  const MAP = readTopicMap();
  const state = readState();
  // 이 브라우저에 고른 값이 없으면(주소로 바로 열었거나 저장소가 비었다) 확인할 것이 없다 — 1단계로 보낸다.
  // 그대로 두면 「아직 못 정했어요」만 보이는 채 완료 버튼이 살아 있고, 결제 화면이 다시 1단계로 돌려보낸다(2026-10-15 출시 검수).
  if (!complete(state)) { window.ccLeave?.(); location.replace(이어갈곳판정(false, null, state)); }   // 빠진 첫 단계로(2026-10-16)
  // 4단계에서 직접 고른 주제가 없으면(=직군에 맞춰) 직군이 정하는 주제가 실제로 받는 주제다.
  const topic = state.topic || trackFromJobs(MAP, state.jobs);

  // ① 고른 값 요약 — 값 전부를 칩으로. 없는 값은 항목을 통째로 감춘다 — 빈 칸이 남으면 고장으로 보인다.
  const esc = (t) => { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; };
  const put = (id, values) => {
    const el = document.getElementById(id);
    if (!values.length) { el.hidden = true; return; }
    el.querySelector('.n').textContent = values.length > 1 ? String(values.length) : '';
    el.querySelector('.vals').innerHTML = values.map((v) => `<b>${esc(v)}</b>`).join('');
  };
  put('s-job', state.jobs.map((c) => (MAP.jobs[c] || [c])[0]));
  put('s-year', state.years === null ? [] : [state.yearsMax === null || state.yearsMax === state.years
    ? `${state.years}년` : `${state.years}~${state.yearsMax}년`]);
  put('s-region', state.regions);
  put('s-topic', [topic || '아직 못 정했어요']);
  // 마지막으로 보이는 항목 아래에는 선을 긋지 않는다(감춘 항목이 있어도).
  const shown = [...document.querySelectorAll('.sum .it')].filter((el) => !el.hidden);
  if (shown.length) shown[shown.length - 1].classList.add('last');

  // ② 요일 블록의 월·수·금 줄 — 발송 편성 그대로. 공통 주제를 골랐으면 월·수·금도 그 트랙이다
  //    (마이페이지 mypage/topics 와 같은 이름 규칙).
  document.getElementById('mine').textContent = !topic ? '아직 못 정했어요'
    : (MAP.common.includes(topic) ? '일 잘하는 법·커리어' : topic) + ' 인사이트';

  // ③ 지난 저장이 실패한 채 남아 있으면 여기서 다시 보낸다.
  // 🔴 **완료 CTA 가 이 약속을 기다린다** (2026-09-11 검사관 ①). 그냥 링크로 두면 누르는 순간
  //    페이지가 떠나며 RPC 가 끊긴다. 결제 화면(/checkout/)은 retryPending() 을 부르지 않으므로
  //    여기서 끊기면 재시도는 사용자가 마이페이지에 닿을 때까지 미뤄진다.
  let 재시도 = retryPending();
  const cta = document.querySelector('.cta');
  let 가는중 = false;
  // 결제 화면에서 뒤로 와 bfcache 로 되살아나면(iOS 사파리) 떠날 때 세운 표시가 그대로라 「완료」가 영영 안 눌린다(2026-10-15 출시 검수).
  addEventListener('pageshow', (e) => {
    if (!e.persisted) return;
    가는중 = false; cta.removeAttribute('aria-busy');
    재시도 = retryPending();
  });
  // 앞 단계 저장이 실패한 채 들어왔고 여기서 다시 보낸 것도 실패했으면 「완료」를 누르기 전에 알린다
  // (2026-10-15 「오류 대체 화면」 D1 B안). 이미 「완료」를 눌렀으면 그쪽(D2)이 말한다.
  재시도.then((r) => {
    if (r && r.status === 'error' && !가는중) 오류안내(document.getElementById('errToast'), '설정을 아직 저장하지 못했어요.\n완료를 누르면 다시 저장할게요');
  }, () => {});
  cta.addEventListener('click', (e) => {
    e.preventDefault();
    if (가는중) return;
    가는중 = true;
    cta.setAttribute('aria-busy', 'true');
    // 저장이 실패했으면 넘어가지 않는다 — 저장 안 된 채 결제로 가면 결제 화면(S13)에서 막힌다 (2026-10-15 「오류 대체 화면」 D2).
    // 다시 누르면 다시 보낸다. 그 밖의 결과(보낼 것 없음·로그인 전 등)는 전처럼 넘어간다.
    // 8초 넘게 붙잡히면 결제 화면으로 넘어간다 — 결제 화면이 미뤄진 저장을 다시 보내고, 그래도 안 되면 거기서 막고 말한다.
    상한(재시도.catch(() => ({ status: 'error' }))).then((r) => {
      if (r && r.status === 'error') {
        가는중 = false;
        cta.removeAttribute('aria-busy');
        오류안내(document.getElementById('errToast'), '설정을 저장하지 못했어요. 다시 눌러 주세요');
        재시도 = retryPending();
        return;
      }
      location.href = cta.getAttribute('href');
    });
  });
</script>
</body></html>
