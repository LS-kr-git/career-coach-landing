<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<meta name="format-detection" content="telephone=no">
<title>채용공고 받을 근무지 — 커리어코치</title>
<meta name="description" content="커리어코치에서 받아볼 채용공고 근무지를 고릅니다.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/logo-circle.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    color-scheme: only light;
    --amber-50:#FFFBEB; --amber-100:#FEF3C7; --amber-500:#F59E0B; --amber-600:#D97706;
    --amber-700:#B45309; --amber-800:#92400E; --amber-950:#451A03;
    --emerald-500:#10B981;
    --gray-50:#F8FAFC; --gray-100:#F1F5F9; --gray-200:#E2E8F0; --gray-300:#CBD5E1;
    --gray-400:#94A3B8; --gray-500:#64748B; --gray-600:#475569; --gray-700:#334155;
    --gray-800:#1E293B; --gray-900:#0F172A; --stone-50:#FAFAF9;
    /* CTA 토큰 — CLAUDE.md 「CTA 규칙」 공통값 */
    --cta-h:54px; --cta-radius:14px; --cta-fs:15px; --cta-fw:700;
    /* 랜딩과 동일한 폭 시스템 */
    --pad-x:24px; --card-max:450px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--gray-100)}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;
    background:#fff;color:var(--gray-800);-webkit-font-smoothing:antialiased}
  /* CLAUDE.md 규칙 — 화면 채우기 높이는 svh */
  .page{width:100%;max-width:var(--card-max);margin:0 auto;background:#fff;
    min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
  /* 헤더·뒤로가기 — CLAUDE.md 「헤더와 뒤로가기 표준값」 (피그마 376:2507) */
  .hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;
    height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;background:#fff}
  .back{width:48px;height:48px;display:flex;align-items:center;justify-content:center;position:relative}
  .back svg{position:relative;z-index:1}
  .back::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:36px;height:36px;border-radius:10px;background:transparent;transition:background .12s}
  .back:active::before{background:var(--gray-100)}
  main{flex:1;display:flex;flex-direction:column;width:100%;max-width:var(--card-max);margin:0 auto}
  /* 떠 있는 CTA(바닥 20+54)와 흰 그라데이션(100)에 내용이 안 깔리게 — 온보딩 .board 와 같은 값, 피그마 화면 paddingBottom 100 */
  main{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
  /* 피그마 텍스트 스타일 대응 (careercoach 컬렉션 text/*) */
  .t-h4{font-size:15px;line-height:22px;font-weight:600}
  .t-body-s{font-size:14px;line-height:20px;font-weight:400}
  /* 하단 플로팅 CTA — 온보딩 1단계(.fade + .cta)와 같은 모양: 흰 그라데이션 100px 위에 떠 있고 바닥에서 20 */
  .cta-dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--card-max);
    padding:26px 0 20px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 55%);
    display:flex;justify-content:center;pointer-events:none;z-index:10}
  /* 폭은 저장소 정본을 따른다 — CLAUDE.md 「CTA 규칙」: 플로팅은 calc(100% - 40px) · max 410.
     피그마 프레임이 320 인 것은 360 기준이라 그런 것이고, 웹 폭(카드 450)과 다른 것이 의도된 상태다
     (career-coach docs/기획/피그마-웹-동기화.md 「폭에 관한 확정 사항」). */
  .cta{width:calc(100% - 40px);max-width:410px;height:var(--cta-h);border:0;border-radius:var(--cta-radius);
    background:var(--amber-500);color:#fff;font:inherit;font-size:var(--cta-fs);font-weight:var(--cta-fw);
    line-height:20px;cursor:pointer;box-shadow:0 12px 32px rgba(217,119,6,.28);pointer-events:auto;
    display:flex;align-items:center;justify-content:center;gap:0;-webkit-tap-highlight-color:transparent}
  .cta:not([disabled]):active{transform:scale(.98)}
  .cta .s2{opacity:.85}
  .cta[disabled]{background:var(--gray-100);color:var(--gray-400);box-shadow:none;cursor:default}
  [hidden]{display:none!important}

  /* 제목·설명 — 온보딩 1단계와 같은 값(피그마 275:2404). 진행 바·단계 줄이 없는 자리라 위만 20 */
  .title{padding:20px var(--pad-x) 0}
  .title h1{font-size:24px;line-height:32px;font-weight:700;letter-spacing:-.01em;color:var(--gray-900)}
  .desc{padding:10px var(--pad-x) 0;color:var(--gray-500);word-break:keep-all}

  .scroll{padding:24px var(--pad-x) 0}
  /* 칩·묶음 — 온보딩 3단계(피그마 275:2440)의 값을 그대로 옮겼다 */
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .c{font:inherit;font-size:13px;border:1px solid var(--gray-200);background:#fff;color:var(--gray-600);border-radius:10px;
    padding:8px 11px;line-height:18px;font-weight:400;
    cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;
    transition:background .12s,border-color .12s,color .12s}
  .c:active{transform:scale(.97)}
  .c.on{background:var(--amber-50);border-color:var(--amber-500);color:var(--amber-600)}
  /* 상한이 차면 안 고른 칩은 잠긴다 — 색은 CTA 잠김과 같은 gray-100/gray-400 짝을 쓴다 */
  .c.lock{background:var(--gray-100);border-color:var(--gray-200);color:var(--gray-400);cursor:default}
  .c.lock:active{transform:none}

  .grp{margin-bottom:24px}
  .ghead{display:flex;align-items:center;margin-bottom:10px}
  .ghead h3{font-size:13px;line-height:18px;font-weight:600;color:var(--gray-500)}
  /* 넓은 화면 카드 어포던스 — 랜딩(index.html)의 같은 블록과 값이 같다(2026-09-24 사용자 지시 · 모든 페이지).
     page-audit.mjs 「넓은 화면 바탕」이 빠진 페이지를 막는다. */
  @media (min-width:451px){
    body{background:var(--gray-100)}
    .page{box-shadow:0 0 24px rgba(15,23,42,.06), 0 0 64px rgba(15,23,42,.10)}
  }
</style>
</head>
<body>
<div class="page">
<header class="hd"><a class="back" href="/mypage/" aria-label="뒤로"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15.75 4.5L8.25 12l7.5 7.5" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></header>
<main>
  <div class="title"><h1>어디에서<br>일하고 싶으세요?</h1></div>
  <div class="desc t-body-s">최대 3개 지역까지 함께 고를 수 있어요</div>
  <div class="scroll"><div class="grp"><div class="ghead"><h3>수도권</h3></div><div class="chips"><button class="c" type="button" aria-pressed="false">서울</button><button class="c" type="button" aria-pressed="false">경기</button><button class="c" type="button" aria-pressed="false">인천</button></div></div><div class="grp"><div class="ghead"><h3>충청·강원</h3></div><div class="chips"><button class="c" type="button" aria-pressed="false">대전</button><button class="c" type="button" aria-pressed="false">세종</button><button class="c" type="button" aria-pressed="false">충북</button><button class="c" type="button" aria-pressed="false">충남</button><button class="c" type="button" aria-pressed="false">강원</button></div></div><div class="grp"><div class="ghead"><h3>영남</h3></div><div class="chips"><button class="c" type="button" aria-pressed="false">부산</button><button class="c" type="button" aria-pressed="false">대구</button><button class="c" type="button" aria-pressed="false">울산</button><button class="c" type="button" aria-pressed="false">경북</button><button class="c" type="button" aria-pressed="false">경남</button></div></div><div class="grp"><div class="ghead"><h3>호남·제주</h3></div><div class="chips"><button class="c" type="button" aria-pressed="false">광주</button><button class="c" type="button" aria-pressed="false">전북</button><button class="c" type="button" aria-pressed="false">전남</button><button class="c" type="button" aria-pressed="false">제주</button></div></div><div class="grp"><div class="ghead"><h3>기타</h3></div><div class="chips"><button class="c" type="button" aria-pressed="false">재택·원격</button></div></div></div>
</main>
<div class="cta-dock">
  <button class="cta" type="button" id="save" disabled><span id="lab">지역을 1개 이상 골라주세요</span></button>
</div>
<script type="module">
  /* 고른 근무지는 온보딩 3단계와 **같은 값**이다 — 칩 글자가 곧 지역 코드다(save_onboarding 계약).
     저장·복원·서버 전송은 assets/onboarding-store.js 를 그대로 쓴다. */
  import { readState, writeState, retryPending, pullFromServer } from '/assets/onboarding-store.js';
  import { requireLogin, FAIL, savePrefs } from '/assets/mypage-data.js';
  retryPending();
  /* 🔴 상한 3. 온보딩 3단계·onboarding-store 의 MAX_REGIONS·save_onboarding 검증과 같은 수다 */
  const MAX = 3;
  const chips = [...document.querySelectorAll('.grp .c')];
  const save = document.getElementById('save'), lab = document.getElementById('lab');
  let 읽기실패 = false;
  const isOn = (c) => c.classList.contains('on');
  function refresh() {
    const n = chips.filter(isOn).length;
    chips.forEach((c) => {
      const lock = n >= MAX && !isOn(c);    // 상한이 차면 안 고른 칩을 잠근다
      c.classList.toggle('lock', lock); c.disabled = lock;
      c.setAttribute('aria-pressed', isOn(c) ? 'true' : 'false');
    });
    save.disabled = 읽기실패 || n === 0;
    if (읽기실패) lab.textContent = FAIL.line;
    else if (n) lab.innerHTML = '저장 <span class="s2">· ' + n + '개 지역</span>';
    else lab.textContent = '지역을 1개 이상 골라주세요';
  }
  chips.forEach((c) => c.addEventListener('click', () => { if (!c.classList.contains('lock')) { c.classList.toggle('on'); refresh(); } }));
  save.addEventListener('click', () => {
    const before = { regions: readState().regions };
    writeState({ regions: chips.filter(isOn).map((c) => c.textContent.trim()) });
    save.disabled = true;
    savePrefs(before).then((st) => {
      if (st === 'no-session') return;          // store 가 이미 /signup/ 으로 보냈다
      if (st !== 'ok') { lab.textContent = FAIL.line; save.disabled = false; return; }   // 저장된 것만 저장됐다고 말한다
      location.href = '/mypage/';
    }, () => { lab.textContent = FAIL.line; save.disabled = false; });
  });
  function hydrate() {
    const want = new Set(readState().regions); let n = 0;
    chips.forEach((c) => { const hit = want.has(c.textContent.trim()) && n < MAX; if (hit) n++; c.classList.toggle('on', hit); });
    refresh();
  }
  refresh();
  requireLogin().then((ok) => { if (ok) return pullFromServer().then(hydrate); })
    .catch(() => { 읽기실패 = true; hydrate(); });
</script>
</div>
</body>
</html>
