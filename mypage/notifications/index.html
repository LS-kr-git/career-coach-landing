<style>
  :root{

    --amber-500:#F59E0B; --emerald-50:#ECFDF5; --emerald-500:#10B981; --emerald-700:#047857;
    --gray-50:#F8FAFC; --gray-100:#F1F5F9; --gray-200:#E2E8F0; --gray-300:#CBD5E1;
    --gray-400:#94A3B8; --gray-500:#64748B; --gray-600:#475569; --gray-800:#1E293B; --gray-900:#0F172A;
    --pad-x:24px; --card-max:450px;

  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--gray-100)}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;
    background:#fff;color:var(--gray-800);-webkit-font-smoothing:antialiased}
  .page{width:100%;max-width:var(--card-max);margin:0 auto;background:#fff;
    min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
  .hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;
    height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;background:#fff}
  .back{width:48px;height:48px;display:flex;align-items:center;justify-content:center;position:relative}
  .back svg{position:relative;z-index:1}
  .back::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:36px;height:36px;border-radius:10px;background:transparent;transition:background .12s}
  .back:active::before{background:var(--gray-100)}
  main{flex:1;display:flex;flex-direction:column;width:100%;max-width:var(--card-max);margin:0 auto}
  .t-display{font-size:28px;line-height:36px;font-weight:800;letter-spacing:-.02em;color:var(--gray-900)}
  [hidden]{display:none!important}
  .title{padding:20px var(--pad-x) 9px}
  /* 알림 설정 (2026-10-20 사용자 확정 — 바깥은 시안 B v2, 상자 안은 「B · 디자인 시스템」) */
  .wrap{padding:24px var(--pad-x) 40px;display:flex;flex-direction:column;gap:28px}
  .lbl{font-size:13px;line-height:18px;font-weight:600;color:var(--gray-500);margin:0 4px 10px}
  .card{background:#fff;border:1px solid var(--gray-200);border-radius:16px;overflow:hidden}
  .row{display:flex;align-items:center;gap:14px;padding:17px 18px}
  .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .nm{font-size:15px;line-height:22px;font-weight:600;color:var(--gray-800)}
  .sub{font-size:13px;line-height:18px;color:var(--gray-500)}
  .when{font-size:12px;line-height:17px;color:var(--gray-400)}
  /* 「항상 받음」 — 멤버십·결제의 「구독 중」 칩과 같은 모양 */
  .live{display:flex;align-items:center;gap:5px;color:var(--emerald-700);flex:none;background:var(--emerald-50);
    border-radius:9999px;padding:4px 9px;font-size:11px;line-height:14px;font-weight:600}
  .live i{width:6px;height:6px;border-radius:9999px;background:var(--emerald-500);flex:none}
  .sw{appearance:none;-webkit-appearance:none;flex:none;width:44px;height:26px;margin:0;border-radius:9999px;
    background:var(--gray-300);position:relative;cursor:pointer;transition:background .2s}
  .sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
    box-shadow:0 1px 2px rgba(17,17,17,.2);transition:transform .2s}
  .sw:checked{background:var(--amber-500)}
  .sw:checked::after{transform:translateX(18px)}
  .sw:disabled{cursor:default}
  @media (max-width:450px){html,body{background:#fff}}
  /* 넓은 화면 카드 어포던스 — 랜딩(index.html)의 같은 블록과 값이 같다(2026-09-24 사용자 지시 · 모든 페이지). */
  @media (min-width:451px){
    body{background:var(--gray-100)}
    .page{box-shadow:0 0 24px rgba(15,23,42,.06), 0 0 64px rgba(15,23,42,.10)}
  }

     처리 결과(일자·전송자·결과)는 하단 안내로 알린다(정보통신망법 50조 7항). 못 읽으면 스위치를 잠근 채 둔다. */
