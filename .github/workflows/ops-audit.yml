# 어드민 셸(ops/index.html) 검수 53항목 — 훅이 아니라 여기서 돈다.
#
# 훅에 안 다는 이유는 tools/ops-audit/README.md 「왜 훅에 없나」 가 정본이다.
# 요약: 크로미움 600MB 가 필요한데 랜딩 훅에는 CC_SKIP_HOOK 같은 부분 우회가 없어서,
# 브라우저 없는 PC 에서 한 번 막히면 그 뒤로는 --no-verify(= 검수 전체 끄기)를 쓰게 된다.
#
# 이 저장소는 공개라 Actions 가 무료다(비공개인 career-coach 와 다르다).
# ops/ 나 검수 스크립트가 바뀐 푸시에만 돌아서 평소에는 분을 안 먹는다.
name: 어드민 셸 검수

on:
  push:
    branches: [main]
    # 🔴 assets/supabase-config.js 는 ops/index.html 이 실제로 import 하는 파일이다.
    #    여기가 깨지면 셸이 통째로 안 뜨는데, 필터에 없으면 **실행 자체가 안 생겨서**
    #    main 이 빨간불도 건너뜀도 없이 조용하다(검사관 지적).
    #    아래 목록이 pull_request 와 겹치는 것은 GitHub Actions 가 YAML 앵커를 안 받기 때문이다.
    paths:
      - 'ops/**'
      - 'tools/ops-audit/**'
      - 'assets/supabase-config.js'
      - '.github/workflows/ops-audit.yml'
  pull_request:
    paths:
      - 'ops/**'
      - 'tools/ops-audit/**'
      - 'assets/supabase-config.js'
      - '.github/workflows/ops-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치에 연속으로 밀면 앞 실행을 버린다. 마지막 상태만 맞으면 된다.
concurrency:
  group: ops-audit-${{ github.ref }}
  cancel-in-progress: true

# 🔴 저장소에 package.json 이 **없다.** .gitignore 가 "검수용 스크래치 — 커밋하지 말 것"
#    으로 package.json·package-lock.json 을 둘 다 막아 뒀다. 그래서 npm ci 를 못 쓰고
#    (첫 실행이 EUSAGE 로 죽었다) 버전을 여기에 적어 둔다. 사람 PC 의 스크래치
#    package.json 과 같은 값으로 맞춘다 — 지금은 둘 다 1.62.1 이다.
env:
  PLAYWRIGHT_VERSION: '1.62.1'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 크로미움 600MB 를 매번 받지 않는다.
      - name: 크로미움 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: playwright 설치
        run: npm install --no-save --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"

      # playwright 패키지의 scripts 가 비어 있어 설치만으로는 브라우저가 안 깔린다.
      - name: 크로미움 설치
        run: npx playwright install --with-deps chromium

      # CI=true 는 Actions 가 넣어 준다 → 브라우저가 없으면 harness 가 종료코드 1 을 낸다.
      # "브라우저가 없어서 조용히 통과" 를 여기서만 사고로 센다.
      - name: 해시 라우팅 검수
        run: node tools/ops-audit/route.mjs

      - name: 세션 이어가기·로그아웃 검수
        run: node tools/ops-audit/session.mjs
