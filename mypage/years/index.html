<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<meta name="format-detection" content="telephone=no">
<title>채용공고 받을 연차 — 커리어코치</title>
<meta name="description" content="커리어코치에서 받아볼 채용공고 연차를 고릅니다.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/logo-circle.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    color-scheme: only light;
    --amber-50:#FFFBEB; --amber-100:#FEF3C7; --amber-500:#F59E0B; --amber-600:#D97706;
    --amber-700:#B45309; --amber-800:#92400E; --amber-950:#451A03;
    --emerald-500:#10B981;
    --gray-50:#F8FAFC; --gray-100:#F1F5F9; --gray-200:#E2E8F0; --gray-300:#CBD5E1;
    --gray-400:#94A3B8; --gray-500:#64748B; --gray-600:#475569; --gray-700:#334155;
    --gray-800:#1E293B; --gray-900:#0F172A; --stone-50:#FAFAF9;
    /* CTA 토큰 — CLAUDE.md 「CTA 규칙」 공통값 */
    --cta-h:54px; --cta-radius:14px; --cta-fs:15px; --cta-fw:700;
    /* 랜딩과 동일한 폭 시스템 */
    --pad-x:24px; --card-max:450px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--gray-100)}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;
    background:#fff;color:var(--gray-800);-webkit-font-smoothing:antialiased}
  /* CLAUDE.md 규칙 — 화면 채우기 높이는 svh */
  .page{width:100%;max-width:var(--card-max);margin:0 auto;background:#fff;
    min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
  /* 헤더·뒤로가기 — CLAUDE.md 「헤더와 뒤로가기 표준값」 (피그마 376:2507) */
  .hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;
    height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;background:#fff}
  .back{width:48px;height:48px;display:flex;align-items:center;justify-content:center;position:relative}
  .back svg{position:relative;z-index:1}
  .back::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:36px;height:36px;border-radius:10px;background:transparent;transition:background .12s}
  .back:active::before{background:var(--gray-100)}
  main{flex:1;display:flex;flex-direction:column;width:100%;max-width:var(--card-max);margin:0 auto}
  /* 피그마 텍스트 스타일 대응 (careercoach 컬렉션 text/*) */
  .t-h4{font-size:15px;line-height:22px;font-weight:600}
  .t-body-s{font-size:14px;line-height:20px;font-weight:400}
  /* 하단 플로팅 CTA — 온보딩 1단계(.fade + .cta)와 같은 모양: 흰 그라데이션 100px 위에 떠 있고 바닥에서 20 */
  .cta-dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--card-max);
    padding:26px 0 20px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 55%);
    display:flex;justify-content:center;pointer-events:none;z-index:10}
  /* 폭은 저장소 정본을 따른다 — CLAUDE.md 「CTA 규칙」: 플로팅은 calc(100% - 40px) · max 410.
     피그마 프레임이 320 인 것은 360 기준이라 그런 것이고, 웹 폭(카드 450)과 다른 것이 의도된 상태다
     (career-coach docs/기획/피그마-웹-동기화.md 「폭에 관한 확정 사항」). */
  .cta{width:calc(100% - 40px);max-width:410px;height:var(--cta-h);border:0;border-radius:var(--cta-radius);
    background:var(--amber-500);color:#fff;font:inherit;font-size:var(--cta-fs);font-weight:var(--cta-fw);
    line-height:20px;cursor:pointer;box-shadow:0 12px 32px rgba(217,119,6,.28);pointer-events:auto;
    display:flex;align-items:center;justify-content:center;gap:0;-webkit-tap-highlight-color:transparent}
  .cta:not([disabled]):active{transform:scale(.98)}
  .cta .s2{opacity:.85}
  .cta[disabled]{background:var(--gray-100);color:var(--gray-400);box-shadow:none;cursor:default}
  [hidden]{display:none!important}

  /* 제목·설명 — 온보딩 1단계와 같은 값(피그마 275:2404). 진행 바·단계 줄이 없는 자리라 위만 20 */
  .title{padding:20px var(--pad-x) 0}
  .title h1{font-size:24px;line-height:32px;font-weight:700;letter-spacing:-.01em;color:var(--gray-900)}
  .desc{padding:10px var(--pad-x) 0;color:var(--gray-500);word-break:keep-all}

  .scroll{padding:24px var(--pad-x) 0}
  /* 슬라이더 — 온보딩 2단계(피그마 592:2623)의 값을 그대로 옮겼다. 한쪽을 고치면 다른 쪽도 고친다 */
  .sumB{text-align:center}
    .sumB .v{font-size:32px;line-height:36px;font-weight:800;color:var(--gray-900)}
  .track{position:relative;height:6px;border-radius:99px;background:var(--gray-100);margin:34px 0 0;touch-action:none}
  .fill{position:absolute;height:6px;border-radius:99px}
  .fill.grad{background:linear-gradient(90deg,var(--amber-400),var(--amber-600))}
  .fill.solid{background:var(--amber-500)}
  .knob{position:absolute;top:50%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;
    background:#fff;border:2px solid var(--amber-500);touch-action:none;cursor:grab}
  .knob:active{cursor:grabbing;transform:translate(-50%,-50%) scale(1.06)}
  .khit{position:absolute;left:-14px;right:-14px;top:-20px;height:46px}
  .axis{display:flex;justify-content:space-between;margin-top:11px;font-size:11px;line-height:14px;font-weight:500;color:var(--gray-400)}
  /* B5 밴드 — 위아래 선 + 선택 구간 밑줄 */
  .b5{display:flex;margin-top:22px}
  .b5 div{padding:10px 4px;text-align:center;font-size:11px;line-height:14px;font-weight:500;color:var(--gray-400);white-space:nowrap;
    cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
  .b5 div b{display:block;font-size:13px;line-height:18px;font-weight:600;color:var(--gray-600);margin-bottom:2px}
  .b5 div.hit{background:var(--amber-50);color:var(--amber-600)}
  .b5 div.hit b{color:var(--amber-600)}
  .b5 div.hit.first{border-radius:9px 0 0 9px} .b5 div.hit.last{border-radius:0 9px 9px 0}
  /* 아직 아무것도 안 고른 상태 — 값은 '—', 채움·손잡이 숨김, 밴드는 전부 꺼짐.
     STEP 1·3 과 같은 규칙: 고르기 전에는 CTA 가 잠긴다. (피그마 592:2623) */
  .pre .sumB .v{color:var(--gray-400)}
  .pre .fill,.pre .knob{display:none}

  /* ===== 푸터 — 전자상거래법 제10조 신원정보 =====
     이 화면에도 두는 이유: PG·카드사 심사는 사업자 정보가 메인뿐 아니라 이용자가 지나는
     화면들에 상시 노출돼 있는지를 본다(포트원 「서비스 필수 구축요건」). 2026-09-17 사용자 지시.

     랜딩(index.html)·결제(checkout/index.html)의 footer 와 **문구·줄 순서·색·글자 크기·굵기·
     링크가 한 글자도 다르지 않다** — 한 곳을 고치면 나머지도 같이 고친다.
     여백(32/40)과 좌우 24px 는 결제 화면과 같은 값이다. 랜딩만 80/120 을 쓰는 예외다.
     피그마 기준: 이 화면 프레임 안의 「footer (사업자정보)」 (랜딩 6:361 을 복제한 것).
     ⚠️ main 바깥에 둔다 — main 은 좌우 패딩이 있어 안에 넣으면 회색 배경이 꽉 차지 않는다. */
  /* 위 100 은 온보딩 .board 의 아래 여백과 같다. 아래 140 은 떠 있는 CTA(20+54)와 그라데이션(100)에 안 깔리게 — 온보딩 footer 와 같은 값 */
  footer{background:var(--gray-100);margin-top:100px;padding:32px 24px calc(140px + env(safe-area-inset-bottom))}
  footer .biz{display:flex;flex-direction:column;gap:8px;color:var(--gray-500)}
  footer .biz-name{font-size:13px;line-height:18px;font-weight:600}
  footer .biz-lines{font-size:13px;line-height:18px}
  footer .links a{color:var(--gray-500);text-decoration:none;font-size:13px;line-height:18px}
  footer .links a[href$="privacy.html"]{font-weight:600}
  /* 넓은 화면 카드 어포던스 — 랜딩(index.html)의 같은 블록과 값이 같다(2026-09-24 사용자 지시 · 모든 페이지).
     page-audit.mjs 「넓은 화면 바탕」이 빠진 페이지를 막는다. */
  @media (min-width:451px){
    body{background:var(--gray-100)}
    .page{box-shadow:0 0 24px rgba(15,23,42,.06), 0 0 64px rgba(15,23,42,.10)}
  }
</style>
</head>
<body>
<div class="page">
<header class="hd"><a class="back" href="/mypage/" aria-label="뒤로"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15.75 4.5L8.25 12l7.5 7.5" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></header>
<main>
  <div class="title"><h1>몇 년차 공고를<br>받아볼까요?</h1></div>
  <div class="desc t-body-s">‘경력무관’ 공고는 항상 포함돼요</div>
  <div class="scroll pre">
    <div class="sumB"><div class="v">—</div></div>
    <div style="padding:0 3px">
      <div class="track"><div class="fill solid" style="left:0;width:20%"></div>
        <div class="knob" style="left:0%"><span class="khit"></span></div><div class="knob" style="left:20%"><span class="khit"></span></div></div>
      <div class="axis"><span>0</span><span>3</span><span>7</span><span>10</span><span>15년+</span></div>
      <div class="b5">
        <div style="flex:1"><b>신입</b>0년</div><div style="flex:2"><b>주니어</b>1~3년</div>
        <div style="flex:3"><b>미들</b>4~6년</div><div style="flex:5"><b>시니어</b>7년~</div>
      </div>
    </div>
  </div>
</main>
<footer>
  <div class="biz">
    <div class="biz-name">주식회사 오늘의논문</div>
    <!-- 랜딩 index.html·결제 checkout/index.html 의 같은 블록과 줄 순서까지 같게 유지한다. 피그마 6:364 가 기준이다. -->
    <div class="biz-lines">대표 : 이채빈<br>사업자등록번호 : 450-86-03846<br>통신판매업신고 : 2026-서울서대문-0831<br>주소 : 서울특별시 서대문구 이화여대7길 37, 3층 J15호<br>문의 : careercoach.my@gmail.com<br>전화번호 : 070-8018-9238</div>
    <div class="links"><a href="/terms.html">이용약관</a>&nbsp;&nbsp;|&nbsp;&nbsp;<a href="/privacy.html">개인정보처리방침</a></div>
  </div>
</footer>
<div class="cta-dock">
  <button class="cta" type="button" id="save" disabled><span id="lab">연차를 골라주세요</span></button>
</div>
<script type="module">
  /* 고른 연차는 온보딩 2단계와 **같은 값**이다 — 저장·복원·서버 전송은 assets/onboarding-store.js 를 그대로 쓴다.
     슬라이더 동작은 onboarding/2/index.html 의 것을 옮겼다(눈금 0~15 · 밴드 4칸). 한쪽을 고치면 다른 쪽도 고친다. */
  import { readState, writeState, saveOnboarding, retryPending, pullFromServer } from '/assets/onboarding-store.js';
  import { requireLogin, FAIL, yearsText } from '/assets/mypage-data.js';
  retryPending();
  const MAX = 15;
  const $ = (s) => document.querySelector(s);
  const track = $('.track'), fill = $('.fill'), vEl = $('.sumB .v'), scroll = $('.scroll');
  const knobs = [...document.querySelectorAll('.knob')], bands = [...document.querySelectorAll('.b5 div')];
  const save = $('#save'), lab = $('#lab');
  const BANDS = [[0, 0], [1, 3], [4, 6], [7, MAX]];
  let lo = 0, hi = 3, drag = null, chosen = false, 읽기실패 = false;
  const choose = () => { if (!chosen) { chosen = true; scroll.classList.remove('pre'); } };
  const label = yearsText;
  function render() {
    const l = lo / MAX * 100, h = hi / MAX * 100;
    fill.style.left = l + '%'; fill.style.width = (h - l) + '%';
    knobs[0].style.left = l + '%'; knobs[1].style.left = h + '%';
    bands.forEach((d) => d.classList.remove('hit', 'first', 'last'));
    save.disabled = 읽기실패 || !chosen;
    if (읽기실패) lab.textContent = FAIL.line;
    else if (!chosen) lab.textContent = '연차를 골라주세요';
    else lab.innerHTML = '저장 <span class="s2">· ' + label(lo, hi) + '</span>';
    if (!chosen) { vEl.textContent = '—'; return; }
    vEl.textContent = label(lo, hi);
    bands.forEach((d, i) => { const [a, b] = BANDS[i]; d.classList.toggle('hit', !(b < lo || a > hi)); });
    const on = bands.map((d, i) => d.classList.contains('hit') ? i : -1).filter((i) => i >= 0);
    if (on.length) { bands[on[0]].classList.add('first'); bands[on[on.length - 1]].classList.add('last'); }
  }
  const valAt = (x) => { const r = track.getBoundingClientRect(); return Math.round(Math.min(1, Math.max(0, (x - r.left) / r.width)) * MAX); };
  const xOf = (e) => e.touches ? e.touches[0].clientX : e.clientX;
  function move(e) {
    if (drag === null) return;
    const v = valAt(xOf(e));
    if (lo === hi) { if (v > hi) drag = 1; else if (v < lo) drag = 0; }   // 겹쳐 있으면 미는 방향의 손잡이를 잡는다
    if (drag === 0) lo = Math.min(v, hi); else hi = Math.max(v, lo);
    render();
  }
  function grab(e) {     // 손잡이든 트랙이든 — 가까운 손잡이가 그 위치로 온다
    const k = e.target.closest('.knob');
    if (k) drag = knobs.indexOf(k);
    else { const v = valAt(xOf(e)); drag = Math.abs(v - lo) <= Math.abs(v - hi) ? 0 : 1; }
    if (e.cancelable) e.preventDefault();
    choose(); move(e);
  }
  track.addEventListener('mousedown', grab);
  track.addEventListener('touchstart', grab, { passive: false });
  bands.forEach((d, i) => d.addEventListener('click', () => { [lo, hi] = BANDS[i]; choose(); render(); }));
  addEventListener('mousemove', move);
  addEventListener('touchmove', move, { passive: false });
  addEventListener('mouseup', () => { drag = null; });
  addEventListener('touchend', () => { drag = null; });
  save.addEventListener('click', () => {
    writeState({ years: lo, yearsMax: hi });
    /* 'error'·'incomplete' 처리는 직군 화면(mypage/jobs)과 같다 — 마이페이지로 돌아간다 */
    saveOnboarding().then((r) => { if (r.status !== 'no-session') location.href = '/mypage/'; });
  });
  function hydrate() {
    const s = readState();
    if (s.years !== null && s.years !== undefined) {
      lo = Math.max(0, Math.min(MAX, s.years)); hi = Math.max(lo, Math.min(MAX, s.yearsMax ?? s.years)); choose();
    }
    render();
  }
  render();
  /* 서버 값을 먼저 받는다 — 못 읽었으면 저장을 막는다(직군 화면과 같은 이유: 빈 값으로 덮지 않게) */
  requireLogin().then((ok) => { if (ok) return pullFromServer().then(hydrate); })
    .catch(() => { 읽기실패 = true; hydrate(); });
</script>
</div>
</body>
</html>
