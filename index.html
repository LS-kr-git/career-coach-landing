     URL 기준으로 캐싱한 옛 썸네일을 계속 쓴다 (2026-08-02 실제 발생). 이미지를 바꿀 때마다 파일명을 바꿀 것. -->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    color-scheme: only light;   /* meta 와 같은 값 — CSS 로도 선언해 확실히 적용한다 */
    /* careercoach tokens */
    --amber-100:#FEF3C7; --amber-200:#FDE68A; --amber-500:#F59E0B; --amber-600:#D97706; --amber-700:#B45309;
    --navy-500:#3B82F6; --navy-900:#1E3A8A;
    --blue-100:#DBEAFE; --blue-50:#EFF6FF; --blue-600:#2563EB; --amber-50:#FFFBEB;
    --gray-50:#F8FAFC; --gray-100:#F1F5F9; --gray-200:#E2E8F0; --gray-300:#CBD5E1; --gray-400:#94A3B8;
    --gray-500:#64748B; --gray-600:#475569; --gray-700:#334155; --gray-800:#1E293B; --gray-900:#0F172A;
    --kakao:#FEE500; --kakao-text:#191919;
    --shell:#17181C; --shell-edge:#4A4E58; --shell-notch:#17181C;

    /* ===== 반응형 폭 — 브레이크포인트 없이 연속으로 자란다 (2026-08-02) =====
       이전에는 520px 에서 카드가 한 번에 400→540 으로 튀었다(콘텐츠 +96px). 지금은 튀는 지점이 없다.

       --pad-x  좌우 여백 24 고정 — 피그마 6:168 값 그대로다. 화면 폭과 무관하게 같은 값이라
                모바일·데스크톱이 같은 여백을 쓴다. (2026-08-02 사용자 확정: 36 → 24 로 되돌림)
       --card-max     카드 최대 폭 450 (2026-08-02 사용자 확정. 540 → 450)
       --content-max  글이 퍼지는 최대 폭 402 (= 450 − 24·2)
       실제 콘텐츠 폭 = min(화면폭 − 48, 402) 이라 처음부터 끝까지 연속이다. */
    --pad-x: 24px;
    --card-max: 450px;
    --content-max: 402px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  /* 오버스크롤(러버밴드) 색 — 아래는 캔버스색, 위는 물리 bleed 로 처리 (2026-08-02).
     ① html 배경색 = gray-100: 문서 아래로 당길 때 모든 엔진이 캔버스색을 칠하므로
        푸터색이 그대로 이어진다. (이전의 fixed 그라디언트는 iOS 가 attachment:fixed 를
        지원하지 않아 문서 높이로 늘어난 뒤 바닥에서 타일 반복 → 흰색이 비쳤음.
        fixed 레이어 방식도 iOS 러버밴드가 fixed 를 화면에 고정해 무효였음)
     ② 위쪽 흰색: 문서 위로 100vh 흰 판을 덧댄다. CSS 오버플로는 위쪽으로는
        스크롤 영역을 늘리지 않으므로 부작용이 없다. */
  html{scroll-behavior:smooth;background:var(--gray-100)}
  body{position:relative}
  body::before{content:'';position:absolute;left:0;right:0;bottom:100%;height:100vh;background:#fff}
  body{
    font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;
    /* body 도 gray-100: 일부 웹킷은 오버스크롤 영역을 html 이 아니라 body 배경으로 칠한다.
       화면에서 보이는 흰 바탕은 .page(width:100%, 흰색)가 전부 덮으므로 시각 변화 없음. */
    background:var(--gray-100); color:var(--gray-800);
    -webkit-font-smoothing:antialiased;
  }
  /* 페이지는 기기 폭을 꽉 채우고(좌우 여백 0), 넓어지면 --card-max(450px)에서 멈춘다.
     이렇게 해야 푸터 회색 띠도 화면 끝까지 이어진다. */
  /* overflow-x:clip — 칩 줄이 100vw로 삐져나올 때 가로 스크롤이 생기지 않도록 */
  /* padding-top:100vh + margin-top:-100vh — 흰 카드 배경을 문서 위로 100vh 덧댄다(위쪽 오버스크롤 흰색).
     absolute/fixed 덧댐은 iOS 크롬이 문서 위 영역에서 안 그려줘서, 요소 자신의 배경을 늘리는 이 방식만 확실하다. */
  /* min-height 는 svh 로 통일한다(CLAUDE.md 규칙). 다만 이 요소에서는 실제로는 무해한 잉여값이다 —
     box-sizing:border-box 라 위의 padding-top:100vh 만으로 이미 border-box 높이가 100vh 를 넘기 때문에
     min-height 가 걸릴 일이 없다(실측 확인). 나중에 오버스크롤 트릭을 걷어내면 그때 제 역할을 한다.
     아래 padding-top/margin-top 짝은 '문서 밖으로 덧대는 흰 판'이라 크게 잡을수록 안전하므로 vh 를 유지한다. */
  .page{width:100%;margin:0 auto;background:#fff;min-height:100vh;min-height:100svh;position:relative;overflow-x:clip;
    padding-top:100vh;margin-top:-100vh;
    /* 카드 폭은 화면과 함께 자라다 --card-max 에서 멈춘다. 브레이크포인트 없음 = 튀는 지점 없음 */
    max-width:var(--card-max)}
  header{max-width:var(--card-max);margin-left:auto;margin-right:auto;width:100%}
  footer .biz{max-width:var(--content-max);margin:0 auto}

  /* ===== 텍스트 스타일 (피그마 text/* 대응) ===== */
  .t-display-l{font-size:36px;line-height:44px;font-weight:800;letter-spacing:-0.01em}
  .t-display{font-size:28px;line-height:36px;font-weight:800;letter-spacing:-0.01em}
  .t-h2{font-size:20px;line-height:28px;font-weight:700;letter-spacing:-0.01em}
  .t-h3{font-size:17px;line-height:24px;font-weight:600}
  .t-body-l{font-size:16px;line-height:23px;font-weight:400}
  .t-body{font-size:15px;line-height:23px;font-weight:400}
  .t-body-strong{font-size:15px;line-height:23px;font-weight:600}
  .t-body-s{font-size:14px;line-height:20px;font-weight:400}
  .t-caption{font-size:13px;line-height:18px;font-weight:400}
  .t-caption-strong{font-size:13px;line-height:18px;font-weight:600}
  .t-label{font-size:14px;line-height:20px;font-weight:700;letter-spacing:0.01em}
  .t-micro{font-size:11px;line-height:14px;font-weight:500}
  .t-button{font-size:15px;line-height:20px;font-weight:600}

  /* ===== 헤더 ===== */
  header{display:flex;align-items:center;gap:10px;padding:24px var(--pad-x)}
  header .brand{display:flex;align-items:center;gap:10px}
  header .login{margin-left:auto;background:none;border:0;font-family:inherit;cursor:pointer;
    font-size:15px;line-height:22px;font-weight:600;color:var(--gray-700);
    padding:6px 0;margin-top:-6px;margin-bottom:-6px}
  .app-icon{width:29px;height:29px;border-radius:25%;background:linear-gradient(135deg,#F59E0B,#D97706);display:flex;align-items:center;justify-content:center}
  .app-icon img{width:21px;height:21px;display:block}
  header .wordmark{height:21px;display:block}

  /* ===== 푸터 ===== */
  footer{background:var(--gray-100);padding:80px var(--pad-x) 120px}
  footer .biz{display:flex;flex-direction:column;gap:8px;color:var(--gray-500)}
  footer .links a{color:var(--gray-500);text-decoration:none}
  /* 개인정보처리방침 링크 — 피그마 6:365 는 이 구간만 SemiBold (크기는 13 유지, 2026-08-01 롤백) */
  footer .links a[href$="privacy.html"]{font-weight:600}

  /* ===== 넓은 화면 카드 어포던스 =====
     폭은 위에서 이미 연속으로 처리했다. 여기 남은 것은 "회색 바탕 위의 카드"라는 시각적 표현뿐이다.
     회색 바탕 자체는 html/body 기본값(--gray-100)이라 카드가 화면보다 좁아지는 순간 자동으로 드러난다.
     ⚠️ 임계값을 --card-max 와 따로 박아 두면 어긋난다. 실제로 카드 상한을 400 → 450 으로 올렸을 때
        이 블록과 오버스크롤 스크립트가 520/519 에 묶여 있어 451~519 구간에서 양옆이 흰색으로 보였다.
        (2026-08-02) 그림자만 남기고, 임계값은 카드 상한(450) 바로 위로 둔다. */
  @media (min-width:451px){
    body{background:var(--gray-100)}
    .page{box-shadow:0 0 24px rgba(15,23,42,.06), 0 0 64px rgba(15,23,42,.10)}
  }

  @media (prefers-reduced-motion: no-preference){
    section{opacity:0;transform:translateY(12px);transition:opacity .5s ease,transform .5s ease}
    section.in{opacity:1;transform:none}
  }
  :focus-visible{outline:2px solid var(--amber-500);outline-offset:2px}

  /* ===== 상품 목록 (피그마 2143:3144 · 토스페이먼츠 심사 기간 임시 첫 화면, 2026-09-24) =====
     랜딩은 심사 기간 동안 /briefing/ 에 있다. 심사가 끝나면 이 파일을 지우고 랜딩을 루트로 되돌린다. */
  .page{display:flex;flex-direction:column}
  .page footer{margin-top:auto}
  .shop{padding:8px var(--pad-x) 56px;display:flex;flex-direction:column;gap:16px;width:100%;
    max-width:calc(var(--content-max) + var(--pad-x) * 2);margin:0 auto}
  .shop-hd{display:flex;align-items:baseline;gap:6px}
  .shop-hd h1{color:var(--gray-900)}
  .shop-hd .count{color:var(--gray-500)}
  .p-card{display:flex;flex-direction:column;gap:12px;text-decoration:none;color:inherit}
  .p-thumb{width:100%;height:auto;aspect-ratio:1200/630;object-fit:cover;border-radius:14px;display:block;background:var(--gray-100)}
  .p-meta{display:flex;flex-direction:column;gap:4px}
  .p-tag{color:var(--amber-600)}
  .p-name{color:var(--gray-900)}
  .p-price{display:flex;align-items:baseline;gap:6px;margin-top:2px}
  .p-price .won{color:var(--gray-900)}
  .p-price .per{color:var(--gray-500)}
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="brand">
      <div class="app-icon"><img src="assets/mark-white.svg" alt=""></div>
      <img class="wordmark" src="assets/wordmark.svg" alt="커리어코치">
    </div>
    <button type="button" class="login" id="loginBtn">로그인/회원가입</button>
  </header>

  <main class="shop">
    <div class="shop-hd"><h1 class="t-h2">전체 상품</h1><span class="t-body-s count">1개</span></div>
    <a class="p-card" href="/briefing/">
      <img class="p-thumb" src="assets/og-logo-20260802.png" alt="커리어코치 직군 브리핑 썸네일" width="1200" height="630">
      <div class="p-meta">
        <div class="t-caption-strong p-tag">평일 아침 8시 · 카카오 알림톡</div>
        <div class="t-body-strong p-name">커리어코치 직군 브리핑 월 구독</div>
        <div class="p-price"><span class="t-h2 won">3,900원</span><span class="t-caption per">/ 월</span></div>
      </div>
    </a>
  </main>

  <footer>
    <div class="biz">
      <div class="t-caption-strong">주식회사 오늘의논문</div>
      <!-- 전자상거래법 제10조 신원정보. 피그마 6:364 와 동일하게 유지할 것.
           줄 순서도 피그마와 같게 유지한다. -->
      <div class="t-caption">대표 : 이채빈<br>사업자등록번호 : 450-86-03846<br>통신판매업신고 : 2026-서울서대문-0831<br>주소 : 서울특별시 서대문구 이화여대7길 37, 3층 J15호<br>문의 : careercoach.my@gmail.com<br>전화번호 : 070-8018-9238</div>
      <div class="t-caption links"><a href="/terms.html">이용약관</a>&nbsp;&nbsp;|&nbsp;&nbsp;<a href="/privacy.html">개인정보처리방침</a></div>
    </div>
  </footer>

  <script>
    document.getElementById('loginBtn').addEventListener('click', () => { location.href = '/login/'; });
  </script>
</div>

<script type="module">
  // 유입 경로만 저장한다. 광고·공유 링크는 이 첫 화면(/)으로 들어오므로 UTM 은 여기서 잡아야 한다.
  // 방문(visit) 이벤트는 랜딩(/briefing/)에서만 센다 — 여기서도 세면 목록→랜딩 한 번에 두 건이 된다.
  import { captureAttribution } from '/assets/track.js';
  captureAttribution();
</script>
</body>
