<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="format-detection" content="telephone=no"><title>연차 선택 — 커리어코치</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    color-scheme: only light;   /* meta 와 같은 값 — CSS 로도 선언해 확실히 적용한다 */
    --amber-50:#FFFBEB;--amber-100:#FEF3C7;--amber-200:#FDE68A;--amber-500:#F59E0B;--amber-600:#D97706;--amber-700:#B45309;
    --gray-50:#F8FAFC;--gray-100:#F1F5F9;--gray-200:#E2E8F0;--gray-300:#CBD5E1;--gray-400:#94A3B8;
    --gray-500:#64748B;--gray-600:#475569;--gray-700:#334155;--gray-800:#1E293B;--gray-900:#0F172A;
    /* CTA 규칙(2026-08-03) — 제품 공통. 값·근거는 CLAUDE.md "CTA 규칙" */
    --cta-h:54px; --cta-radius:14px; --cta-fs:15px; --cta-fw:700;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:#fff}
  body{font-family:'Pretendard Variable',Pretendard,'Pretendard','Noto Sans CJK KR',-apple-system,sans-serif;
    background:#fff;color:var(--gray-800);-webkit-font-smoothing:antialiased}
  /* 화면 채우기용 높이는 svh 로 고정한다. 100vh 는 '주소창이 숨겨진 큰 화면' 기준이라
     내용이 짧아도 주소창 높이만큼 스크롤이 생기고, dvh 는 주소창이 접히면 값이 같이 변한다.
     svh 는 항상 '주소창이 보이는 가장 작은 높이'라 어떤 상태에서도 넘치지 않는다. */
  .board{width:100%;max-width:450px;margin:0 auto;min-height:100vh;min-height:100svh;background:#fff;
    padding-bottom:calc(100px + env(safe-area-inset-bottom))}
  @media (min-width:451px){ body{background:var(--gray-100)}
    .board{box-shadow:0 0 24px rgba(15,23,42,.06),0 0 64px rgba(15,23,42,.10)} }

  /* 상단바 — 높이 48 · 구분선 없음 · 글씨 없음 · 스크롤해도 위에 붙어 있다. */
  .hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;
    height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;
    background:#fff}
  /* 탭 영역(48×48)과 눌림 표시(40×40)를 분리한다 — 손가락 기준은 48, 눈에 보이는 건 40.
     둘이 같으면 회색 박스가 헤더 위아래에 딱 붙어 잘린 것처럼 보인다. */
  .back{width:48px;height:48px;display:flex;align-items:center;justify-content:center;
    border:0;background:none;padding:0;cursor:pointer;text-decoration:none;position:relative;
    -webkit-tap-highlight-color:transparent}
  .back svg{position:relative;z-index:1}
  .back::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:40px;height:40px;border-radius:12px;background:transparent;transition:background .12s}
  .back:active::before{background:var(--gray-100)}
  /* 진행 바 — 3칸 전체가 하나의 그라디언트로 이어지도록 background-size/position 으로 잘라 쓴다 */
  .prog{display:flex;gap:5px;padding:22px 24px 0}
  .prog i{height:3px;border-radius:99px;background-color:var(--gray-100);flex:1}
  .prog i.on{background-image:linear-gradient(90deg,#FBBF24 0%,#D97706 100%);background-size:300% 100%;background-repeat:no-repeat}
  .prog i:nth-child(1).on{background-position:0% 0}
  .prog i:nth-child(2).on{background-position:50% 0}
  .prog i:nth-child(3).on{background-position:100% 0}

  .kick{padding:20px 24px 0;font-size:13px;line-height:18px;font-weight:600;color:var(--amber-600);
    display:flex;align-items:center;gap:6px}
  .kick .off{color:var(--gray-300);font-weight:600}
  .kick i{font-style:normal;font-weight:600}
  .title{padding:9px 24px 0;font-size:24px;line-height:32px;font-weight:700;color:var(--gray-900);letter-spacing:-0.01em}
  .desc{padding:10px 24px 0;font-size:14px;line-height:20px;color:var(--gray-500)}
  .scroll{padding:24px 24px 0}

  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .c,.call{border:1px solid var(--gray-200);background:#fff;color:var(--gray-600);border-radius:10px;
    padding:8px 11px;font-size:13px;line-height:18px;font-weight:400;
    cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;
    transition:background .12s,border-color .12s,color .12s}
  .c:active,.call:active{transform:scale(.97)}
  .c.on{background:var(--amber-50);border-color:var(--amber-500);color:var(--amber-600)}
  .call{display:inline-flex;align-items:center;gap:5px}
  .call.on{background:var(--amber-500);border-color:var(--amber-500);color:#fff}
  .call svg{display:none} .call.on svg{display:block}

  /* 구분선은 inset 그림자 — 피그마의 INSIDE 스트로크처럼 높이를 안 늘린다 (행 52px 유지) */
  .acc{box-shadow:inset 0 1px 0 var(--gray-100)}
  .acc:last-of-type{box-shadow:inset 0 1px 0 var(--gray-100),inset 0 -1px 0 var(--gray-100)}
  .arow{display:flex;align-items:center;padding:15px 0;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
  .arow .nm{font-size:15px;line-height:22px;font-weight:600;color:var(--gray-800)}
  .arow .cnt{margin-left:7px;font-size:12px;color:var(--gray-400);font-weight:500}
  .arow .sel{margin-left:auto;font-size:12px;font-weight:700;color:var(--amber-600)}
  .arow .cv{margin-left:9px;color:var(--gray-300);font-size:11px;line-height:14px;font-weight:500}
  .abody{padding:2px 0 16px}

  .grp{margin-bottom:24px}
  .ghead{display:flex;align-items:center;margin-bottom:10px}
  .ghead h3{font-size:13px;line-height:18px;font-weight:600;color:var(--gray-500)}

  /* 슬라이더 — 그림자 없음 */
  .sumB{text-align:center}
    .sumB .v{font-size:32px;line-height:36px;font-weight:800;color:var(--gray-900)}
  .track{position:relative;height:6px;border-radius:99px;background:var(--gray-100);margin:34px 0 0;touch-action:none}
  .fill{position:absolute;height:6px;border-radius:99px}
  .fill.grad{background:linear-gradient(90deg,#FBBF24,#D97706)}
  .fill.solid{background:var(--amber-500)}
  .knob{position:absolute;top:50%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;
    background:#fff;border:2px solid var(--amber-500);touch-action:none;cursor:grab}
  .knob:active{cursor:grabbing;transform:translate(-50%,-50%) scale(1.06)}
  .khit{position:absolute;left:-14px;right:-14px;top:-20px;height:46px}
  .axis{display:flex;justify-content:space-between;margin-top:11px;font-size:11px;line-height:14px;font-weight:500;color:var(--gray-400)}
  /* B5 밴드 — 위아래 선 + 선택 구간 밑줄 */
  .b5{display:flex;margin-top:22px}
  .b5 div{padding:10px 4px;text-align:center;font-size:11px;line-height:14px;font-weight:500;color:var(--gray-400);white-space:nowrap}
  .b5 div b{display:block;font-size:13px;line-height:18px;font-weight:600;color:var(--gray-600);margin-bottom:2px}
  .b5 div.hit{background:var(--amber-50);color:var(--amber-600)}
  .b5 div.hit b{color:var(--amber-600)}
  .b5 div.hit.first{border-radius:9px 0 0 9px} .b5 div.hit.last{border-radius:0 9px 9px 0}
  .note{margin-top:14px;font-size:11.5px;line-height:18px;color:var(--gray-400)}

  /* 플로팅 CTA — 크기·위치는 랜딩(index.html .floating-cta)과 동일:
     width calc(100% - 40px) / max 410 / height 60 / bottom 20 / radius 14 / 가운데 정렬.
     색·그림자색·글자 스타일만 온보딩 값이다. */
  .fade{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:450px;height:100px;
    background:linear-gradient(180deg,rgba(255,255,255,0),#fff 55%);pointer-events:none;z-index:9}
  .cta{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    width:calc(100% - 40px);max-width:410px;height:var(--cta-h);
    display:block;text-align:center;line-height:var(--cta-h);
    background:var(--amber-500);color:#fff;border-radius:var(--cta-radius);
    font-size:var(--cta-fs);font-weight:var(--cta-fw);
    box-shadow:0 12px 32px rgba(217,119,6,.28);cursor:pointer;z-index:10;
    -webkit-tap-highlight-color:transparent}
  .cta:active{transform:translateX(-50%) scale(.98)}
  .cta .s2{opacity:.85}
  .cta.off{background:var(--gray-100);color:var(--gray-400);box-shadow:none}
</style></head><body>
<div class="board"><div class="hd"><a class="back" href="/onboarding/1/" aria-label="뒤로"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15.75 4.5L8.25 12l7.5 7.5" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div>
  <div class="prog"><i class="on"></i><i class="on"></i><i></i></div>
  <div class="kick"><span>직군</span><i>·</i><span>연차</span><i class="off">·</i><span class="off">근무지</span></div>
  <div class="title">몇 년차 공고를<br>받아볼까요?</div>
  <div class="desc">‘경력무관’ 공고는 항상 포함돼요</div>
  <div class="scroll">
    <div class="sumB"><div class="v">0 ~ 3년</div></div>
    <div style="padding:0 3px">
      <div class="track"><div class="fill solid" style="left:0;width:20%"></div>
        <div class="knob" style="left:0%"><span class="khit"></span></div><div class="knob" style="left:20%"><span class="khit"></span></div></div>
      <div class="axis"><span>0</span><span>3</span><span>7</span><span>10</span><span>15년+</span></div>
      <div class="b5">
        <div class="hit" style="flex:1"><b>신입</b>0년</div><div class="hit" style="flex:2"><b>주니어</b>1~3년</div>
        <div style="flex:3"><b>미들</b>4~6년</div><div style="flex:5"><b>시니어</b>7년~</div>
      </div>
    </div>
  </div>
</div>
<div class="fade"></div>
<div class="cta">다음 <span class="s2">· 0 ~ 3년</span></div>

<script>
(function(){
  const MAX=15;                     // 0 ~ 15년+ 눈금
  const track=document.querySelector('.track'), fill=document.querySelector('.fill');
  const knobs=[...document.querySelectorAll('.knob')];
  const vEl=document.querySelector('.sumB .v'), ctaSub=document.querySelector('.cta .s2');
  const bands=[...document.querySelectorAll('.b5 div')];
  const BANDS=[[0,0],[1,3],[4,6],[7,MAX]];
  let lo=0, hi=3, drag=null;

  const label=(a,b)=>{
    const hiTxt = b>=MAX ? MAX+'년+' : b+'년';
    return a===b ? (a>=MAX? MAX+'년+' : a+'년') : a+' ~ '+hiTxt;
  };
  const render=()=>{
    const l=lo/MAX*100, h=hi/MAX*100;
    fill.style.left=l+'%'; fill.style.width=(h-l)+'%';
    knobs[0].style.left=l+'%'; knobs[1].style.left=h+'%';
    vEl.textContent=label(lo,hi);
    if(ctaSub) ctaSub.textContent='· '+label(lo,hi);
    bands.forEach((d,i)=>{const [a,b]=BANDS[i]; d.classList.toggle('hit', !(b<lo || a>hi));});
    const on=bands.map((d,i)=>d.classList.contains('hit')?i:-1).filter(i=>i>=0);
    bands.forEach(d=>d.classList.remove('first','last'));
    if(on.length){bands[on[0]].classList.add('first');bands[on[on.length-1]].classList.add('last');}
  };
  const valAt=(clientX)=>{
    const r=track.getBoundingClientRect();
    const ratio=Math.min(1,Math.max(0,(clientX-r.left)/r.width));
    return Math.round(ratio*MAX);
  };
  const start=(i)=>(e)=>{drag=i; e.preventDefault(); move(e);};
  const move=(e)=>{
    if(drag===null) return;
    const x=(e.touches? e.touches[0].clientX : e.clientX);
    const v=valAt(x);
    if(lo===hi){ if(v>hi) drag=1; else if(v<lo) drag=0; }   // 겹쳐 있으면 미는 방향의 손잡이를 잡는다
    if(drag===0) lo=Math.min(v,hi); else hi=Math.max(v,lo);
    render();
  };
  const end=()=>{drag=null;};
  knobs.forEach((k,i)=>{
    k.addEventListener('mousedown',start(i));
    k.addEventListener('touchstart',start(i),{passive:false});
  });
  // 트랙을 누르면 가까운 손잡이가 그 위치로
  track.addEventListener('mousedown',(e)=>{
    if(e.target.closest('.knob')) return;
    const v=valAt(e.clientX);
    if(Math.abs(v-lo)<=Math.abs(v-hi)){lo=Math.min(v,hi);drag=0;} else {hi=Math.max(v,lo);drag=1;}
    render();
  });
  track.addEventListener('touchstart',(e)=>{
    if(e.target.closest('.knob')) return;
    const v=valAt(e.touches[0].clientX);
    if(Math.abs(v-lo)<=Math.abs(v-hi)){lo=Math.min(v,hi);drag=0;} else {hi=Math.max(v,lo);drag=1;}
    render();
  },{passive:true});
  window.addEventListener('mousemove',move);
  window.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('mouseup',end);
  window.addEventListener('touchend',end);
  render();
})();

document.querySelector('.cta').addEventListener('click',()=>{
  const c=document.querySelector('.cta');
  if(!c.classList.contains('off')) location.href='/onboarding/3/';
});

</script></body></html>
