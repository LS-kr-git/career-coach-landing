<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- ★ 리퍼러 차단은 <head> 맨 앞이어야 한다 — 주소에 열람 토큰이 실린다(insight/index.html 과 같은 이유). -->
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<meta name="format-detection" content="telephone=no, email=no">
<meta name="robots" content="noindex,nofollow">
<title>내 조건의 새 공고 — 커리어코치</title>
<link rel="icon" type="image/svg+xml" href="/assets/logo-circle.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 목요일 알림톡 「전체 공고 확인」 버튼이 여는 화면 (2026-09-25 사용자 컨펌 — 캔버스 C-1 · N2 · S2 · Y5).
     피그마: 섹션 「전체 공고 보기 (/jobs/)」 · 프레임 2167:1008(열림) · 2167:1176(구독필요).
     토큰·폭·타이포는 insight/index.html 과 같다. 새로 만든 값은 없다. */
  :root{
    color-scheme: only light;
    --amber-50:#FFFBEB; --amber-100:#FEF3C7; --amber-200:#FDE68A; --amber-500:#F59E0B; --amber-600:#D97706; --amber-700:#B45309;
    --navy-900:#1E3A8A;
    --gray-50:#F8FAFC; --gray-100:#F1F5F9; --gray-200:#E2E8F0; --gray-300:#CBD5E1; --gray-400:#94A3B8;
    --gray-500:#64748B; --gray-600:#475569; --gray-700:#334155; --gray-800:#1E293B;
    --pad-x: 24px;
    --card-max: 450px;
    --cta-h:54px; --cta-radius:14px; --cta-fs:15px; --cta-fw:700; --cta-max:410px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--gray-100)}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;
    background:#fff;color:var(--gray-800);line-height:1.6;-webkit-font-smoothing:antialiased}
  .page{width:100%;max-width:var(--card-max);margin:0 auto;background:#fff;min-height:100vh;min-height:100svh;padding-bottom:56px}
  header{padding:24px var(--pad-x)}
  .home{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:inherit;border-radius:10px}
  .app-icon{width:29px;height:29px;border-radius:25%;background:linear-gradient(135deg,#F59E0B,#D97706);display:flex;align-items:center;justify-content:center}
  .app-icon img{width:21px;height:21px;display:block}
  .home .wordmark{height:21px;display:block}
  .head{padding:8px var(--pad-x) 0}
  .t-display{font-size:28px;line-height:36px;font-weight:800;letter-spacing:-0.01em;color:var(--navy-900)}
  /* 요약 — 직군 머리글 · 날짜(숫자 줄 위 오른쪽) · 테두리 없는 숫자 줄 (2026-09-25 사용자 컨펌: 6 + 9 · ㉢) */
  .eyebrow{padding:8px var(--pad-x) 0;font-size:12px;line-height:16px;font-weight:600;color:var(--amber-700)}
  .eyebrow+.head{padding-top:4px}
  .when{padding:16px var(--pad-x) 0;text-align:right;font-size:12px;line-height:16px;color:var(--gray-400)}
  /* 숫자 칸 위 2px 막대 — 오른 칸만 주황, 나머지는 회색 (2026-09-25 사용자 컨펌: N11) */
  .nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:6px var(--pad-x) 0}
  .nums>div{border-top:2px solid var(--gray-300);padding-top:10px}
  .nums>div.up{border-top-color:var(--amber-500)}
  .nums .l{font-size:12px;line-height:16px;font-weight:600;color:var(--gray-500)}
  .nums .v{font-size:22px;line-height:28px;font-weight:800;margin-top:3px}
  .nums .d{font-size:12px;line-height:16px;font-weight:700;margin-top:2px;color:var(--gray-600)}
  .nums .d.flat{color:var(--gray-500)}   /* 변화 글자에는 색을 쓰지 않는다 — 빨강·주황 없이 회색 (2026-09-25 사용자 지시) */
  /* 요약과 목록 사이 회색 띠 (V2) */
  .band{height:8px;background:var(--gray-100);margin-top:24px}
  /* 내리면 검색·정렬이 화면 위에 붙는다 (2026-09-25 사용자 지시) */
  .stick{position:sticky;top:0;z-index:5;background:#fff;padding:16px 0 10px}
  .search{margin:0 var(--pad-x);display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;   /* B2 모양 · 높이 36 (2026-09-25 사용자 컨펌) */
    border:1px solid var(--gray-200);border-radius:12px;background:var(--gray-50)}
  .search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:13px;color:var(--gray-800);outline:none}
  .search input::placeholder{color:var(--gray-400)}
  .sb{display:flex;align-items:center;gap:10px;padding:12px var(--pad-x) 0}
  /* 정렬 — 글자 두 개, 고른 쪽만 진하게 (2026-09-25 사용자 컨펌: C2). 가운데 점은 글자가 아니라 CSS 라 문구 대조에 안 걸린다 */
  .seg{margin-left:auto;display:flex;align-items:center}
  .seg button{height:30px;padding:0;border:0;background:transparent;font:inherit;font-size:13px;font-weight:500;color:var(--gray-400);cursor:pointer}
  .seg button+button::before{content:'|';margin:0 8px;color:var(--gray-300);font-weight:400}
  .seg button[aria-pressed="true"]{color:var(--gray-800);font-weight:700}
  .list{padding:2px var(--pad-x) 0}
  .row{display:flex;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--gray-200);text-decoration:none;color:inherit}
  .row:first-child{border-top:0}
  .row:last-child{border-bottom:1px solid var(--gray-200)}
  .grow{flex:1;min-width:0}
  .co-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .co{font-size:14px;line-height:20px;font-weight:700;color:var(--gray-800)}
  .meta{font-size:11px;line-height:16px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--gray-100);color:var(--gray-600)}
  .ttl{font-size:14px;line-height:20px;font-weight:400;color:var(--gray-600);margin-top:4px}
  /* 마감 — 칸 없이 글자로. 7일 안은 주황 굵게 (H3) */
  .dday{flex:0 0 auto;font-size:12px;line-height:16px;font-weight:500;color:var(--gray-400)}
  .dday.hot{font-weight:700;color:var(--amber-700)}
  .empty{padding:40px 0;text-align:center;font-size:14px;color:var(--gray-500);border-bottom:1px solid var(--gray-200)}
  .empty.sm{font-size:13px;line-height:20px}
  .ask{display:block}
  .pg{padding:18px var(--pad-x) 0}
  .pg nav{display:flex;align-items:center}
  .pg .mid{flex:1;display:flex;justify-content:center}
  .pg button{min-width:32px;height:40px;border:0;border-radius:10px;background:transparent;font:inherit;font-size:14px;font-weight:600;color:var(--gray-600);cursor:pointer}
  .pg button[aria-current="page"]{background:var(--navy-900);color:#fff;font-weight:700}
  .pg button:disabled{color:var(--gray-300);cursor:default}
  .pos{text-align:center;font-size:12px;line-height:16px;color:var(--gray-400);margin-top:8px}
  /* 안내 — 화면 세로 가운데, 13px (360 폭에서 문의 줄이 한 줄) */
  .center{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
  .center>*{pointer-events:auto}
  .notice{padding:0 var(--pad-x);max-width:var(--card-max);text-align:center;color:var(--gray-500);font-size:13px;line-height:20px;word-break:keep-all}
  /* 불러오는 중 — 어드민 「화면을 여는 동안」 고리와 같은 모양·크기·색 (ops/index.html .ld-art) */
  .ld-art{width:40px;height:40px;animation:ld-spin 1.6s linear infinite}
  .ld-art circle{fill:none;stroke:var(--amber-500);stroke-width:9;stroke-linecap:round;animation:ld-dash 1.4s ease-in-out infinite}
  @keyframes ld-spin{to{transform:rotate(360deg)}}
  @keyframes ld-dash{0%{stroke-dasharray:1 200;stroke-dashoffset:0}50%{stroke-dasharray:120 200;stroke-dashoffset:-30}100%{stroke-dasharray:120 200;stroke-dashoffset:-160}}
  @media (prefers-reduced-motion:reduce){.ld-art,.ld-art circle{animation:none}.ld-art circle{stroke-dasharray:70 200;opacity:.6}}
  .sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  /* 구독이 끝난 사람 — 상자 없이 가운데, 버튼은 하단 플로팅 (B1) */
  .lock{padding:0 var(--pad-x);max-width:var(--card-max);text-align:center}
  .lock .a{font-size:17px;line-height:24px;font-weight:600;color:var(--gray-700)}
  .lock .b{font-size:14px;line-height:21px;color:var(--gray-500);margin-top:8px;word-break:keep-all}
  .float{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:12px 20px calc(20px + env(safe-area-inset-bottom));
    background:linear-gradient(rgba(255,255,255,0),#fff 35%)}
  .cta{display:flex;align-items:center;justify-content:center;width:100%;max-width:var(--cta-max);height:var(--cta-h);margin:0;
    border-radius:var(--cta-radius);background:var(--amber-500);color:#fff;font-size:var(--cta-fs);font-weight:var(--cta-fw);
    text-decoration:none;box-shadow:0 6px 18px rgba(245,158,11,.25)}
  [hidden]{display:none!important}
  @media (min-width:451px){
    body{background:var(--gray-100)}
    .page{box-shadow:0 0 24px rgba(15,23,42,.06), 0 0 64px rgba(15,23,42,.10)}
  }
  :focus-visible{outline:2px solid var(--amber-500);outline-offset:2px}
</style>
</head>
<body>
<div class="page">
  <header>
    <!-- 로고를 누르면 마이페이지로 간다 (2026-09-25 사용자 지시 — 맨 아래 마이페이지 버튼 대신). -->
    <a class="home" href="/mypage/" aria-label="커리어코치 — 마이페이지로">
      <span class="app-icon"><img src="/assets/mark-white.svg" alt=""></span>
      <img class="wordmark" src="/assets/wordmark.svg" alt="커리어코치">
    </a>
  </header>

  <div class="center" id="loading"><svg class="ld-art" viewBox="0 0 50 50" aria-hidden="true"><circle cx="25" cy="25" r="20"/></svg><span class="sr" role="status">불러오는 중이에요…</span></div>
  <div class="center" id="notice" hidden><p class="notice" role="status"><span id="notice-t"></span><span class="ask" id="notice-ask"></span></p></div>

  <main id="open" hidden>
    <div class="eyebrow" id="eyebrow" hidden></div>
    <div class="head"><h1 class="t-display">내 조건의 새 공고</h1></div>
    <div id="tiles">
      <div class="when" id="when"></div>
      <div class="nums">
        <div><div class="l">새 공고</div><div class="v" id="v1"></div><div class="d" id="d1"></div></div>
        <div><div class="l">채용 회사</div><div class="v" id="v2"></div><div class="d" id="d2"></div></div>
        <div><div class="l" id="l3"></div><div class="v" id="v3"></div><div class="d" id="d3"></div></div>
      </div>
    </div>
    <div class="band" id="band"></div>
    <div class="stick">
    <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="회사·직무 이름으로 찾기" aria-label="공고 검색"></label>
    <div class="sb">
      <div class="seg" role="group" aria-label="정렬">
        <button type="button" data-sort="기본" aria-pressed="true">기본 순</button>
        <button type="button" data-sort="마감" aria-pressed="false">마감 임박 순</button>
      </div>
    </div>
    </div>
    <div class="list" id="list"></div>
    <div class="pg" id="pg"></div>
  </main>

  <section id="closed" hidden>
    <div class="center"><div class="lock">
      <div class="a">구독 중에만 볼 수 있는 브리핑이에요</div>
      <div class="b">다시 구독하면 매주 목요일 새 공고와 채용 시장 숫자를 받아볼 수 있어요.</div>
    </div></div>
    <div class="float"><a class="cta" href="/checkout/">다시 구독하기</a></div>
  </section>
</div>

<script type="module">
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from '/assets/supabase-config.js';

  const $ = (id) => document.getElementById(id);

  /* 안내문 — 상수로 모아 둔다. figma-docs-text.json 의 webScriptText 가 MSG 를 선언해
     피그마 상태 프레임(2170:1043·1050·1319·1477)과 대조한다. */
  const MSG = {
    badLink: '링크가 올바르지 않아요. 알림톡에서 받은 링크로 다시 열어 주세요.',
    blocked: '지금은 열 수 없어요.',
    none:    '이번 주에 보낸 공고가 없어요.',
    noHit:   '에 맞는 공고가 없어요',
    ask:     '오류는 careercoach.my@gmail.com로 문의해 주세요.',   // 링크로 만들지 않는다(2026-09-25 사용자 지시)
  };

  // 숫자 칸 이름은 SQL(0063 market_trend)이 정본이다. 구간이 아닌 칸만 여기서 안다.
  const 신규 = '신규 공고', 기업 = '채용 기업', 판별불가 = '연차 판별 불가';
  const 같음_퍼센트 = 3, PER = 10, 묶음 = 5;

  const params = new URLSearchParams(location.search);
  const token = params.get('t') || '';
  const day = params.get('d') || '';
  const wellFormed = /^[A-Za-z0-9_-]{22}$/.test(token) && /^\d{4}-\d{2}-\d{2}$/.test(day);

  let 공고 = [], q = '', page = 1, 정렬 = '기본';

  const notice = (t) => {
    $('notice-t').textContent = t; $('notice-ask').textContent = MSG.ask;
    $('loading').hidden = true; $('notice').hidden = false; $('open').hidden = true; $('closed').hidden = true;
  };

  async function load() {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/jobs_briefing', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY },
      body: JSON.stringify({ p_token: token, p_send_date: day }),
    });
    const data = await res.json().catch(() => null);
    if (!res.ok || !data) throw new Error((data && data.message) || MSG.blocked);
    return data;
  }

  const 변화 = (최근, 직전) => {
    if (!직전) return '';
    const 율 = (최근 - 직전) / 직전 * 100;
    if (Math.abs(율) < 같음_퍼센트) return '비슷';
    return (율 > 0 ? '▲ ' : '▼ ') + Math.round(Math.abs(율)) + '%';
  };

  // ⚠️ 문턱(3%·1%p)과 「가장 크게 움직인 연차 구간」 판정은 career-coach `crawler/market_trend.py`
  //    (_변화·_연차변화)의 사본이다. 알림톡과 이 화면이 같은 말을 해야 하니 한쪽을 고치면 다른 쪽도 고친다.
  function 숫자칸(지표) {
    const 칸 = Object.fromEntries(지표.map(r => [r['지표'], [Number(r['최근']), Number(r['직전'])]]));
    // 칸 이름이 SQL(0063)과 어긋나면 0 으로 꾸미지 않고 숫자 줄을 통째로 내린다.
    if (!칸[신규] || !칸[기업]) { $('tiles').hidden = true; return; }
    const [a1, b1] = 칸[신규], [a2, b2] = 칸[기업];
    const 칠 = (id, t) => {
      $(id).textContent = t; $(id).className = 'd' + (t.startsWith('▲') ? ' up' : t === '비슷' ? ' flat' : '');
      $(id).parentNode.classList.toggle('up', t.startsWith('▲'));
    };
    $('v1').textContent = a1.toLocaleString('ko-KR'); 칠('d1', 변화(a1, b1));
    $('v2').textContent = a2.toLocaleString('ko-KR'); 칠('d2', 변화(a2, b2));
    // 셋째 칸 — 연차 구간 중 비중이 가장 크게 움직인 하나(알림톡 연차 줄과 같은 판정).
    const 구간 = Object.entries(칸).filter(([k]) => ![신규, 기업, 판별불가].includes(k));
    const 합 = i => 구간.reduce((s, [, v]) => s + v[i], 0), 최근합 = 합(0), 직전합 = 합(1);
    if (!최근합) { $('l3').parentNode.hidden = true; $('l3').closest('.nums').style.gridTemplateColumns = 'repeat(2,minmax(0,1fr))'; return; }
    const 폭 = ([, [a, b]]) => 직전합 ? a / 최근합 * 100 - b / 직전합 * 100 : 0;
    const 큰 = 구간.reduce((m, x) => Math.abs(폭(x)) > Math.abs(폭(m)) ? x : m);
    const d = 폭(큰);
    $('l3').textContent = 년차(큰[0]);
    $('v3').textContent = Math.round(큰[1][0] / 최근합 * 100) + '%';
    // 비중 폭은 일의 자리까지 (2026-09-25 사용자 확정)
    칠('d3', !직전합 ? '' : Math.abs(d) < 1 ? '비슷' : (d > 0 ? '▲ ' : '▼ ') + Math.round(Math.abs(d)) + '%');   // 「%p」 대신 「%」 (2026-09-25 사용자 지시)
  }

  function 기간(지표) {
    const 끝 = 지표.length ? new Date(지표[0]['기준일'] + 'T00:00:00') : null;
    if (!끝) return '';
    const f = (n) => { const x = new Date(끝); x.setDate(x.getDate() - n); return (x.getMonth() + 1) + '/' + x.getDate(); };
    return f(7) + '~' + f(1);          // 기준일은 배타 — 알림톡 #{기간} 과 같은 계산
  }

  const 남은날 = (마감) => {
    if (!마감) return null;
    const 오늘 = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' })); 오늘.setHours(0, 0, 0, 0);
    return Math.round((new Date(마감 + 'T00:00:00') - 오늘) / 86400000);
  };

  // 연차 칸 모양은 수집이 정한다: 최소 0·최대 0 = 신입, 최대 100(상한 없음) = 경력 무관.
  const 연차 = (a, b) => a > 0 ? a + '년차 이상' : (b == null || b >= 100) ? '경력 무관' : '신입';
  // 연차는 「년차」로 쓴다 (2026-09-25 사용자 지시). 칸 이름은 SQL(0063)이 「8년 이상」·「3~7년」 으로 준다.
  const 년차 = (k) => k.replace(/(\d)년 이상$/, '$1년차 이상').replace(/(\d)년$/, '$1년차');

  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  function 행(r) {
    const a = el('a', 'row'); a.href = r['링크'] || '#'; a.target = '_blank'; a.rel = 'noopener noreferrer';
    const g = el('div', 'grow'), top = el('div', 'co-line');
    top.append(el('span', 'co', r['회사'] || ''));
    const 지역 = (r['지역'] || [])[0];
    top.append(el('span', 'meta', [연차(r['연차최소'], r['연차최대']), 지역].filter(Boolean).join(' · ')));
    g.append(top, el('div', 'ttl', r['제목'] || ''));
    a.append(g);
    const n = 남은날(r['마감']);
    if (n != null && n >= 0) a.append(el('span', 'dday' + (n <= 7 ? ' hot' : ''), n === 0 ? 'D-Day' : 'D-' + n));
    return a;
  }

  function 쪽버튼(last) {
    const 첫 = Math.floor((page - 1) / 묶음) * 묶음 + 1, 끝 = Math.min(첫 + 묶음 - 1, last);
    const b = (go, 글, 이름, 끔, 현재) => { const x = el('button', null, 글); x.type = 'button'; x.dataset.go = go; x.disabled = !!끔; if (이름) x.setAttribute('aria-label', 이름); if (현재) x.setAttribute('aria-current', 'page'); return x; };
    const nav = el('nav'); nav.setAttribute('aria-label', '페이지');
    const L = el('div'), M = el('div', 'mid'), R = el('div');
    L.append(b(1, '«', '맨 앞', page === 1), b(첫 - 묶음, '‹', '이전 다섯 쪽', 첫 === 1));
    for (let i = 첫; i <= 끝; i++) M.append(b(i, String(i), null, false, i === page));
    R.append(b(끝 + 1, '›', '다음 다섯 쪽', 끝 === last), b(last, '»', '맨 끝', page === last));
    nav.append(L, M, R);
    return nav;
  }

  function 그리기() {
    const hit = 공고.filter(r => !q || ((r['제목'] || '') + (r['회사'] || '')).includes(q));
    // 마감일이 없거나 이미 지난 공고는 맨 뒤로 보낸다(링크가 90일 살아 있어 지난 공고가 섞인다).
    const 키 = r => { const n = 남은날(r['마감']); return n == null || n < 0 ? 1e9 : n; };
    if (정렬 === '마감') hit.sort((x, y) => 키(x) - 키(y));
    const last = Math.max(1, Math.ceil(hit.length / PER));
    page = Math.min(page, last);
    const list = $('list'); list.replaceChildren();
    if (q && !hit.length) list.append(el('div', 'empty', '「' + q + '」' + MSG.noHit));
    else if (!hit.length) { const e = el('div', 'empty sm', MSG.none); e.append(el('span', 'ask', MSG.ask)); list.append(e); }
    else hit.slice((page - 1) * PER, page * PER).forEach(r => list.append(행(r)));
    // 건수는 맨 아래 「총 73개 · 1 / 8쪽」 한 줄 (2026-09-25 사용자 지시). 한 쪽뿐이면 「총 N개」 만, 0건이면 안내가 대신한다.
    const 줄 = hit.length ? el('div', 'pos', '총 ' + hit.length.toLocaleString('ko-KR') + '개' + (last > 1 ? ' · ' + page + ' / ' + last + '쪽' : '')) : null;
    $('pg').replaceChildren(...[hit.length > PER ? 쪽버튼(last) : null, 줄].filter(Boolean));
    document.querySelectorAll('[data-sort]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.sort === 정렬)));
  }

  document.addEventListener('click', (e) => {
    const s = e.target.closest('[data-sort]'); if (s) { 정렬 = s.dataset.sort; page = 1; 그리기(); return; }
    const g = e.target.closest('[data-go]'); if (g && !g.disabled) { page = Number(g.dataset.go); 그리기(); $('band').scrollIntoView({ block: 'start' }); }
  });
  $('q').addEventListener('input', (e) => { q = e.target.value.trim(); page = 1; 그리기(); });

  (async () => {
    if (!wellFormed) return notice(MSG.badLink);
    try {
      const d = await load();
      $('loading').hidden = true;
      if (d['상태'] === '구독필요') { $('closed').hidden = false; return; }
      if (d['상태'] !== '열림') return notice(MSG.blocked);   // 모르는 상태를 구독필요로 읽지 않는다
      숫자칸(d['지표'] || []);
      $('when').textContent = 기간(d['지표'] || []);
      const 칩 = d['칩'] || [];
      if (칩.length) { $('eyebrow').textContent = 칩.join(' · '); $('eyebrow').hidden = false; }
      공고 = d['공고'] || [];
      $('open').hidden = false;
      그리기();
    } catch (err) {
      notice(err && err.message ? err.message : MSG.blocked);
    }
  })();
</script>
