<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<meta name="format-detection" content="telephone=no">
<title>내 아티클 저장소 — 커리어코치</title>
<meta name="description" content="소장한 커리어코치 아티클 전문을 다시 볼 수 있습니다.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/logo-circle.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    color-scheme: only light;
    --amber-50:#FFFBEB; --amber-100:#FEF3C7; --amber-500:#F59E0B; --amber-600:#D97706;
    --amber-700:#B45309; --amber-800:#92400E; --amber-950:#451A03;
    --emerald-500:#10B981;
    --gray-50:#F8FAFC; --gray-100:#F1F5F9; --gray-200:#E2E8F0; --gray-300:#CBD5E1;
    --gray-400:#94A3B8; --gray-500:#64748B; --gray-600:#475569; --gray-700:#334155;
    --gray-800:#1E293B; --gray-900:#0F172A; --stone-50:#FAFAF9;
    /* 랜딩과 동일한 폭 시스템 */
    --pad-x:24px; --card-max:450px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--gray-100)}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;
    background:#fff;color:var(--gray-800);-webkit-font-smoothing:antialiased}
  /* CLAUDE.md 규칙 — 화면 채우기 높이는 svh */
  .page{width:100%;max-width:var(--card-max);margin:0 auto;background:#fff;
    min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
  /* 헤더·뒤로가기 — CLAUDE.md 「헤더와 뒤로가기 표준값」 (피그마 376:2507) */
  .hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;
    height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;background:#fff}
  .back{width:48px;height:48px;display:flex;align-items:center;justify-content:center;position:relative}
  .back svg{position:relative;z-index:1}
  .back::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:36px;height:36px;border-radius:10px;background:transparent;transition:background .12s}
  .back:active::before{background:var(--gray-100)}
  main{flex:1;display:flex;flex-direction:column;width:100%;max-width:var(--card-max);margin:0 auto}
  /* 피그마 텍스트 스타일 대응 (careercoach 컬렉션 text/*) */
  .t-display{font-size:28px;line-height:36px;font-weight:800;letter-spacing:-.02em;color:var(--gray-900)}
  .t-body-s{font-size:14px;line-height:20px;font-weight:400}
  .t-caption{font-size:13px;line-height:18px;font-weight:400}
  .t-micro{font-size:11px;line-height:14px;font-weight:500}
  .caret{font-size:20px;line-height:1;color:var(--gray-400);flex:none}
  [hidden]{display:none!important}

  .title{padding:20px var(--pad-x) 9px}
  .desc{padding:10px var(--pad-x);color:var(--gray-500);word-break:keep-all}

  .chip{border:0;background:#fff;box-shadow:inset 0 0 0 1px var(--gray-200);border-radius:10px;
    padding:9px 12px;font:inherit;font-size:13px;line-height:18px;font-weight:400;color:var(--gray-600);
    cursor:pointer;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--amber-50);box-shadow:inset 0 0 0 1px var(--amber-500);color:var(--amber-600)}

  .search-wrap{padding:16px var(--pad-x) 0}
  .search{height:40px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;gap:10px}
  .search svg{flex:none}
  .search input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:inherit;
    font-size:14px;line-height:20px;color:var(--gray-800)}
  .search input::placeholder{color:var(--gray-400)}
  .clearq{border:0;background:none;font:inherit;font-size:13px;line-height:18px;
    color:var(--gray-400);cursor:pointer;flex:none;padding:0}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .months-wrap{padding:12px var(--pad-x) 0;display:flex;align-items:center;gap:8px}
  .months{flex:1;min-width:0;display:flex;align-items:center;gap:7px;overflow-x:auto;scrollbar-width:none}
  .months::-webkit-scrollbar{display:none}
  .months.open{flex-wrap:wrap;overflow:visible}
  .ybreak{display:flex;align-items:center;gap:6px;flex:none}
  .ybreak i{width:1px;height:16px;background:var(--gray-200);display:block}
  .ybreak span{color:var(--gray-400);font-weight:700}
  .months .chip{flex:none}
  .mtoggle{width:38px;height:38px;flex:none;border:0;border-radius:10px;background:var(--gray-50);
    color:var(--gray-500);font:inherit;font-size:13px;line-height:18px;cursor:pointer}
  .list{padding:22px var(--pad-x) 24px;flex:1}
  .list-group{border-top:1px solid var(--gray-100)}
  .art{display:flex;align-items:flex-start;gap:12px;padding:15px 2px;
    border-bottom:1px solid var(--gray-100);text-decoration:none;color:inherit}
  .art .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .meta{display:flex;align-items:center;gap:7px}
  .tag{padding:2px 8px;border-radius:9999px;background:var(--amber-50);color:var(--amber-600);white-space:nowrap}
  .date{color:var(--gray-500)}
  .art .ttl{color:var(--gray-800);word-break:keep-all}
  .art .caret{font-size:14px;line-height:20px;color:var(--gray-300)}
  .empty{padding:28px 0;display:flex;flex-direction:column;align-items:center;gap:6px}
  .empty .t-body-s{color:var(--gray-500)}
  .empty .t-caption{color:var(--gray-400)}
</style>
</head>
<body>
<div class="page">
<header class="hd"><a class="back" href="/mypage/" aria-label="뒤로"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15.75 4.5L8.25 12l7.5 7.5" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></header>
<main>
  <div class="title"><h1 class="t-display">내 아티클 저장소</h1></div>
  <div class="desc t-body-s">아티클 전문을 발행 당일에 읽으셨다면<br>멤버십을 유지하는 동안 언제든 다시 볼 수 있어요.</div>
  <div class="search-wrap">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="6" stroke="#94A3B8" stroke-width="2"/>
        <path d="M12.5 12.5L16 16" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <label class="sr-only" for="q">제목·내용으로 검색</label>
      <input type="search" id="q">
      <button class="clearq" type="button" id="clearq" hidden>지우기</button>
    </div>
  </div>
  <div class="months-wrap">
    <div class="months">
      <button class="chip" type="button" aria-pressed="true">8월</button>
      <button class="chip" type="button" aria-pressed="false">7월</button>
      <button class="chip" type="button" aria-pressed="false">6월</button>
      <button class="chip" type="button" aria-pressed="false">5월</button>
      <button class="chip" type="button" aria-pressed="false">4월</button>
      <button class="chip" type="button" aria-pressed="false">3월</button>
      <button class="chip" type="button" aria-pressed="false">2월</button>
      <button class="chip" type="button" aria-pressed="false">1월</button>
      <span class="ybreak"><i aria-hidden="true"></i><span class="t-micro">2025</span></span>
      <button class="chip" type="button" aria-pressed="false">12월</button>
      <button class="chip" type="button" aria-pressed="false">11월</button>
      <button class="chip" type="button" aria-pressed="false">10월</button>
    </div>
    <button class="mtoggle" type="button" id="mtoggle" aria-expanded="false" aria-label="월 전체 보기">▾</button>
  </div>
  <div class="list">
    <div class="list-group">
      <a class="art" href="#">
        <span class="col">
          <span class="meta"><span class="t-micro tag">디자인</span><span class="t-caption date">08. 07</span></span>
          <span class="t-body-s ttl">디자인 시스템을 팀에 정착시키는 6개월</span>
        </span>
        <span class="caret" aria-hidden="true">›</span>
      </a>
      <a class="art" href="#">
        <span class="col">
          <span class="meta"><span class="t-micro tag">커리어·이직</span><span class="t-caption date">08. 06</span></span>
          <span class="t-body-s ttl">이직 오퍼를 비교하는 세 가지 기준</span>
        </span>
        <span class="caret" aria-hidden="true">›</span>
      </a>
      <a class="art" href="#">
        <span class="col">
          <span class="meta"><span class="t-micro tag">AI로 일하기</span><span class="t-caption date">08. 04</span></span>
          <span class="t-body-s ttl">AI로 리서치를 정리하는 워크플로</span>
        </span>
        <span class="caret" aria-hidden="true">›</span>
      </a>
      <a class="art" href="#">
        <span class="col">
          <span class="meta"><span class="t-micro tag">디자인</span><span class="t-caption date">08. 03</span></span>
          <span class="t-body-s ttl">리서치 없이 만든 화면이 실패하는 이유</span>
        </span>
        <span class="caret" aria-hidden="true">›</span>
      </a>
    </div>
  </div>
</main>
<script>
  /* 목록 정본. 정적 HTML 에는 기준 프레임(908:640)과 같은 2026년 8월 4건만 두고,
     달을 바꾸거나 검색하면 여기서 다시 그린다. 피그마는 한 상태를 그린 것이라
     나머지 달의 제목은 피그마에 없다 — 그래서 마크업이 아니라 데이터로 둔다.
     (원본: 디자인 캔버스의 ARCHIVE) */
  var ARCHIVE = [
    ['2026년 8월','08. 07','디자인','디자인 시스템을 팀에 정착시키는 6개월'],
    ['2026년 8월','08. 06','커리어·이직','이직 오퍼를 비교하는 세 가지 기준'],
    ['2026년 8월','08. 04','AI로 일하기','AI로 리서치를 정리하는 워크플로'],
    ['2026년 8월','08. 03','디자인','리서치 없이 만든 화면이 실패하는 이유'],
    ['2026년 7월','07. 31','커리어·이직','연봉 협상에서 먼저 말하지 않기'],
    ['2026년 7월','07. 29','디자인','토큰 네이밍, 어디까지 정해야 할까'],
    ['2026년 7월','07. 24','AI로 일하기','프롬프트보다 중요한 건 맥락 정리다'],
    ['2026년 7월','07. 22','디자인','핸드오프를 없애는 팀의 일하는 방식'],
    ['2026년 7월','07. 17','커리어·이직','경력기술서는 성과가 아니라 판단을 쓴다'],
    ['2026년 6월','06. 30','디자인','접근성을 기본값으로 만드는 컴포넌트 설계'],
    ['2026년 6월','06. 26','AI로 일하기','회의록을 자동화했더니 생긴 부작용'],
    ['2026년 6월','06. 19','디자인','좋은 empty state가 리텐션을 바꾼다'],
    ['2026년 5월','05. 28','커리어·이직','레퍼런스 체크는 이미 시작됐다'],
    ['2026년 5월','05. 21','디자인','디자인 부채를 갚는 스프린트 만들기'],
    ['2026년 4월','04. 30','AI로 일하기','자동화하면 안 되는 일 구분하기'],
    ['2026년 4월','04. 15','디자인','컴포넌트는 언제 쪼개야 하는가'],
    ['2026년 3월','03. 27','커리어·이직','연차보다 오래 남는 커리어 서사'],
    ['2026년 3월','03. 12','디자인','모션은 장식이 아니라 안내다'],
    ['2026년 2월','02. 26','디자인','첫 주에 만든 디자인 원칙 세 줄'],
    ['2026년 1월','01. 15','커리어·이직','연초 목표를 분기로 쪼개는 법'],
    ['2025년 12월','12. 18','AI로 일하기','프롬프트보다 중요한 건 데이터 정리'],
    ['2025년 12월','12. 04','디자인','한 해 디자인 회고를 쓰는 다섯 질문'],
    ['2025년 11월','11. 20','커리어·이직','이력서에서 성과를 숫자로 만드는 법'],
    ['2025년 11월','11. 06','디자인','접근성은 마지막에 붙이는 게 아니다'],
    ['2025년 10월','10. 23','AI로 일하기','반복 업무를 워크플로로 바꾸기'],
    ['2025년 10월','10. 09','디자인','리뷰에서 방어하지 않고 설명하기']
  ];
  (function () {
    /* placeholder 는 속성이라 문구 대조(docs-audit)에 안 잡힌다. 그래서 문구의 정본은
       화면에 있는 sr-only label 하나로 두고, placeholder 는 그걸 복사해 쓴다 —
       두 곳에 같은 글자를 적어 두면 보이는 쪽만 고쳐도 검사가 초록이 된다. */
    var q = document.getElementById('q');
    var qLabel = document.querySelector('label[for="q"]');
    if (qLabel) q.placeholder = qLabel.textContent;
    var months = document.querySelector('.months');
    var btn = document.getElementById('mtoggle');
    btn.addEventListener('click', function () {
      var open = months.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.textContent = open ? '▴' : '▾';
    });

    var listBox = document.querySelector('.list');
    function selectedMonth() {
      /* 달은 언제나 하나가 눌려 있다. 그래도 못 찾으면 첫 칩으로 떨어뜨린다 —
         null 을 돌려주면 0건이 되어, 검색하지도 않았는데 「검색 결과가 없어요」가 뜬다. */
      var on = months.querySelector('.chip[aria-pressed="true"]') || months.querySelector('.chip');
      var year = '2026', walk = on.previousElementSibling;
      while (walk) {
        if (walk.classList.contains('ybreak')) { year = walk.textContent.trim(); break; }
        walk = walk.previousElementSibling;
      }
      return year + '년 ' + on.textContent.trim();
    }
    function esc(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
    function render() {
      var term = q.value.trim().toLowerCase();
      var rows = term
        ? ARCHIVE.filter(function (a) { return (a[3] + ' ' + a[2]).toLowerCase().indexOf(term) >= 0; })
        : ARCHIVE.filter(function (a) { return a[0] === selectedMonth(); });
      if (!rows.length) {
        listBox.innerHTML = '<div class="empty"><span class="t-body-s">검색 결과가 없어요</span>'
          + '<span class="t-caption">다른 키워드로 찾아보세요</span></div>';
        return;
      }
      listBox.innerHTML = '<div class="list-group">' + rows.map(function (a) {
        return '<a class="art" href="#"><span class="col">'
          + '<span class="meta"><span class="t-micro tag">' + esc(a[2]) + '</span>'
          + '<span class="t-caption date">' + esc(a[1]) + '</span></span>'
          + '<span class="t-body-s ttl">' + esc(a[3]) + '</span></span>'
          + '<span class="caret" aria-hidden="true">›</span></a>';
      }).join('') + '</div>';
    }
    months.addEventListener('click', function (e) {
      var chip = e.target.closest('.chip');
      if (!chip) return;
      months.querySelectorAll('.chip').forEach(function (c) {
        c.setAttribute('aria-pressed', c === chip ? 'true' : 'false');
      });
      q.value = '';
      clearq.hidden = true;
      render();
    });
    var clearq = document.getElementById('clearq');
    clearq.addEventListener('click', function () { q.value = ''; clearq.hidden = true; render(); });
    q.addEventListener('input', function () { clearq.hidden = q.value.length === 0; render(); });
  })();
</script>
</div>
</body>
</html>
