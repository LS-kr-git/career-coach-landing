<style>
  :root{
    color-scheme: only light;
    --amber-500:#F59E0B;
    --gray-100:#F1F5F9; --gray-500:#64748B; --gray-800:#1E293B;
    --card-max: 450px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--gray-100)}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;
    background:#fff;color:var(--gray-800);-webkit-font-smoothing:antialiased}
  .page{width:100%;max-width:var(--card-max);margin:0 auto;background:#fff;
    min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center}
  /* 피그마 595:2646 「로그인 처리 중」 · 2026-10-15 사용자 확정 「점 세 개 → 체크」(결제 확인 중 덮개와 같은 모양).
     기다리는 동안 점 세 개가 차례로 튀고, 로그인이 서면 점이 모이며 체크가 튀어나온다 — 0.6초 보인 뒤 이동한다.
     실패는 체크 없이 바로 랜딩으로 돌아간다(ccFail). */
  .wrap{width:280px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .slot{position:relative;width:64px;height:64px;display:flex;align-items:center;justify-content:center}
  .dots{display:flex;gap:8px;transition:all .22s}
  .dots i{width:10px;height:10px;border-radius:50%;background:var(--amber-500);animation:bob 1.2s ease-in-out infinite}
  .dots i:nth-child(2){animation-delay:.16s}
  .dots i:nth-child(3){animation-delay:.32s}
  @keyframes bob{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-9px);opacity:1}}
  .ok{position:absolute;inset:0;border-radius:50%;background:#FEF3C7;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.25)}
  .ok path{stroke-dasharray:24;stroke-dashoffset:24}
  .ttl{margin-top:18px;font-size:17px;line-height:24px;font-weight:600;color:var(--gray-800)}
  .hint{margin-top:6px;font-size:13px;line-height:19px;color:var(--gray-500)}
  .wrap.fin .dots{gap:0;opacity:0;transform:scale(.4)}
  .wrap.fin .ok{animation:pop .42s .1s cubic-bezier(.34,1.56,.64,1) both}
  .wrap.fin .ok path{animation:draw .3s .28s ease-out both}
  .wrap.fin .hint{visibility:hidden}
  @keyframes pop{from{transform:scale(.25);opacity:0}to{transform:none;opacity:1}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion:reduce){.dots i{animation-duration:2.4s}}
  @media (min-width:451px){
    body{background:var(--gray-100)}
    .page{box-shadow:0 0 24px rgba(15,23,42,.06), 0 0 64px rgba(15,23,42,.10)}
  }
</style>

<body>
<div class="page">
  <div class="wrap" id="prog">
    <div class="slot" aria-hidden="true">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="ok"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg></div>
    </div>
    <p class="ttl" id="ttl" role="status">가입을 마무리하고 있어요</p>
    <p class="hint">잠시만 기다려 주세요</p>
  </div>
</div>

<script>
  // ★ supabase CDN 을 쓰는 아래 모듈과 **일부러 분리**했다. CDN 이 막히면 그 모듈은 한 줄도
  //   실행되지 않아 3초 폴백조차 등록되지 못하고, getSession() 이 응답 없이 멎어도 그 뒤의
  //   setTimeout 에 닿지 못한다 — 두 경우 모두 화면이 점만 도는 채로 영영 멈춘다.
  let done = false;
  window.ccGo = (path) => { if (!done) { done = true; location.replace(path); } };
  // 다시 로그인한 사람은 글자만 다르다 — 「로그인하고 있어요」 → 「로그인됐어요」 (2026-10-15 사용자 확정, 목업 v1 의 B 오른쪽).
  // 처음 가입한 사람은 그대로다. 누구인지는 세션이 서야 알므로(ccWho) 그 전에는 이 기기에서 로그인한 적이 있는지로 먼저 고른다.
  let 다시 = false;
  window.ccWho = (재) => {
    다시 = 재;
    document.getElementById('ttl').textContent = 재 ? '로그인하고 있어요' : '가입을 마무리하고 있어요';
  };
  try { if (localStorage.getItem('cc_logged_in_before')) window.ccWho(true); } catch (e) { /* 못 읽으면 가입 문구로 시작한다 */ }
  // 로그인이 섰다 — 점을 체크로 바꾸고 0.6초 보인 뒤 끝나는 약속을 준다(이동은 부르는 쪽이 한다).
  // 이 블록에 두는 이유는 위와 같다 — 모듈이 죽어도 점은 마크업 기본값으로 돌고 있다.
  window.ccDone = () => {
    document.getElementById('prog').classList.add('fin');
    document.getElementById('ttl').textContent = 다시 ? '로그인됐어요' : '가입이 완료됐어요';
    return new Promise((r) => setTimeout(r, 600));
  };
  // 모듈이 살아 있으면 자기 3초 폴백으로 먼저 나간다. 이건 그마저 못 도는 경우만 맡는다.
  //
  // ★ "3초가 먼저" 는 CDN 이 빠를 때만 성립한다. 아래 3초 타이머는 CDN 로딩이 **끝난 뒤에야**
  //   걸리므로, 느린 모바일에서 CDN 6초 + getSession 2초면 8초가 먼저 터져 **인증에 성공한
  //   사람**을 실패 화면으로 보냈다. 8초를 키워 봐야 더 느린 기기에서 같은 일이 난다.
  //   그래서 시간이 아니라 **진척**을 본다 — 모듈이 한 걸음 나아갈 때마다 ccAlive() 로 이 타이머를
  //   다시 잰다. 8초 동안 아무 진척이 없을 때만 실패로 넘긴다. (2026-08-09)
  //   단, 파일을 받느라 진척 신호를 낼 수 없는 첫 구간만 20초다 — 아래 ccAlive(20000) 주석 (2026-10-15).
  //   인증에 성공한 경우는 모듈이 곧바로 go() 를 불러 done 이 서므로 여기서 다시 보지 않는다.
  // 실패하면 랜딩으로 돌려보내며 **어디서 끊겼나**를 주소에 싣는다 — 랜딩이 짧은 안내를 띄우고 그것을 `login_fail` 로
  // 남기고 어드민 「카카오 로그인이 실패하고 있나」가 센다 (2026-10-03, career-coach 마이그레이션 *_kakao_login_watch).
  // 카카오·로그인 서버가 오류를 돌려줬으면 그 코드가 이 주소(?error=… 또는 #error=…)에 와 있다.
  // ★ 맨 처음에 읽는다 — supabase-js 가 주소를 정리하기 전이어야 한다.
  // ★ 코드만 옮긴다. 설명문(error_description)은 길고 사람 말이라 원장에 안 넣는다.
  const 받은오류 = (() => {
    const q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.slice(1));
    // `error` 를 먼저 본다 — OAuth 표준 코드라 카카오 「취소」가 늘 `access_denied` 로 온다.
    // `error_code` 는 Supabase 가 덧붙이는 세부 이름이라 취소에도 다른 값이 올 수 있다(어드민이 취소를 실패로 세게 된다).
    const c = q.get('error') || h.get('error') || q.get('error_code') || h.get('error_code') || '';
    return c.replace(/[^A-Za-z0-9_]/g, '').slice(0, 40);
  })();
  window.ccFail = (why) => window.ccGo(받은오류
    ? '/?login=fail&why=provider&code=' + 받은오류
    : '/?login=fail&why=' + why);
  let timer;
  window.ccAlive = (ms = 8000) => {
    clearTimeout(timer);
    timer = setTimeout(() => window.ccFail('stalled'), ms);
  };
  // 첫 구간만 20초 — 이 페이지와 파일 여러 장(supabase-js 9개 등)을 받는 동안에는 진척 신호를 낼 수가 없다.
  // 아주 느린 망(약 0.5Mbps·지연 0.6초)에서 이 구간이 8.2초 걸려, 8초였을 때는 인증에 성공한 사람을
  // 실패 화면으로 보낼 수 있었다(2026-10-15 실측). 랜딩에서 미리 받아 둔 사람은 0.1초 안에 지난다.
  window.ccAlive(20000);
</script>

<script type="module">
  // 접속 정보는 /assets/supabase-config.js 한 곳에만 둔다 (2026-08-06 복구 훈련 결과).
  import { SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_JS } from '/assets/supabase-config.js';
  import { takeNext } from '/assets/return-to.js';
  import { forgetIfOtherOwner, readState, mergeDraft, readDraft } from '/assets/onboarding-store.js';
  import { 이어갈곳판정, 온보딩마침판정 } from '/assets/mypage-data.js';
  // 주소는 설정 파일 한 곳에 — 랜딩이 같은 주소를 미리 받아 둔다(index.html 「미리 받아 두기」).
  window.ccAlive(20000);   // 여기까지 왔다 — supabase-js(가장 큰 파일 묶음)를 받는 동안 다시 넉넉히 잰다
  const { createClient } = await import(SUPABASE_JS);

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  window.ccAlive();   // CDN 로딩이 끝났다 — 위 하드 폴백의 8초를 여기서부터 다시 잰다

  const { track, metaCookies } = await import('/assets/track.js');
  window.ccAlive();   // track.js 도 별도 fetch 다 — 이 구간에 진척 신호가 없으면
                      // 앞 칸에서 잰 8초가 여기서 터져 성공한 로그인을 실패로 보낸다

  // 카카오 확장 프로필(이름·성별·생일·출생연도·전화번호)은 GoTrue 가 세션에 안 실어 준다.
  // 우리가 직접 가져오는데, 그 열쇠(provider_token)는 **Supabase 세션이 갱신되는 순간
  // 세션에서 사라진다**(로그인 1시간 뒤 자동으로 일어난다). 그래서 집을 수 있는 자리가
  // 이 페이지 하나뿐이다. DB 는 열쇠만 받아 두고 즉시 돌려주고, 카카오 왕복은 1분마다
  // 도는 수거 작업이 한다 — 이 화면은 기다리지 않는다.
  // ★ `supabase.rpc()` 를 쓰지 않는다. 그쪽은 요청에 keepalive 가 없어 **이동하는 순간
  //   죽으므로** 부르는 쪽이 `await` 로 화면을 붙잡아야 하고, 그러면 아래 세 경로가
  //   한 약속에 묶여 멈춤 지점이 하나 생긴다 — 그 자리가 2026-08-09 에 성공한 로그인을
  //   실패 화면으로 보냈던 바로 그 자리다. `track.js` 의 keepalive 경로를 그대로 쓴다:
  //   이동을 한 순간도 막지 않고 요청은 살아남는다.
  const syncKakao = (session) => {
    if (!session.provider_token) {
      // 이 페이지는 인가 코드를 방금 교환한 자리라 여기서 열쇠가 비는 것은 **정상이 아니다.**
      // (갱신은 1시간 뒤에나 일어난다.) 조용히 넘기지 않고 한 건 남긴다.
      track('client_error', { msg: 'kakao_sync:no_provider_token' }, session.access_token);
      return;
    }
    fetch(SUPABASE_URL + '/rest/v1/rpc/sync_kakao_profile', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        apikey: SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + session.access_token,
      },
      body: JSON.stringify({
        p_access_token:  session.provider_token,
        p_refresh_token: session.provider_refresh_token ?? null,
      }),
      // keepalive — 페이지가 바로 넘어가도 요청이 살아남는다. `assets/track.js` 가 같은
      // 이유로 쓰는 것과 같은 장치다. (거기 `track()` 은 이벤트 전용이라 그대로 못 쓴다.)
      keepalive: true,
    })
      // ⚠️ 이 RPC 는 **실패해도 200 을 준다** — 로그인 흐름을 죽이지 않으려고 예외를 던지지
      //    않고 {"ok":false,...} 로 돌려주기 때문이다. 그래서 HTTP 상태만 보면 전면 고장이
      //    '오류 0건' 으로 보인다. 본문을 열어 ok 를 본다.
      .then(async (r) => {
        const out = r.ok ? await r.json().catch(() => null) : null;
        if (!r.ok || !out || out.ok !== true) {
          track('client_error',
                { msg: 'kakao_sync:' + (out?.reason ?? ('http' + r.status)) },
                session.access_token);
        }
      })
      .catch(() => {});   // 페이지가 이미 넘어갔다. 판정의 정본은 서버 기록이다.
  };

  // 로그인 성공을 한 번만 남긴다. 아래 세 경로(이벤트·폴백·타임아웃)가 겹칠 수 있다.
  // access_token 을 넘겨야 track() 이 auth.uid() 로 사람을 알아본다 —
  // 안 넘기면 익명 이벤트가 되어 퍼널이 끊긴다.
  let logged = false;
  const markLogin = (session) => {
    if (logged || !session) return;
    logged = true;
    // 계정이 생긴 지 30분이 넘었으면 다시 로그인한 사람이다 — 서버 report_signup_lead(career-coach 0135)와 같은 기준.
    const 생김 = Date.parse(session.user?.created_at ?? '');
    window.ccWho(Number.isFinite(생김) && Date.now() - 생김 > 30 * 60 * 1000);
    try { localStorage.setItem('cc_logged_in_before', '1'); } catch (e) { /* 다음에 가입 문구로 시작할 뿐이다 */ }
    track('login', {}, session.access_token);
    syncKakao(session);
    // 메타 「Lead」 — 카카오 가입을 막 마친 사람만 서버가 보낸다(career-coach 0135, 2026-10-14 사용자 지시).
    // 이 화면은 주소에 로그인 열쇠가 있어 픽셀을 꺼 두므로 브라우저 대신 서버가 보낸다. 재로그인이면 서버가 거른다.
    fetch(SUPABASE_URL + '/rest/v1/rpc/report_signup_lead', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + session.access_token },
      // 브라우저 표식(track.js 의 cc_b) — 우리(운영자) 브라우저에서 만든 시험 계정이면 서버가 안 보낸다(career-coach 0142).
      body: JSON.stringify({ p_fbp: metaCookies().fbp ?? null, p_fbc: metaCookies().fbc ?? null, p_b: (() => { try { return localStorage.getItem('cc_b'); } catch (e) { return null; } })() }),
      keepalive: true,
    })
      // 서버에 닿지 못한 실패는 서버 기록에 안 남는다 — 그 경우만 여기서 남긴다(닿았으면 private.meta_lead · error_log 가 정본).
      .then((r) => { if (!r.ok) track('client_error', { msg: 'meta_lead:http' + r.status }, session.access_token); })
      .catch(() => track('client_error', { msg: 'meta_lead:net' }, session.access_token));
    // 광고를 누른 이 브라우저의 클릭 표식을 회원에 붙여 둔다(career-coach 0156, 2026-10-15 사용자 지시) — 결제가 카드사 앱을
    // 거쳐 다른 브라우저로 돌아오거나 다른 기기에서 끝나도, 서버가 보내는 구매가 이 광고에 묶이게. 재로그인마다 새 값으로 갈아 끼운다.
    const 표식 = metaCookies();
    if (표식.fbp || 표식.fbc) fetch(SUPABASE_URL + '/rest/v1/rpc/remember_meta_click', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + session.access_token },
      body: JSON.stringify({ p_fbp: 표식.fbp ?? null, p_fbc: 표식.fbc ?? null }),
      keepalive: true,
    })
      .then((r) => { if (!r.ok) track('client_error', { msg: 'meta_click:http' + r.status }, session.access_token); })
      .catch(() => track('client_error', { msg: 'meta_click:net' }, session.access_token));
  };

  const go = window.ccGo;   // 이동 잠금은 위 폴백과 공유한다 — 두 경로가 겹쳐 두 번 이동하지 않게
  // 로그인 성공의 목적지. 결제 화면에서 로그인하러 온 사람은 그리로 돌아간다(assets/return-to.js).
  // 실패 쪽(/?login=fail)에서는 꺼내지 않는다 — 다시 로그인하면 그때 돌아가게.
  // 결제 화면처럼 적어 둔 곳이 없으면 **이어서 할 곳**으로 간다 (2026-10-16 사용자 지시 — 판정은 mypage-data `이어갈곳판정`).
  //   온보딩·결제 다 함 → 마이페이지 · 온보딩만 다 함 → 결제 화면 · 하는 중 → 이 기기에 남은 다음 단계.
  //   (그 전 판은 서버에 직군만 있으면 결제 전이어도 마이페이지로 보내, 결제할 사람이 「구독 · 결제」 줄을 찾아야 했다.)
  // 서버 값은 이 화면의 supabase 클라이언트로 읽는다 — 데이터 층 클라이언트를 하나 더 만들면 세션을 두 벌 든다.
  // 세션이 선 뒤에 묻는다(그 전에는 RLS 가 빈 답을 준다). 4초 안에 답이 없으면 온보딩으로 간다(1.5초는 느린 망의 재방문자를 빈 온보딩으로 보냈다 — 2026-10-15 출시 검수).
  // 못 물어봤으면(오류·시간 초과) null — 온보딩 1단계가 「설정을 불러오지 못해 처음 화면을 열었어요」를 띄운다(2026-10-15 D3).
  let 답옴 = false;
  const 행선지 = () => Promise.race([
    (async () => {
      const [pref, jobs] = await Promise.all([
        supabase.from('user_preference').select('user_id').maybeSingle(),
        supabase.from('user_preference_job').select('job_code').limit(1),
      ]);
      for (const r of [pref, jobs]) if (r.error) throw r.error;
      const 마침 = 온보딩마침판정(pref.data, jobs.data);   // mypage-data `onboardingDone` 과 같은 판정
      let 구독 = null;
      if (마침) {
        const r = await supabase.rpc('mypage_subscription').maybeSingle();
        if (r.error) throw r.error;
        구독 = r.data;
      } else {
        // 하는 중이면 서버의 1·2단계 진행 기록(0163)을 이 기기에 깐다 — 다른 기기에서 와도 확정한 다음 단계부터.
        mergeDraft(await readDraft(supabase));
      }
      답옴 = true;
      return 이어갈곳판정(마침, 구독, readState());
    })().catch((e) => { 답옴 = true; track('client_error', { msg: 'callback_dest:' + String(e?.message || e).slice(0, 80) }); return null; }),
    new Promise((r) => setTimeout(() => { if (!답옴) track('client_error', { msg: 'callback_dest:timeout' }); r(null); }, 4000)),
  ]);
  let 성공중 = false;   // 이벤트·폴백·3초 판정 세 경로가 겹쳐도 한 번만 묻는다
  const 성공 = async () => {
    if (성공중) return;
    성공중 = true;
    window.ccAlive();
    // 공용 기기 — 다른 계정이 고른 온보딩 값이 남아 있으면 지운다(앞 사람의 직무가 이 사람 화면에 보이고 저장되지 않게).
    forgetIfOtherOwner((await supabase.auth.getSession()).data.session?.user?.id);
    const 갈곳 = takeNext(null) ?? (await 행선지()) ?? '/onboarding/1/?dest=unknown';
    await window.ccDone();
    go(갈곳);
  };

  // supabase-js 는 detectSessionInUrl 기본값이 true 라 이 페이지에 도착하는 순간
  // 인가 코드를 세션으로 교환한다. 교환이 끝나면 SIGNED_IN 이 온다.
  supabase.auth.onAuthStateChange((_event, session) => {
    if (session) { markLogin(session); 성공(); }
  });

  // 폴백 — 이벤트를 놓쳤거나 이미 교환이 끝난 뒤 리스너가 붙은 경우
  const { data: { session } } = await supabase.auth.getSession();
  window.ccAlive();   // 세션 조회까지 끝났다 — 판정은 아래 3초 폴백이 한다
  if (session) { markLogin(session); 성공(); }

  // 3초 안에 세션이 안 생기면 실패로 본다 (사용자가 동의를 취소한 경우 등)
  setTimeout(async () => {
    // 이 폴백도 진척이다 — 여기서 다시 재지 않으면, 아래 getSession 이 5초를 넘길 때
    // 8초 하드 폴백이 먼저 터져 **인증에 성공한 사람**을 실패로 보낸다. 판정을 내리는
    // 구간에 진척 신호가 없던 것이 앞 판의 구멍이었다. (2026-08-09)
    window.ccAlive();
    const { data } = await supabase.auth.getSession();
    markLogin(data.session);
    if (data.session) 성공(); else window.ccFail('no_session');
  }, 3000);
</script>
</body>
</html>
