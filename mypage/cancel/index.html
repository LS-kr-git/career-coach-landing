<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<meta name="format-detection" content="telephone=no">
<title>구독 해지 — 커리어코치</title>
<meta name="description" content="커리어코치 멤버십 해지를 확인합니다.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/logo-circle.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    color-scheme: only light;
    --amber-50:#FFFBEB; --amber-100:#FEF3C7; --amber-500:#F59E0B; --amber-600:#D97706;
    --amber-700:#B45309; --amber-800:#92400E; --amber-950:#451A03;
    --emerald-500:#10B981;
    --gray-50:#F8FAFC; --gray-100:#F1F5F9; --gray-200:#E2E8F0; --gray-300:#CBD5E1;
    --gray-400:#94A3B8; --gray-500:#64748B; --gray-600:#475569; --gray-700:#334155;
    --gray-800:#1E293B; --gray-900:#0F172A; --stone-50:#FAFAF9;
    --error-600:#DC2626;
    /* CTA 토큰 — CLAUDE.md 「CTA 규칙」 공통값 */
    --cta-h:54px; --cta-radius:14px; --cta-fs:15px; --cta-fw:700;
    /* 랜딩과 동일한 폭 시스템 */
    --pad-x:24px; --card-max:450px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--gray-100)}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;
    background:#fff;color:var(--gray-800);-webkit-font-smoothing:antialiased}
  /* CLAUDE.md 규칙 — 화면 채우기 높이는 svh */
  .page{width:100%;max-width:var(--card-max);margin:0 auto;background:#fff;
    min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
  /* 헤더·뒤로가기 — CLAUDE.md 「헤더와 뒤로가기 표준값」 (피그마 376:2507) */
  .hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;
    height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;background:#fff}
  .back{width:48px;height:48px;display:flex;align-items:center;justify-content:center;position:relative}
  .back svg{position:relative;z-index:1}
  .back::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:36px;height:36px;border-radius:10px;background:transparent;transition:background .12s}
  .back:active::before{background:var(--gray-100)}
  main{flex:1;display:flex;flex-direction:column;width:100%;max-width:var(--card-max);margin:0 auto}
  /* 마지막 내용이 바닥의 동의 체크 + 탈퇴하기 묶음(.cta-dock 높이 152)에 안 깔리게 — 피그마 09-A·A-2·B 프레임 아래 여백 170 과 같은 값 */
  main{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
  /* 피그마 텍스트 스타일 대응 (careercoach 컬렉션 text/*) */
  .t-body-s{font-size:14px;line-height:20px;font-weight:400}
  /* 하단 플로팅 CTA — 온보딩 1단계(.fade + .cta)와 같은 모양: 흰 그라데이션 100px 위에 떠 있고 바닥에서 20 */
  .cta-dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--card-max);
    padding:26px 0 20px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 55%);
    display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:10}
  /* 탈퇴 확인(09-A) — 동의 체크가 버튼 바로 위에 붙는다. 위 40px 동안 투명 → 흰색(본문이 문구 뒤로 들어가며 사라진다)
     2026-10-05 사용자 컨펌 목업 「회원탈퇴 시안 v7」 · 피그마 09-A foot */
  .cta-dock.leave{padding:44px 0 20px;gap:14px;background:linear-gradient(180deg,rgba(255,255,255,0) 0,#fff 40px)}
  .cta-dock.leave .agree{pointer-events:auto;width:calc(100% - 40px);max-width:410px;padding:0 4px}
  /* 폭은 저장소 정본을 따른다 — CLAUDE.md 「CTA 규칙」: 플로팅은 calc(100% - 40px) · max 410.
     피그마 프레임이 320 인 것은 360 기준이라 그런 것이고, 웹 폭(카드 450)과 다른 것이 의도된 상태다
     (career-coach docs/기획/피그마-웹-동기화.md 「폭에 관한 확정 사항」). */
  .cta{width:calc(100% - 40px);max-width:410px;height:var(--cta-h);border:0;border-radius:var(--cta-radius);
    background:var(--amber-500);color:#fff;font:inherit;font-size:var(--cta-fs);font-weight:var(--cta-fw);
    line-height:20px;cursor:pointer;box-shadow:0 12px 32px rgba(217,119,6,.28);pointer-events:auto;
    display:flex;align-items:center;justify-content:center;gap:0;-webkit-tap-highlight-color:transparent}
  .cta:not([disabled]):active{transform:scale(.98)}
  .cta .s2{opacity:.85}
  .cta[disabled]{background:var(--gray-100);color:var(--gray-400);box-shadow:none;cursor:default}
  [hidden]{display:none!important}

  /* 제목·설명 — 온보딩 1단계와 같은 값(피그마 275:2404). 진행 바·단계 줄이 없는 자리라 위만 20 */
  .title{padding:20px var(--pad-x) 0}
  .title h1{font-size:24px;line-height:32px;font-weight:700;letter-spacing:-.01em;color:var(--gray-900)}
  .desc{padding:10px var(--pad-x) 0;color:var(--gray-500);word-break:keep-all}



  /* 구독 해지 — 2026-10-05 사용자 컨펌 「해지 사유 v2·v3」. 탈퇴 화면(mypage/leave)과 같은 틀·같은 값이다.
     아래 탈퇴 화면 주석은 값의 출처라 그대로 둔다.
  /* 회원 탈퇴 — 2026-10-03 사용자 컨펌 「5번」. 멤버십이 남아 있으면 탈퇴를 막는다(서버 0117 도 막는다).
     2026-10-05 사용자 컨펌 목업 「회원탈퇴 시안 v7」 — 아이콘 목록 · 회색 띠 · 이유 중복 선택 · 「기타」 입력 · 멤버십 모달 */
  .lv{padding:40px var(--pad-x) 0;display:flex;flex-direction:column}
  .lst li{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 0;color:var(--gray-700);word-break:keep-all}
  .lst li:first-child{padding-top:0}
  .lst li:last-child{padding-bottom:0}
  .lst li + li{border-top:1px solid var(--gray-100)}
  .tile{flex:none;width:36px;height:36px;border-radius:10px;background:var(--amber-100);display:flex;align-items:center;justify-content:center}
  /* 전체 공고(/jobs/) 요약·목록 사이 띠와 같은 값 — 높이 12 · gray-100 · 화면 끝까지. 위아래 40 */
  .band{height:12px;background:var(--gray-100);margin:40px calc(var(--pad-x) * -1)}
  .t-caption{font-size:13px;line-height:18px;font-weight:400}
  .why{display:flex;flex-direction:column;gap:12px}
  .why h2{font-size:20px;line-height:28px;font-weight:700;color:var(--gray-900);word-break:keep-all}
  .why h2 .multi{font-size:14px;font-weight:400;color:var(--gray-500)}   /* 2026-10-05 사용자 지시 — 15 → 14 (한 단계) */
  .rs{display:flex;flex-direction:column}
  .r{display:flex;align-items:center;gap:12px;width:100%;padding:14px 2px;border:0;border-bottom:1px solid var(--gray-100);
    background:#fff;font:inherit;font-size:15px;line-height:22px;color:var(--gray-700);text-align:left;cursor:pointer;
    -webkit-tap-highlight-color:transparent;transition:color .12s}
  .r:last-child{border-bottom:0}
  .r:active{transform:scale(.97)}
  .r[aria-checked="true"]{color:var(--gray-900);font-weight:600}
  .r[aria-checked="true"] .box{border-color:var(--amber-500);background:var(--amber-500)}
  .r[aria-checked="true"] .box svg{visibility:visible}
  .r .box{margin-top:0}
  .other{border:1.5px solid var(--amber-500);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
  .other textarea{border:0;outline:0;resize:none;height:56px;font:inherit;font-size:14px;line-height:20px;color:var(--gray-900);background:transparent;padding:0}
  .other textarea::placeholder{color:var(--gray-400)}
  .other .cnt{align-self:flex-end;color:var(--gray-400);font-variant-numeric:tabular-nums}
  .agree{display:flex;align-items:flex-start;gap:10px;background:none;border:0;padding:0;font:inherit;text-align:left;cursor:pointer}
  .box{width:20px;height:20px;border-radius:6px;border:1.6px solid var(--gray-300);background:#fff;
    display:flex;align-items:center;justify-content:center;margin-top:1px;flex-shrink:0;transition:background .12s,border-color .12s}
  .box svg{visibility:hidden}
  .agree[aria-checked="true"] .box{border-color:var(--amber-500);background:var(--amber-500)}
  .agree[aria-checked="true"] .box svg{visibility:visible}
  .agree-t{font-size:14px;line-height:20px;color:var(--gray-700)}
  /* 탈퇴 버튼은 앰버가 아니라 짙은 회색 — 권하는 행동이 아니다 */
  .cta.danger{background:var(--gray-800);box-shadow:none}
  .cta.danger[disabled]{background:var(--gray-100);color:var(--gray-400)}
  .err{color:var(--error-600);font-size:13px;line-height:18px;text-align:center;margin-top:16px}
  /* 탈퇴 완료 — 체크·제목·문구 묶음을 「화면 맨 위 ~ 떠 있는 CTA 버튼 윗변」 사이의 정가운데에 (2026-10-03 사용자 지시).
     CTA 윗변 = 화면높이 − 74(버튼 54 + 바닥 20). main 은 헤더(48) 아래에서 시작하므로 아래 여백을 74+48 = 122 로 두면
     main 의 가운데가 그 영역의 가운데와 겹친다. .cta-dock 은 safe-area 를 안 더하므로 여기도 안 더한다. 피그마 09-C 프레임 아래 여백 122 와 같은 값 */
  #bye{padding-bottom:122px}
  .done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 var(--pad-x);gap:14px}
  .ok{width:64px;height:64px;border-radius:50%;background:var(--amber-100);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
  .done .t-display{font-size:24px;line-height:32px;font-weight:700;color:var(--gray-900)}
  .done .desc{padding:0}
  /* 넓은 화면 카드 어포던스 — 랜딩(index.html)의 같은 블록과 값이 같다(2026-09-24 사용자 지시 · 모든 페이지).
     page-audit.mjs 「넓은 화면 바탕」이 빠진 페이지를 막는다. */
  @media (min-width:451px){
    body{background:var(--gray-100)}
    .page{box-shadow:0 0 24px rgba(15,23,42,.06), 0 0 64px rgba(15,23,42,.10)}
  }
</style>
</head>
<body>
<div class="page">
<header class="hd"><a class="back" href="/mypage/billing/" aria-label="뒤로"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15.75 4.5L8.25 12l7.5 7.5" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></header>
<main id="ask">
  <div class="title"><h1>해지하기 전에<br>확인해 주세요</h1></div>
  <div class="lv">
    <ul class="lst">
      <li class="t-body-s"><span class="tile"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5v3M8 10.5v3M2.5 8h3M10.5 8h3M4 4l1.8 1.8M10.2 10.2 12 12M4 12l1.8-1.8M10.2 5.8 12 4"/></svg></span><span>이용 종료일<span id="endA"></span>까지는<br>지금처럼 받아요.</span></li>
      <li class="t-body-s"><span class="tile"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h10v8H3zM3 6.5h10"/></svg></span><span>다음 결제일부터 결제되지 않아요.</span></li>
      <li class="t-body-s"><span class="tile"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5h7v11L8 11l-3.5 2.5z"/></svg></span><span>이용 종료일까지<br>받은 아티클은 계속 볼 수 있어요.</span></li>
      <li class="t-body-s"><span class="tile"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2.5V5h-2.5"/></svg></span><span>이용 종료일 뒤에도<br>언제든 다시 구독할 수 있어요.</span></li>
    </ul>
    <div class="band" aria-hidden="true"></div>
    <div class="why" id="why"><h2>해지하시는 이유를 알려 주세요 <span class="multi">(중복 선택)</span></h2>
      <div class="rs" id="rs" role="group" aria-label="해지하시는 이유"><button class="r" type="button" role="checkbox" aria-checked="false"><span class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>알림이 너무 자주 와요</span></button><button class="r" type="button" role="checkbox" aria-checked="false"><span class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>내용이 도움이 안 돼요</span></button><button class="r" type="button" role="checkbox" aria-checked="false"><span class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>읽을 시간이 없어요</span></button><button class="r" type="button" role="checkbox" aria-checked="false"><span class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>가격이 부담돼요</span></button><button class="r" type="button" role="checkbox" aria-checked="false"><span class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>이직을 마쳤어요</span></button><button class="r" type="button" role="checkbox" aria-checked="false" id="etc"><span class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>기타</span></button></div>
      <div class="other" id="other" hidden><textarea id="otherText" maxlength="2000" rows="3" placeholder="해지하시는 이유를 자유롭게 적어 주세요" aria-label="기타 이유"></textarea><span class="t-caption cnt" id="cnt">0/2,000</span></div>
    </div>
    <p class="err" id="err" role="status" hidden></p>
  </div>
</main>
<main id="bye" hidden>
  <div class="done">
    <span class="ok"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg></span>
    <h1 class="t-display">해지가 예약되었어요</h1>
    <p class="t-body-s desc"><span id="endB"></span>까지는 지금처럼 받아 보실 수 있어요.<br>언제든지 다시 돌아오세요.</p>
  </div>
</main>
<div class="cta-dock leave" id="dock">
  <button class="agree" id="agree" type="button" role="checkbox" aria-checked="false"><span class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="agree-t">위 내용을 전부 꼼꼼히 확인했어요</span></button>
  <button class="cta danger" type="button" id="go" disabled><span id="lab">해지하기</span></button>
</div>
<script type="module">
  import '/assets/track.js';   // 회원 화면 오류 자동 보고 — import 만으로 걸린다
  import { requireLogin, getSubscription, cancelSubscription, dayText, FAIL } from '/assets/mypage-data.js';
  const $ = (id) => document.getElementById(id);
  const go = $('go'), lab = $('lab'), agree = $('agree');
  let 막힘 = true;          // 구독 상태를 읽기 전에는 누를 수 없다
  let 실패 = false;
  function refresh() {
    const ok = agree.getAttribute('aria-checked') === 'true';
    go.disabled = 막힘 || 실패 || !ok;
    lab.textContent = 실패 ? FAIL.line : '해지하기';
  }
  /* 이유는 여러 개 고른다. 「기타」에 체크했을 때만 입력칸이 열린다 — 탈퇴 화면과 같은 동작 */
  const other = $('other'), otherText = $('otherText');
  $('rs').addEventListener('click', (e) => {
    const r = e.target.closest('.r'); if (!r) return;
    const on = r.getAttribute('aria-checked') !== 'true';
    r.setAttribute('aria-checked', on ? 'true' : 'false');
    if (r.id === 'etc') { other.hidden = !on; if (on) otherText.focus(); }
  });
  otherText.addEventListener('input', () => { $('cnt').textContent = otherText.value.length.toLocaleString('ko-KR') + '/2,000'; });
  /* 서버에는 한 줄로 보낸다 — 고른 이유를 「 · 」로 잇고, 기타는 적은 글을 붙인다(탈퇴와 같은 형식) */
  function reasonText() {
    return [...document.querySelectorAll('#rs .r[aria-checked="true"]')].map((r) => {
      const t = r.textContent.trim();
      const memo = r.id === 'etc' ? otherText.value.trim() : '';
      return memo ? `${t}: ${memo}` : t;
    }).join(' · ');
  }
  agree.addEventListener('click', () => {
    agree.setAttribute('aria-checked', agree.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
    refresh();
  });
  let 끝남 = false;   // 완료 뒤 「확인」은 go.onclick 이 맡는다 — 해지를 다시 부르지 않는다
  go.addEventListener('click', async () => {
    if (go.disabled || 끝남) return;
    go.disabled = true; $('err').hidden = true;
    try {
      const r = await cancelSubscription(reasonText());
      끝남 = true;
      $('endB').textContent = dayText(r.current_period_end);
      $('ask').hidden = true; $('bye').hidden = false; agree.hidden = true;
      go.classList.remove('danger'); go.disabled = false; lab.textContent = '확인';
      go.onclick = () => { location.href = '/mypage/billing/'; };
    } catch (e) {
      console.error('해지 실패', e);
      $('err').textContent = '해지하지 못했어요. 잠시 뒤 다시 시도해 주세요.'; $('err').hidden = false;
      refresh();
    }
  });
  refresh();
  /* 해지할 구독이 없거나 이미 예약돼 있으면 이 화면에 머물 이유가 없다 — 멤버십·결제로 돌려보낸다 */
  requireLogin().then((ok) => ok ? getSubscription() : undefined).then((s) => {
    if (s === undefined) return;
    if (!s || !['trialing', 'active', 'past_due'].includes(s.status) || s.cancel_at_period_end) {
      location.replace('/mypage/billing/'); return;
    }
    $('endA').textContent = `(${dayText(s.current_period_end)})`;
    막힘 = false; refresh();
  }, () => { 실패 = true; refresh(); });
</script>
</div>
</body>
</html>
