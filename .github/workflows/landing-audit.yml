# pre-push 훅의 검수를 리눅스에서 다시 돌린다.
#
# 왜 있는가 (2026-08-13)
#   훅의 1~2겹은 전부 node 로 도는데 **사용자 PC 3대에 node 가 없을 수 있다**
#   (2026-08-11 실측: DESKTOP-F7S1OEL). 전에는 가드가 없어서 node 가 없으면 훅이
#   "깨진 링크·빠진 head" 라는 엉뚱한 진단으로 푸시를 막았고, 이 저장소 훅에는
#   CC_SKIP_HOOK 같은 부분 우회가 없어 빠져나갈 길이 `--no-verify`(= 6겹 전부 끄기)뿐이었다.
#
#   그래서 훅은 node 가 없으면 **막지 않고 건너뛴다.** 그 대신 여기가 있다 —
#   건너뛴 것이 사라지지 않고 리눅스에서 다시 돈다. 훅을 느슨하게 한 것이 아니라 옮긴 것이다.
#
#   맨 뒤의 인터렉션 기록 배선(2026-10-21)만 브라우저를 쓴다 — 나머지는 브라우저도 피그마 덤프도 필요 없다(실측).
#   어드민 셸 검수는 ops-audit.yml 에 따로 있다.
#
#   🔴 여기에 **넣지 않은** 것 둘 — 라이브 피그마 덤프가 필요해서다. 덤프는 저장소에 없고
#      use_figma 는 CI 에서 못 부른다.
#        · 2겹b (audit.mjs)      — 2026-10-06 은퇴, 10-13 파일 삭제(랜딩 피그마 프레임이 레거시로 옮겨짐).
#        · 1.2겹 (tree-audit.mjs) — 덤프 없이 부르면 "🚫 검수 미실행" 을 찍고 **종료코드 0** 이다.
#          한 번 넣었다가 뺐다 — 항상 초록인 스텝은 "봤다" 는 착각만 만든다(검사관 지적).
name: 랜딩 검수

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: '1.62.1'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 🔴 fetch-depth: 0 이 꼭 필요하다. 기본값(얕은 클론)에서는
      #    `git log -1 --format=%cI -- <파일>` 이 **모든 경로에 대해 tip 커밋 날짜**를 준다.
      #    그러면 docs-audit 의 신선도 판정이 "오늘 고쳤다" 로 읽어 멀쩡한 스냅샷을
      #    전부 '낡음' 으로 막는다 — 이 워크플로 첫 실행이 정확히 그렇게 죽었다(2026-08-13).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 이 저장소에는 package.json 이 없다(.gitignore 가 막는다). 셋 다 의존성이 없어서
      # 설치할 것이 없다 — 없다는 사실 자체를 여기서 드러내 둔다.
      - name: 결과물 공통 점검 (1겹)
        run: node tools/figma-audit/page-audit.mjs

      - name: 온보딩 직군 목록 ↔ taxonomy.json (1.5겹)
        run: node tools/roles/build.mjs --check
      - name: 옛 브라우저 문법 (iOS 14·크롬 88 이 못 읽는 ES2021+ — 2026-10-19)
        run: node tools/syntax/check.mjs

      - name: 약관·개인정보·가입·온보딩 문구 대조 (2겹a)
        run: node tools/figma-audit/docs-audit.mjs

      # 훅에도 단다(1.8겹) — 낡으면 배포 직후 10분 동안 새 HTML 이 옛 모듈을 써서 화면이 멈출 수 있다(2026-10-22).
      - name: 자산 주소의 판이 최신인가 (tools/asset-version)
        run: node tools/asset-version/build.mjs --check

      # 훅에는 안 단다 — 문구 한 줄 고칠 때마다 푸시가 막히면 안 된다. 낡아도 화면은 그대로이고 미리받기만 덜 된다.
      - name: 미리받기 묶음이 최신인가 (tools/preload)
        run: node tools/preload/build.mjs --check

      # 인터렉션 기록 배선 (2026-10-21 사용자 지시 「새 랜딩을 배포해도 인터렉션이 집계에서 누락되지 않게 강하게」).
      # 전에는 「랜딩 버전 보관」의 맨 뒤에만 있어 index.html·assets 가 바뀐 main 푸시에서만 돌았다 — PR 과 점검 도구만
      # 고친 푸시는 안 봤다. 여기서는 모든 푸시·PR 에서 진짜 화면으로 선언한 열쇠가 실제로 기록되는지, 칸 밖에 손 조작이
      # 남지 않았는지 본다. 위 검수가 실패해도 이 결과는 따로 보이게 always 로 둔다.
      - name: playwright 설치 (인터렉션 기록 배선용)
        if: always()
        run: |
          npm install --no-save --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
      - name: 인터렉션 기록 배선 (훅 1.7겹)
        if: always()
        run: node tools/ix-audit/run.mjs
