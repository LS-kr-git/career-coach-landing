<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<meta name="format-detection" content="telephone=no">
<title>회원가입 — 커리어코치</title>
<meta name="description" content="카카오 계정에서 받아오는 회원정보를 확인하고 가입을 마칩니다.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/logo-circle.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    color-scheme: only light;
    --amber-500:#F59E0B; --amber-600:#D97706;
    --navy-900:#1E3A8A; --navy-500:#3B82F6;
    --gray-50:#F8FAFC; --gray-100:#F1F5F9; --gray-200:#E2E8F0; --gray-400:#94A3B8;
    --gray-500:#64748B; --gray-600:#475569; --gray-700:#334155; --gray-800:#1E293B;
    --error-600:#DC2626;
    /* CTA 토큰 — CLAUDE.md "CTA 규칙" 공통값 */
    --cta-h:54px; --cta-radius:14px; --cta-fs:15px; --cta-fw:700;
    /* 랜딩과 동일한 폭 시스템 */
    --pad-x: 24px;
    --card-max: 450px;
    --content-max: 402px;
    /* 피그마 567:2638 실측 — 라벨 열 폭. Gothic A1 자연폭 최댓값(89)+버퍼 4 */
    --label-w: 93px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--gray-100)}
  body{
    font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;
    background:#fff; color:var(--gray-800); -webkit-font-smoothing:antialiased;
  }
  /* CLAUDE.md 규칙 — 화면 채우기 높이는 svh */
  .page{width:100%;max-width:var(--card-max);margin:0 auto;background:#fff;
    min-height:100vh;min-height:100svh;display:flex;flex-direction:column}

  header{display:flex;align-items:center;gap:10px;padding:24px var(--pad-x)}
  .app-icon{width:29px;height:29px;border-radius:25%;background:linear-gradient(135deg,#F59E0B,#D97706);display:flex;align-items:center;justify-content:center}
  .app-icon img{width:21px;height:21px;display:block}
  header .wordmark{height:21px;display:block}

  main{flex:1;display:flex;flex-direction:column;padding:8px var(--pad-x) 32px}
  .content{max-width:var(--content-max);width:100%;margin:0 auto;
    display:flex;flex-direction:column;gap:28px;padding:24px 0 0}
  h1{font-size:28px;line-height:36px;font-weight:800;letter-spacing:-0.01em;color:var(--navy-900)}
  .sub{font-size:15px;line-height:23px;color:var(--gray-600);margin-top:10px}

  .sec{display:flex;flex-direction:column;gap:10px}
  .sec-head{background:var(--gray-100);border-radius:8px;padding:6px 10px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:13px;line-height:18px;font-weight:600;color:var(--gray-700)}
  .sec-head .req{color:var(--navy-500)}
  .sec-head .opt{color:var(--gray-500)}

  .fields{display:flex;flex-direction:column;gap:8px}
  .field{display:flex;align-items:center;gap:10px}
  .field .k{flex:none;width:var(--label-w);font-size:13px;line-height:18px;color:var(--gray-600)}
  .field .v{flex:1;min-width:0;height:38px;border:1px solid var(--gray-200);border-radius:8px;
    background:#fff;display:flex;align-items:center;padding:0 12px;
    font-size:13px;line-height:18px;color:var(--gray-700);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .note{font-size:13px;line-height:18px;color:var(--gray-500)}

  .agree{list-style:none;display:flex;flex-direction:column;gap:12px}
  .agree li{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .agree-item{display:flex;align-items:center;gap:8px;cursor:pointer;
    padding:6px 0;margin:-6px 0}   /* 탭 영역만 넓힌다 — 보이는 높이는 20 그대로 */
  .agree-item input{position:absolute;width:1px;height:1px;opacity:0}
  .box{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--gray-400);
    background:#fff;display:flex;align-items:center;justify-content:center;
    transition:background .12s,border-color .12s}
  .box::after{content:'';width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;
    transform:rotate(-45deg) translate(1px,-1px);opacity:0}
  .agree-item input:checked + .box{background:var(--navy-500);border-color:var(--navy-500)}
  .agree-item input:checked + .box::after{opacity:1}
  .agree-item input:focus-visible + .box{outline:2px solid var(--amber-500);outline-offset:2px}
  .agree-txt{font-size:13px;line-height:18px;color:var(--gray-700)}
  .agree-txt em{font-style:normal;color:var(--navy-500)}
  .agree-txt em.o{color:var(--gray-500)}
  .agree .view{flex:none;font-size:13px;line-height:18px;color:var(--gray-500);
    text-decoration:none;padding:6px 0;margin:-6px 0}

  .spacer{flex:1;min-height:24px}

  .actions{max-width:var(--content-max);width:100%;margin:0 auto}
  .cta{width:100%;height:var(--cta-h);border:0;border-radius:var(--cta-radius);
    background:var(--amber-500);color:#fff;
    font-size:var(--cta-fs);line-height:20px;font-weight:var(--cta-fw);font-family:inherit;
    display:flex;align-items:center;justify-content:center;cursor:pointer}
  .cta:active{transform:scale(.98)}
  .cta[disabled]{opacity:.6;cursor:default;transform:none}
  .err{display:none;margin-top:14px;font-size:13px;line-height:19px;color:var(--error-600);text-align:center}
  .err.on{display:block}

  @media (min-width:451px){
    body{background:var(--gray-100)}
    .page{box-shadow:0 0 24px rgba(15,23,42,.06), 0 0 64px rgba(15,23,42,.10)}
  }
  :focus-visible{outline:2px solid var(--amber-500);outline-offset:2px}
</style>
</head>
<body>
<div class="page">
  <header>
    <a href="/" aria-label="커리어코치 홈" style="display:flex;align-items:center;gap:10px;text-decoration:none">
      <span class="app-icon"><img src="/assets/mark-white.svg" alt=""></span>
      <img class="wordmark" src="/assets/wordmark.svg" alt="커리어코치">
    </a>
  </header>

  <main>
    <div class="content">
      <div class="lead-group">
        <h1>회원가입</h1>
        <p class="sub">카카오 계정에서 받아온 정보예요.<br>확인하고 가입을 마쳐 주세요.</p>
      </div>

      <section class="sec" aria-label="필수 회원정보">
        <div class="sec-head"><span>필수 회원정보</span><span class="req">필수</span></div>
        <div class="fields">
          <div class="field"><span class="k">이름</span><span class="v" id="fName"></span></div>
          <div class="field"><span class="k">휴대전화번호</span><span class="v" id="fPhone"></span></div>
          <div class="field"><span class="k">이메일</span><span class="v" id="fEmail"></span></div>
          <div class="field"><span class="k">생일 · 출생 연도</span><span class="v" id="fBirth"></span></div>
        </div>
        <p class="note">회원 식별·본인 확인, 알림톡 브리핑 발송, 결제·환불 고지에 사용합니다.</p>
      </section>

      <section class="sec" aria-label="약관 동의">
        <div class="sec-head"><span>약관 동의</span><span class="req">필수</span></div>
        <ul class="agree">
          <li>
            <label class="agree-item">
              <input type="checkbox" id="agreeTerms" data-required>
              <span class="box" aria-hidden="true"></span>
              <span class="agree-txt"><em>[필수]</em> 이용약관 동의</span>
            </label>
            <a class="view" href="/terms.html" target="_blank" rel="noopener" aria-label="이용약관 보기">보기</a>
          </li>
          <li>
            <label class="agree-item">
              <input type="checkbox" id="agreePrivacy" data-required>
              <span class="box" aria-hidden="true"></span>
              <span class="agree-txt"><em>[필수]</em> 개인정보 수집·이용 동의</span>
            </label>
            <a class="view" href="/privacy.html" target="_blank" rel="noopener" aria-label="개인정보 수집·이용 동의 내용 보기">보기</a>
          </li>
          <li>
            <label class="agree-item">
              <input type="checkbox" id="agreeMarketing">
              <span class="box" aria-hidden="true"></span>
              <span class="agree-txt"><em class="o">[선택]</em> 마케팅·이벤트 정보 수신</span>
            </label>
            <a class="view" href="/privacy.html" target="_blank" rel="noopener" aria-label="마케팅·이벤트 정보 수신 내용 보기">보기</a>
          </li>
        </ul>
      </section>
    </div>

    <div class="spacer"></div>

    <div class="actions">
      <button type="button" class="cta" id="doneBtn" disabled>가입 완료하고 시작하기</button>
      <p class="err" id="err" role="alert"></p>
    </div>
  </main>
</div>

<script type="module">
  // 필수 동의 게이트. ★ supabase CDN 블록과 **분리**한다 — 같은 모듈에 두면 CDN 이
  //   느리거나 막힌 순간 체크박스가 통째로 안 먹어 버튼이 영영 비활성으로 남는다.
  const btn = document.getElementById('doneBtn');
  const required = [...document.querySelectorAll('.agree input[data-required]')];
  window.ccAgreeOk = () => required.every((b) => b.checked);
  const sync = () => { btn.disabled = !window.ccAgreeOk(); };
  document.querySelectorAll('.agree input[type="checkbox"]')
    .forEach((b) => b.addEventListener('change', sync));
  sync();   // 뒤로가기로 돌아왔을 때 브라우저가 복원한 체크 상태를 반영한다
</script>

<script type="module">
  import { pageView, track } from '/assets/track.js';
  pageView('signup_info_view');
</script>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  // 접속 정보는 /assets/supabase-config.js 한 곳에만 둔다 (2026-08-06 복구 훈련 결과).
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from '/assets/supabase-config.js';
  const { track } = await import('/assets/track.js');

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const btn = document.getElementById('doneBtn');
  const err = document.getElementById('err');
  const DONE_KEY = 'cc_signup_done';

  const { data: { session } } = await supabase.auth.getSession();

  // 이미 가입을 마친 사람에게 다시 보여주지 않는다.
  if (session && localStorage.getItem(DONE_KEY) === '1') location.replace('/onboarding/1/');

  // ★ 미로그인이어도 리다이렉트하지 않는다 — 빈 상태 그대로 보여준다.
  //   카카오 동의항목 심사는 "개인정보를 입력하지 않은 상태의 회원가입 화면" 을 요구하는데,
  //   이 페이지가 그 상태로 열리므로 목업을 따로 만들 필요가 없다. 라이브 화면이 곧 제출본이다.
  if (session) {
    const m = session.user.user_metadata || {};
    const birth = [m.birthyear, m.birthday && String(m.birthday).replace(/^(\d{2})(\d{2})$/, '$1-$2')]
      .filter(Boolean).join(' · ');
    const put = (id, v) => { document.getElementById(id).textContent = v || ''; };
    put('fName',  m.name || m.full_name);
    put('fPhone', session.user.phone || m.phone_number);
    put('fEmail', session.user.email || m.email);
    put('fBirth', birth);
  }

  btn.addEventListener('click', async () => {
    if (!window.ccAgreeOk()) return;
    // 미로그인 방문자는 여기서 카카오 로그인부터 시작한다.
    if (!session) { location.href = '/signup/'; return; }

    btn.disabled = true;
    err.classList.remove('on');
    const marketing = document.getElementById('agreeMarketing').checked;
    try {
      // ⚠️ 이건 분석 이벤트지 동의 원부가 아니다. user_consent 는 설계상 클라이언트가 못 쓴다
      //    (0002 RLS · 0006 주석 — "클라이언트가 쓰면 동의 증거력이 없다").
      //    선택 동의를 원부로 남기려면 consent_document 에 마케팅 항목을 추가하고
      //    SECURITY DEFINER RPC 를 여는 마이그레이션이 필요하다. 별건으로 남겨 둔다.
      await track('signup_complete', { marketing }, session.access_token);
    } catch (e) { /* 추적 실패로 가입을 막지 않는다 */ }
    localStorage.setItem(DONE_KEY, '1');
    location.replace('/onboarding/1/');
  });
</script>
</body>
</html>
