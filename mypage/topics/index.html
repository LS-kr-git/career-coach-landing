<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only light">
<meta name="format-detection" content="telephone=no">
<title>인사이트 받을 주제 — 커리어코치</title>
<meta name="description" content="커리어코치에서 받아볼 인사이트 주제를 고릅니다.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/logo-circle.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    color-scheme: only light;
    --amber-50:#FFFBEB; --amber-100:#FEF3C7; --amber-500:#F59E0B; --amber-600:#D97706;
    --amber-700:#B45309; --amber-800:#92400E; --amber-950:#451A03;
    --emerald-500:#10B981;
    --gray-50:#F8FAFC; --gray-100:#F1F5F9; --gray-200:#E2E8F0; --gray-300:#CBD5E1;
    --gray-400:#94A3B8; --gray-500:#64748B; --gray-600:#475569; --gray-700:#334155;
    --gray-800:#1E293B; --gray-900:#0F172A; --stone-50:#FAFAF9;
    /* CTA 토큰 — CLAUDE.md 「CTA 규칙」 공통값 */
    --cta-h:54px; --cta-radius:14px; --cta-fs:15px; --cta-fw:700;
    /* 랜딩과 동일한 폭 시스템 */
    --pad-x:24px; --card-max:450px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--gray-100)}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;
    background:#fff;color:var(--gray-800);-webkit-font-smoothing:antialiased}
  /* CLAUDE.md 규칙 — 화면 채우기 높이는 svh */
  .page{width:100%;max-width:var(--card-max);margin:0 auto;background:#fff;
    min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
  /* 헤더·뒤로가기 — CLAUDE.md 「헤더와 뒤로가기 표준값」 (피그마 376:2507) */
  .hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;
    height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;background:#fff}
  .back{width:48px;height:48px;display:flex;align-items:center;justify-content:center;position:relative}
  .back svg{position:relative;z-index:1}
  .back::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:36px;height:36px;border-radius:10px;background:transparent;transition:background .12s}
  .back:active::before{background:var(--gray-100)}
  main{flex:1;display:flex;flex-direction:column;width:100%;max-width:var(--card-max);margin:0 auto}
  /* 피그마 텍스트 스타일 대응 (careercoach 컬렉션 text/*) */
  .t-display{font-size:28px;line-height:36px;font-weight:800;letter-spacing:-.02em;color:var(--gray-900)}
  .t-body-s{font-size:14px;line-height:20px;font-weight:400}
  .t-caption{font-size:13px;line-height:18px;font-weight:400}
  .t-micro{font-size:11px;line-height:14px;font-weight:500}
  /* 하단 플로팅 CTA — 320×54, 좌우 20 (피그마와 같은 값) */
  .cta-dock{position:sticky;bottom:0;padding:12px 0 20px;background:#fff;
    display:flex;justify-content:center}
  /* 폭은 저장소 정본을 따른다 — CLAUDE.md 「CTA 규칙」: 플로팅은 calc(100% - 40px) · max 410.
     피그마 프레임이 320 인 것은 360 기준이라 그런 것이고, 웹 폭(카드 450)과 다른 것이 의도된 상태다
     (career-coach docs/기획/피그마-웹-동기화.md 「폭에 관한 확정 사항」). */
  .cta{width:calc(100% - 40px);max-width:410px;height:var(--cta-h);border:0;border-radius:var(--cta-radius);
    background:var(--amber-500);color:#fff;font:inherit;font-size:var(--cta-fs);font-weight:var(--cta-fw);
    line-height:20px;cursor:pointer;box-shadow:0 4px 12px rgba(217,120,5,.22);
    display:flex;align-items:center;justify-content:center;gap:0}
  .cta[disabled]{background:var(--gray-100);color:var(--gray-400);box-shadow:none;cursor:default}
  [hidden]{display:none!important}

  .title{padding:20px var(--pad-x) 9px}
  .desc{padding:10px var(--pad-x);color:var(--gray-500);word-break:keep-all}

  .chip{border:0;background:#fff;box-shadow:inset 0 0 0 1px var(--gray-200);border-radius:10px;
    padding:9px 12px;font:inherit;font-size:13px;line-height:18px;font-weight:400;color:var(--gray-600);
    cursor:pointer;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--amber-50);box-shadow:inset 0 0 0 1px var(--amber-500);color:var(--amber-600)}

  /* 「내 직군 추천」·「다른 주제」 두 묶음 — 온보딩 4단계(4-A)와 같은 모양 (2026-10-05 사용자 확정 M2, 피그마 908:623) */
  .grp{padding:24px var(--pad-x) 10px;font-size:13px;line-height:18px;font-weight:600;color:var(--gray-500)}
  .topics{padding:0 var(--pad-x);display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start}
  .chip{display:inline-flex;align-items:center;gap:4px}
  .rec{padding:1px 6px;border-radius:6px;background:var(--amber-500);color:#fff;font-size:11px;line-height:14px;font-weight:700}

  /* 요일 블록 — 온보딩 최종 확인 화면의 K1 과 같은 값 */
  .days-title{padding:28px var(--pad-x) 0;font-size:15px;line-height:21px;font-weight:700;color:var(--gray-900)}
  .days{margin:12px var(--pad-x) 24px;background:var(--amber-50);border-radius:16px;padding:6px 16px}
  .dy{display:flex;gap:12px;padding:12px 0}
  .dy + .dy{box-shadow:inset 0 1px 0 var(--amber-100)}
  .dy .wd{flex:none;width:46px;font-size:13px;line-height:20px;font-weight:600;color:var(--amber-700)}
  .dy .nm{font-size:14px;line-height:20px;font-weight:700;color:var(--gray-900)}
  .dy .ds{margin-top:2px;font-size:12px;line-height:17px;color:var(--gray-500)}

  /* 넓은 화면 카드 어포던스 — 랜딩(index.html)의 같은 블록과 값이 같다(2026-09-24 사용자 지시 · 모든 페이지).
     page-audit.mjs 「넓은 화면 바탕」이 빠진 페이지를 막는다. */
  @media (min-width:451px){
    body{background:var(--gray-100)}
    .page{box-shadow:0 0 24px rgba(15,23,42,.06), 0 0 64px rgba(15,23,42,.10)}
  }
</style>
</head>

    var s = readState();
    /* 「내 직군 추천」 — 온보딩 4단계와 같은 규칙(발송 경로와 같은 규칙)으로 저장된 직군에서 푼다.
       목록에 없는 트랙이 나오면 추천 없이 그린다 — 없는 칩을 지어내지 않는다. */
    var r = trackFromJobs(readTopicMap(), s.jobs);
    if (topics.indexOf(r) < 0) r = null;
    /* 저장된 주제가 없으면 추천을, 그것도 없으면 마크업이 눌러 둔 칩(피그마 기준 상태)을 쓴다.
       옛 칩 이름(「일하는 사람 공통」, 2026-10-03 에 바뀜)이 남아 있으면 목록에 없어 아무 칩도 안 눌린다 —
       그러면 저장 버튼이 빈 손이 된다. 그때도 같은 순서로 돌린다. */
    var on = s.topic;
    if (topics.indexOf(on) < 0) on = r || current();
    document.getElementById('gRec').hidden = rec.hidden = document.getElementById('gRest').hidden = !r;
    rec.innerHTML = r ? chipHtml(r, r === on, true) : '';
    rest.innerHTML = topics.filter(function (t) { return t !== r; })
      .map(function (t) { return chipHtml(t, t === on, false); }).join('');
    paint(on);
  }, function () {
    /* 🔴 못 읽었으면 남의 값일 수도 있는 것을 저장하게 두지 않는다 — 고르기를 막고 실패를 말한다. */
    cta.disabled = true;
    cta.textContent = FAIL.line;
  });

  document.querySelector('main').addEventListener('click', function (e) {
    var chip = e.target.closest('.topics .chip');
    if (!chip) return;
    chips().forEach(function (c) { c.setAttribute('aria-pressed', c === chip ? 'true' : 'false'); });
    paint(chip.dataset.topic);
  });

  /* 저장은 온보딩과 같은 통로(save_onboarding)다 — 직군·연차·근무지는 건드리지 않고 주제만 실린다.
     통신 실패는 store 가 pending 으로 남겨 다음 진입에서 다시 보낸다(온보딩 세 화면·직군 화면과 같다). */
  cta.addEventListener('click', function () {
    cta.disabled = true;
    /* 진입할 때 띄운 retryPending() 이 아직 돌고 있으면 store 가 'busy' 를 준다 — 실패가 아니라
       「지금은 못 보낸다」다. 한 번 기다렸다 다시 보낸다(그 재시도가 끝나면 자리가 빈다). */
    var 이전주제 = readState().topic;
    writeState({ topic: current(), topicClear: false });
    (function 보낸다(남은기회) {
      saveOnboarding().then(function (r) {
        if (r.status === 'busy' && 남은기회 > 0) { setTimeout(function () { 보낸다(남은기회 - 1); }, 400); return; }
        if (r.status === 'no-session') return;   // store 가 이미 /signup/ 으로 보냈다
        /* 🔴 저장된 것만 저장됐다고 말한다. 'incomplete'(직군·연차·근무지가 이 브라우저에 없다)면
           보낼 것이 없어 재시도 대상도 아니다 — 고른 값을 **되돌려** 둔다. 안 되돌리면 다음 진입에서
           pullFromServer 가 서버에 행이 없어 아무것도 안 덮고, 안 나간 주제가 눌린 채로 보인다. */
        if (r.status === 'incomplete') writeState({ topic: 이전주제, topicClear: false });
        if (r.status !== 'ok') { cta.textContent = FAIL.line; return; }
        location.href = '/mypage/';
      });
    })(5);
  });
</script>
</div>
</body>
</html>
