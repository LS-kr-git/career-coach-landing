# 랜딩 버전 보관 (2026-10-15 사용자 확정 — 어드민 「가입 퍼널」의 「랜딩 섹션 도달률」)
#
# main 에 랜딩이 밀리면, 그 랜딩이 새 버전(index.html 의 cc-lv 지문)일 때만 섹션 그림 · 화면 사본 ·
# 섹션 이름을 landing-versions 가지에 남긴다. 어드민이 그 가지를 읽어 버전 목록 · 썸네일 · 「화면 보기」를 그린다.
# 지문이 그대로인 배포는 아무것도 안 남긴다(그 판정은 tools/landing-version/capture.mjs 가 한다).
#
# 🔴 main 이 아니라 따로 둔 가지에 민다 — main 에 밀면 페이지 배포가 또 돌고, 옛 랜딩 사본이 공개 주소로 나간다.
# 🔴 「걸린 시각」은 이 작업이 도는 시각이다. 어드민의 6시간 규칙(6시간 안에 다음 랜딩이 오면 버전으로 안 친다)이 이 값으로 잰다.
name: 랜딩 버전 보관

on:
  push:
    branches: [main]
    paths: ['index.html', 'assets/**']
  workflow_dispatch:

permissions:
  contents: write

# 두 배포가 겹치면 차례로 돈다 — 앞 것을 끊으면 그 버전이 영영 안 남는다.
concurrency:
  group: landing-version
  cancel-in-progress: false

env:
  PLAYWRIGHT_VERSION: '1.62.1'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 크로미움 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: playwright 설치
        run: |
          npm install --no-save --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      # 가지가 아직 없으면(첫 실행) 빈 가지로 시작한다.
      - name: 보관 가지 펼치기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin landing-versions >/dev/null; then
            git fetch --depth=1 origin landing-versions
            git worktree add ../versions FETCH_HEAD --detach
          else
            git worktree add --detach ../versions
            git -C ../versions checkout --orphan landing-versions-new
            git -C ../versions rm -rfq .
          fi

      - name: 새 버전이면 남기기
        run: node tools/landing-version/capture.mjs ../versions

      # 다른 실행이 그 사이 같은 가지에 밀었으면 그 위에 다시 얹는다(같은 지문이면 capture 가 아무것도 안 바꾼다).
      - name: 보관 가지에 밀기
        working-directory: ../versions
        run: |
          git add -A
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -qm "랜딩 버전 보관 — ${GITHUB_SHA::7}"
          for i in 1 2 3; do
            if git push origin HEAD:refs/heads/landing-versions; then exit 0; fi
            git fetch --depth=1 origin landing-versions && git rebase FETCH_HEAD || exit 1
          done
          exit 1

      # 인터렉션 기록 배선 (2026-10-20 사용자 지시 — 첫 화면 인터렉션이 안 재지고 있었다). 선언(data-ix)만 보는
      # page-audit 과 달리 진짜 화면에서 손 조작을 하고 열쇠가 실제로 기록되는지 본다. 보관을 막지 않게 맨 뒤에 둔다.
      - name: 인터렉션 기록 배선 점검
        if: always()
        run: node tools/ix-audit/run.mjs
